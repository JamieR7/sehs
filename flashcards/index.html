  <title>IGCSE PE Flashcards - Collège du Léman</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 
            sans: ['Gotham', 'Helvetica', 'Arial', 'sans-serif'],
            serif: ['Georgia', 'serif']
          },
          colors: { 
            cdlNavy: '#004587', 
            cdlBrightBlue: '#1EB9DC', 
            cdlBrightRed: '#EF8162',
            cdlRed: '#E73037',
            cdlGold: '#FBBA07' 
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Gotham', 'Helvetica', 'Arial', sans-serif; 
      background-color: #f8f9fa;
    }
    
    /* Image Occlusion Mask Styles */
    .mask {
      position: absolute;
      background-color: #004587; /* cdlNavy */
      border: 2px solid #FBBA07; /* cdlGold */
      transition: all 0.2s ease;
      user-select: none;
      border-radius: 2px;
    }
    .mask.active {
      background-color: #E73037; /* cdlRed */
      border-color: #ffffff;
      box-shadow: 0 0 16px rgba(231, 48, 55, 0.8);
      animation: pulse 1.5s infinite;
      z-index: 10;
      cursor: pointer;
    }
    .mask.revealed {
      opacity: 0;
      pointer-events: none;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* Custom Scrollbar for Dropdown */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>

    </div>

    window.addEventListener('DOMContentLoaded', async () => {
      setupKeyboardShortcuts();
      try {
        const res = await fetch('manifest.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        manifestData = await res.json();

        // CONDITIONAL FILTERING: Verify questions exist
        activeCategories = [];
        for (const cat of manifestData.categories) {
          const validTopics = [];
          for (const top of cat.topics) {
            try {
              const tRes = await fetch(top.file);
              if (tRes.ok) {
                const tData = await tRes.json();
                if (tData.masks && tData.masks.length > 0) {
                  topicCache[top.id] = tData;
                  validTopics.push(top);
                }
              }
            } catch (e) {
              // File doesn't exist yet — skip silently
            }
          }
          if (validTopics.length > 0) {
            activeCategories.push({ name: cat.name, topics: validTopics });
          }
        }

        renderTopicMenu();

        if (activeCategories.length === 0) {
          showEmptyState("No question files found in your /json/ folder yet. Use ankibuilder.html to map your first diagram!");
          return;
        }

        const params = new URLSearchParams(window.location.search);
        const topicParam = params.get('topics') || params.get('topic');
        if (topicParam) {
          const requestedIds = topicParam.split(',').map(s => s.trim());
          document.querySelectorAll('.topic-checkbox').forEach(cb => {
            cb.checked = requestedIds.includes(cb.value);
          });
          updateBadgeCount();
          await applyTopicSelection(false);
        } else {
          // Leave all unchecked by default and display welcoming prompt
          updateBadgeCount();
          showEmptyState("Select one or more topics from the menu above to get started! 🏃‍♂️💨");
        }
      } catch (err) {
        showEmptyState("Could not load manifest.json. Ensure the file is in your root folder.");
      }
    });

    function renderTopicMenu() {
      const container = document.getElementById('topic-list-container');
      container.innerHTML = '';

      activeCategories.forEach((cat, catIdx) => {
        const section = document.createElement('div');
        section.className = 'border border-slate-200 rounded-xl overflow-hidden bg-white mb-3 shadow-sm';

        const topicsHtml = cat.topics.map(top => `
          <label class="flex items-center gap-3 py-2.5 px-3 rounded-lg hover:bg-slate-50 text-sm text-slate-700 cursor-pointer transition-colors">
            <input type="checkbox" value="${top.id}" data-cat="${catIdx}"
                   class="topic-checkbox accent-cdlNavy w-4 h-4 rounded cursor-pointer"
                   onchange="onTopicCheckboxChange(${catIdx})">
            <span class="flex-1 font-medium">${top.title}</span>
            <span class="text-[10px] bg-slate-100 text-cdlNavy font-bold px-2 py-1 rounded-full">${topicCache[top.id].masks.length} Qs</span>
          </label>
        `).join('');

        section.innerHTML = `
          <div class="flex items-center justify-between px-4 py-3 bg-slate-50/80 border-b border-slate-100 cursor-pointer" onclick="toggleCategoryCollapse(${catIdx})">
            <label class="flex items-center gap-3 text-[13px] font-bold text-cdlNavy uppercase tracking-wider cursor-pointer" onclick="event.stopPropagation()">
              <input type="checkbox" id="cat-cb-${catIdx}" class="accent-cdlNavy w-4 h-4 rounded cursor-pointer"
                     onchange="toggleCategoryCheckboxes(${catIdx}, this.checked)">
              <span>${cat.name}</span>
            </label>
            <button type="button" class="text-slate-400 hover:text-cdlBrightBlue text-xs px-2 py-1 transition-colors">
              <span id="cat-arrow-${catIdx}">▼</span>
            </button>
          </div>
          <div id="cat-body-${catIdx}" class="p-2.5 space-y-1">
            ${topicsHtml}
          </div>
        `;
        container.appendChild(section);
      });
    }

    function toggleCategoryCollapse(catIdx) {
      const body = document.getElementById(`cat-body-${catIdx}`);
      const arrow = document.getElementById(`cat-arrow-${catIdx}`);
      const isHidden = body.classList.toggle('hidden');
      arrow.innerText = isHidden ? '▶' : '▼';
    }

    function toggleCategoryCheckboxes(catIdx, checked) {
      document.querySelectorAll(`.topic-checkbox[data-cat="${catIdx}"]`).forEach(cb => {
        cb.checked = checked;
      });
      updateBadgeCount();
    }

    function onTopicCheckboxChange(catIdx) {
      updateCategoryParentCheckbox(catIdx);
      updateBadgeCount();
    }

    function updateCategoryParentCheckbox(catIdx) {
      const children = Array.from(document.querySelectorAll(`.topic-checkbox[data-cat="${catIdx}"]`));
      const parentCb = document.getElementById(`cat-cb-${catIdx}`);
      if (!parentCb || children.length === 0) return;
      const checkedCount = children.filter(c => c.checked).length;
      parentCb.checked = checkedCount === children.length;
      parentCb.indeterminate = checkedCount > 0 && checkedCount < children.length;
    }

    function selectAllTopics(status) {
      document.querySelectorAll('.topic-checkbox').forEach(cb => cb.checked = status);
      activeCategories.forEach((_, idx) => updateCategoryParentCheckbox(idx));
      updateBadgeCount();
    }

    function updateBadgeCount() {
      const count = document.querySelectorAll('.topic-checkbox:checked').length;
      document.getElementById('selected-count-badge').innerText = count;
      document.getElementById('mobile-badge').innerText = count;
    }

    function toggleTopicMenu(forceState) {
      const panel = document.getElementById('topic-dropdown-panel');
      if (typeof forceState === 'boolean') {
        panel.classList.toggle('hidden', !forceState);
      } else {
        panel.classList.toggle('hidden');
      }
    }

    window.addEventListener('click', (e) => {
      const panel = document.getElementById('topic-dropdown-panel');
      const btnDesktop = document.getElementById('topic-menu-btn');
      const btnMobile = document.querySelector('.md\\:hidden button');
      if (!panel.classList.contains('hidden') && !panel.contains(e.target) && !btnDesktop.contains(e.target) && (!btnMobile || !btnMobile.contains(e.target))) {
        panel.classList.add('hidden');
      }
    });

    async function applyTopicSelection(closeMenu = true) {
      if (closeMenu) toggleTopicMenu(false);

      const checked = Array.from(document.querySelectorAll('.topic-checkbox:checked'));
      if (checked.length === 0) {
        showEmptyState("Please select at least one topic from the menu! 🎯");
        return;
      }

      sessionQueue = [];
      totalReviewsCount = 0;
      againCount = 0;

      for (const cb of checked) {
        const topicId = cb.value;
        const data = topicCache[topicId];
        if (data && data.masks) {
          const topicCards = data.masks.map(m => ({ topicId, maskId: m.id }));
          topicCards.sort(() => Math.random() - 0.5);
          sessionQueue.push(...topicCards);
        }
      }

      if (sessionQueue.length === 0) {
        showEmptyState("Selected topics have no occlusion masks built yet.");
        return;
      }

      if (document.getElementById('interleave-toggle').checked && checked.length > 1) {
        sessionQueue.sort(() => Math.random() - 0.5);
      }

      initialQueueSize = sessionQueue.length;

      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('canvas-container').classList.remove('hidden');
      document.getElementById('end-session-btn').classList.remove('hidden');
      startSession();
    }

    function showEmptyState(msg) {
      document.getElementById('action-bar').classList.add('hidden');
      document.getElementById('canvas-container').classList.add('hidden');
      document.getElementById('end-session-btn').classList.add('hidden');
      document.getElementById('empty-state-text').innerText = msg;
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('progress-text').innerText = "Waiting for setup...";
      document.getElementById('queue-stats').innerText = "";
    }

    function startSession() {
      if (sessionQueue.length === 0) return;
      document.getElementById('celebration-overlay').classList.add('hidden');
      document.getElementById('action-bar').classList.remove('hidden');
      nextCard();
    }

    function nextCard() {
      if (sessionQueue.length === 0) {
        triggerCelebration();
        return;
      }

      currentCard = sessionQueue[0];
      isRevealed = false;
      const topic = topicCache[currentCard.topicId];
      
      const hideAll = document.getElementById('hide-all-toggle').checked;

      const img = document.getElementById('topic-image');
      if (img.getAttribute('src') !== topic.image) {
        img.src = topic.image;
      }
      img.classList.remove('opacity-0');

      const layer = document.getElementById('masks-layer');
      layer.innerHTML = '';

      topic.masks.forEach(m => {
        const div = document.createElement('div');
        const isTarget = m.id === currentCard.maskId;
        
        div.className = `mask ${isTarget ? 'active' : (hideAll ? '' : 'revealed')}`;
        
        div.style.left = `${m.x}%`;
        div.style.top = `${m.y}%`;
        div.style.width = `${m.w}%`;
        div.style.height = `${m.h}%`;

        if (isTarget) {
          div.title = "Click or press Space to reveal";
          div.addEventListener('click', revealAnswer);
        }
        layer.appendChild(div);
      });

      document.getElementById('reveal-btn').classList.remove('hidden');
      document.getElementById('srs-buttons').classList.add('hidden');
      updateProgress();
    }

    function revealAnswer() {
      if (isRevealed || sessionQueue.length === 0) return;
      isRevealed = true;
      document.querySelector('.mask.active')?.classList.replace('active', 'revealed');
      document.getElementById('reveal-btn').classList.add('hidden');
      document.getElementById('srs-buttons').classList.remove('hidden');
    }

    function gradeCard(rating) {
      if (!isRevealed) return;
      totalReviewsCount++;
      const card = sessionQueue.shift();

      if (rating === 'again') {
        againCount++;
        sessionQueue.splice(Math.min(2, sessionQueue.length), 0, card);
      } else if (rating === 'hard') {
        sessionQueue.splice(Math.ceil(sessionQueue.length / 2), 0, card);
      } else if (rating === 'ok') {
        sessionQueue.push(card);
      }

      nextCard();
    }

    function updateProgress() {
      const completed = initialQueueSize - sessionQueue.length;
      const pct = initialQueueSize > 0 ? Math.round((completed / initialQueueSize) * 100) : 0;
      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('progress-text').innerText = `Progress: ${completed} / ${initialQueueSize} Mastered`;
      document.getElementById('queue-stats').innerText = `${sessionQueue.length} remaining`;
    }

    function endSessionEarly() {
      if (confirm("Are you sure you want to end this session early?")) {
        triggerCelebration();
      }
    }

    function triggerCelebration() {
      updateProgress();
      document.getElementById('masks-layer').innerHTML = '';
      document.getElementById('action-bar').classList.add('hidden');
      document.getElementById('end-session-btn').classList.add('hidden');
      document.getElementById('celebration-overlay').classList.remove('hidden');

      // Calculate actual mastered count in case they ended early
      const masteredCount = initialQueueSize - sessionQueue.length;
      const finalScore = Math.max(0, masteredCount);

      // Match commentator tier based on mastered count (fallback to tier 1 if 0)
      const tier = COMMENTATOR_TIERS.find(t => finalScore >= t.min && finalScore <= t.max) || COMMENTATOR_TIERS[0];

      document.getElementById('commentator-emojis').innerText = tier.emojis;
      document.getElementById('win-badge').innerText = tier.badge;
      document.getElementById('win-headline').innerText = tier.headline;
      document.getElementById('win-sub').innerText = tier.sub;

      document.getElementById('session-summary-stats').innerHTML = `
        <div><div class="text-slate-400 font-medium text-xs">Labels Mastered</div><div class="text-2xl font-black text-cdlNavy mt-1">${finalScore}</div></div>
        <div><div class="text-slate-400 font-medium text-xs">Total Reviews</div><div class="text-2xl font-black text-cdlNavy mt-1">${totalReviewsCount}</div></div>
      `;

      triggerScaledFireworks(finalScore);
    }

    function triggerScaledFireworks(score) {
      if (score === 0) return; // No fireworks if they mastered 0

      // Scale intensity multiplier from 1x up to 5x as score climbs from 1 to 100
      const intensity = Math.min(5, Math.max(1, score / 20));
      const duration = 1500 + (score * 30);
      const end = Date.now() + duration;

      (function frame() {
        // Side cannons (ticker tape streams)
        confetti({
          particleCount: Math.floor(3 * intensity),
          angle: 60,
          spread: 55 + (intensity * 3),
          origin: { x: 0, y: 0.7 },
          colors: ['#004587', '#1EB9DC', '#FBBA07', '#E73037']
        });
        confetti({
          particleCount: Math.floor(3 * intensity),
          angle: 120,
          spread: 55 + (intensity * 3),
          origin: { x: 1, y: 0.7 },
          colors: ['#004587', '#1EB9DC', '#FBBA07', '#E73037']
        });

        // Aerial fireworks explosions for higher tiers (50+ mastered)
        if (score >= 50 && Math.random() < (0.25 + (intensity * 0.05))) {
          confetti({
            particleCount: Math.floor(15 * intensity),
            spread: 120,
            origin: { x: Math.random(), y: Math.random() * 0.6 },
            colors: ['#FBBA07', '#ffffff', '#1EB9DC', '#E73037', '#004587']
          });
        }

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      })();
    }

    function inspectCompletedDiagram() {
      document.getElementById('celebration-overlay').classList.add('hidden');
    }

    function resetSession() {
      applyTopicSelection(false);
    }

    function setupKeyboardShortcuts() {
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !isRevealed && !document.getElementById('action-bar').classList.contains('hidden')) {
          e.preventDefault();
          revealAnswer();
        } else if (isRevealed) {
          if (e.key === '1') gradeCard('again');
          if (e.key === '2') gradeCard('hard');
          if (e.key === '3') gradeCard('ok');
          if (e.key === '4') gradeCard('easy');
        }
      });
    }
  </script>
</body>
</html>
