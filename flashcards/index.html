<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGCSE PE Image Occlusion Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Gotham', 'Helvetica Neue', 'Arial', 'sans-serif'] },
          colors: { brandNavy: '#004587', brandGold: '#fbba07', brandRed: '#e73037' }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Gotham', 'Helvetica Neue', Arial, sans-serif; }
    .mask {
      position: absolute;
      background-color: #004587;
      border: 2px solid #fbba07;
      transition: all 0.15s ease;
      user-select: none;
    }
    .mask.active {
      background-color: #e73037;
      border-color: #ffffff;
      box-shadow: 0 0 14px rgba(231, 48, 55, 0.75);
      animation: pulse 1.5s infinite;
      z-index: 10;
      cursor: pointer;
    }
    .mask.revealed {
      background-color: rgba(251, 186, 7, 0.12);
      border: 2px dashed #004587;
      pointer-events: none;
      z-index: 5;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.035); }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-brandNavy text-white px-6 py-4 flex flex-wrap items-center justify-between gap-4 shadow-md z-30">
    <div class="flex items-center gap-3">
      <div class="bg-brandGold text-brandNavy font-black px-3 py-1 rounded text-xs tracking-wider uppercase">IGCSE PE</div>
      <h1 id="session-title" class="text-lg font-bold tracking-tight">Image Occlusion Player</h1>
    </div>

    <div class="flex items-center gap-3 relative">
      <button id="topic-menu-btn" onclick="toggleTopicMenu()" class="bg-white/10 hover:bg-white/20 border border-white/20 text-white px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2.5 transition">
        <span>📚 Select Topics</span>
        <span id="selected-count-badge" class="bg-brandRed text-white text-xs font-bold px-2 py-0.5 rounded-full">0</span>
        <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
      </button>

      <button id="start-session-btn" onclick="applyTopicSelection(true)" class="bg-brandGold hover:bg-yellow-400 text-brandNavy px-5 py-2 rounded-lg text-sm font-bold shadow hidden transition">
        ▶ Start Session
      </button>
    </div>
  </header>

  <!-- Expanding Category & Topic Dropdown Panel (Only shows topics with question files) -->
  <div id="topic-dropdown-panel" class="hidden fixed sm:absolute top-20 right-4 sm:right-6 w-[92vw] sm:w-[420px] bg-white border border-slate-200 rounded-xl shadow-2xl p-5 z-40">
    <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
      <div>
        <h3 class="font-bold text-slate-800 text-sm">IGCSE Syllabus Flashcards</h3>
        <p class="text-[11px] text-slate-400">Only units with created question files are shown</p>
      </div>
      <button onclick="toggleTopicMenu(false)" class="text-slate-400 hover:text-slate-700 text-lg leading-none px-1">✕</button>
    </div>

    <!-- Accordion List -->
    <div id="topic-list-container" class="space-y-2.5 max-h-80 overflow-y-auto pr-1">
      <p class="text-xs text-slate-400 py-4 text-center">Scanning available json files...</p>
    </div>

    <!-- Interleave Option & Actions -->
    <div class="mt-4 pt-3 border-t border-slate-100 space-y-3">
      <div class="flex justify-between items-center text-xs">
        <label class="flex items-center gap-2 text-slate-600 cursor-pointer font-medium">
          <input type="checkbox" id="interleave-toggle" checked class="accent-brandNavy w-3.5 h-3.5 rounded">
          Shuffle selected topics together
        </label>
        <div class="space-x-2">
          <button onclick="selectAllTopics(true)" class="text-brandNavy font-semibold hover:underline">All</button>
          <span class="text-slate-300">|</span>
          <button onclick="selectAllTopics(false)" class="text-slate-400 hover:text-slate-600 hover:underline">None</button>
        </div>
      </div>

      <button onclick="applyTopicSelection(true)" class="w-full bg-brandNavy hover:bg-blue-900 text-white px-4 py-2.5 rounded-lg text-sm font-bold shadow transition">
        Start Selected Session
      </button>
    </div>
  </div>

  <!-- Main Study Viewport -->
  <main class="flex-1 flex flex-col items-center justify-center p-4 sm:p-6 relative">

    <!-- Progress Header -->
    <div class="w-full max-w-4xl flex justify-between items-center text-xs sm:text-sm text-slate-500 font-medium mb-2">
      <span id="progress-text">Select topics above to begin</span>
      <span id="queue-stats" class="font-semibold text-brandNavy"></span>
    </div>
    <div class="w-full max-w-4xl bg-slate-200 h-2.5 rounded-full mb-5 overflow-hidden shadow-inner">
      <div id="progress-bar" class="bg-brandNavy h-full transition-all duration-300" style="width: 0%"></div>
    </div>

    <!-- Diagram & Occlusion Canvas -->
    <div id="canvas-container" class="relative inline-block shadow-lg border border-slate-300 bg-white rounded-lg overflow-hidden max-h-[64vh]">
      <img id="topic-image" src="" alt="Study Diagram" class="block max-h-[62vh] max-w-full w-auto h-auto object-contain select-none pointer-events-none opacity-0 transition-opacity duration-200">
      <div id="masks-layer" class="absolute inset-0"></div>
    </div>

    <!-- Empty State -->
    <div id="empty-state" class="hidden text-center max-w-md bg-white border border-slate-200 rounded-xl p-6 shadow-sm mt-4">
      <p id="empty-state-text" class="text-sm text-slate-600 mb-3"></p>
      <button onclick="toggleTopicMenu(true)" class="bg-brandNavy text-white text-xs font-bold px-4 py-2 rounded-lg">Open Topic Menu</button>
    </div>

    <!-- Reveal & SRS Grading Controls -->
    <div id="action-bar" class="mt-6 w-full max-w-2xl hidden">
      <button id="reveal-btn" onclick="revealAnswer()" class="w-full bg-brandNavy hover:bg-blue-900 text-white font-bold py-3.5 rounded-xl shadow-lg transition text-base flex justify-center items-center gap-3">
        <span>Reveal Active Label</span>
        <kbd class="bg-white/20 text-xs px-2 py-0.5 rounded font-mono">Space</kbd>
      </button>

      <div id="srs-buttons" class="hidden grid grid-cols-4 gap-2.5 w-full">
        <button onclick="gradeCard('again')" class="bg-slate-200 hover:bg-red-100 hover:text-brandRed text-slate-800 py-3 rounded-xl font-bold border-b-4 border-slate-300 active:border-b-0 active:translate-y-1 transition flex flex-col items-center">
          <span>Again</span>
          <span class="text-[10px] opacity-65 font-normal">Key: 1</span>
        </button>
        <button onclick="gradeCard('hard')" class="bg-slate-200 hover:bg-amber-100 hover:text-amber-800 text-slate-800 py-3 rounded-xl font-bold border-b-4 border-slate-300 active:border-b-0 active:translate-y-1 transition flex flex-col items-center">
          <span>Hard</span>
          <span class="text-[10px] opacity-65 font-normal">Key: 2</span>
        </button>
        <button onclick="gradeCard('ok')" class="bg-brandNavy hover:bg-blue-900 text-white py-3 rounded-xl font-bold border-b-4 border-blue-950 active:border-b-0 active:translate-y-1 transition flex flex-col items-center">
          <span>OK</span>
          <span class="text-[10px] opacity-75 font-normal">Key: 3</span>
        </button>
        <button onclick="gradeCard('easy')" class="bg-brandGold hover:bg-yellow-400 text-brandNavy py-3 rounded-xl font-bold border-b-4 border-yellow-600 active:border-b-0 active:translate-y-1 transition flex flex-col items-center">
          <span>Easy</span>
          <span class="text-[10px] opacity-80 font-normal">Key: 4 ✓</span>
        </button>
      </div>
    </div>

    <!-- Celebration Modal -->
    <div id="celebration-overlay" class="hidden absolute inset-0 bg-slate-900/60 backdrop-blur-sm flex flex-col items-center justify-center z-50 p-6">
      <div class="bg-white border border-slate-200 rounded-2xl shadow-2xl p-8 max-w-md w-full text-center">
        <div class="text-6xl mb-3">🏆</div>
        <div id="win-badge" class="inline-block bg-brandGold/20 text-brandNavy text-xs font-bold px-3 py-1 rounded-full mb-3"></div>
        <h2 id="win-headline" class="text-3xl font-black text-brandNavy mb-2"></h2>
        <p id="win-sub" class="text-slate-600 text-sm mb-6"></p>

        <div id="session-summary-stats" class="bg-slate-50 border border-slate-200 rounded-xl p-3.5 mb-6 text-xs text-slate-600 flex justify-around"></div>

        <div class="flex flex-col sm:flex-row gap-2.5">
          <button onclick="inspectCompletedDiagram()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 px-4 rounded-xl text-sm transition">
            👁 View Diagram
          </button>
          <button onclick="resetSession()" class="flex-1 bg-brandGold hover:bg-yellow-400 text-brandNavy font-bold py-3 px-4 rounded-xl text-sm shadow-md transition">
            ↻ Study Again
          </button>
        </div>
      </div>
    </div>

  </main>

  <script>
    let manifestData = { categories: [] };
    let topicCache = {};
    let activeCategories = []; // Only categories that contain at least 1 valid json file
    let sessionQueue = [];
    let initialQueueSize = 0;
    let totalReviewsCount = 0;
    let againCount = 0;
    let currentCard = null;
    let isRevealed = false;

    const WIN_MESSAGES = [
      { h: "Clinical Finish!", sub: "Every single label locked down. That diagram didn't stand a chance." },
      { h: "Top-Bins Recall!", sub: "Not a single blind spot remaining on the page." },
      { h: "Synapses Officially Wired!", sub: "Active recall complete. Your future exam-self says thank you." },
      { h: "100% Board Cleared!", sub: "Zero hesitation left. You own this topic now." },
      { h: "Mic Drop.", sub: "If this diagram comes up on the paper, it’s basically free marks." }
    ];

    window.addEventListener('DOMContentLoaded', async () => {
      setupKeyboardShortcuts();
      try {
        const res = await fetch('manifest.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        manifestData = await res.json();

        // CONDITIONAL FILTERING: Test-fetch each topic file to verify questions exist
        activeCategories = [];
        for (const cat of manifestData.categories) {
          const validTopics = [];
          for (const top of cat.topics) {
            try {
              const tRes = await fetch(top.file);
              if (tRes.ok) {
                const tData = await tRes.json();
                if (tData.masks && tData.masks.length > 0) {
                  topicCache[top.id] = tData; // Cache successfully loaded data
                  validTopics.push(top);
                }
              }
            } catch (e) {
              // File doesn't exist yet — skip it silently from the menu
            }
          }
          if (validTopics.length > 0) {
            activeCategories.push({ name: cat.name, topics: validTopics });
          }
        }

        renderTopicMenu();

        if (activeCategories.length === 0) {
          showEmptyState("No question files found in your /json/ folder yet! Use ankibuilder.html to create your first flashcard set.");
          return;
        }

        // Auto-select first available topic or URL param
        const params = new URLSearchParams(window.location.search);
        const topicParam = params.get('topics') || params.get('topic');
        if (topicParam) {
          const requestedIds = topicParam.split(',').map(s => s.trim());
          document.querySelectorAll('.topic-checkbox').forEach(cb => {
            cb.checked = requestedIds.includes(cb.value);
          });
        } else {
          const firstCb = document.querySelector('.topic-checkbox');
          if (firstCb) firstCb.checked = true;
        }
        updateBadgeCount();
        await applyTopicSelection(false);
      } catch (err) {
        showEmptyState("Could not load manifest.json. Make sure manifest.json is in the root folder.");
      }
    });

    // Render only categories/topics that have valid json files with questions
    function renderTopicMenu() {
      const container = document.getElementById('topic-list-container');
      container.innerHTML = '';

      activeCategories.forEach((cat, catIdx) => {
        const section = document.createElement('div');
        section.className = 'border border-slate-200 rounded-lg overflow-hidden bg-slate-50/60 mb-2';

        const topicsHtml = cat.topics.map(top => `
          <label class="flex items-center gap-2.5 py-1.5 px-2 rounded hover:bg-white text-sm text-slate-700 cursor-pointer transition">
            <input type="checkbox" value="${top.id}" data-cat="${catIdx}"
                   class="topic-checkbox accent-brandNavy w-4 h-4 rounded cursor-pointer"
                   onchange="onTopicCheckboxChange(${catIdx})">
            <span class="flex-1 font-medium">${top.title}</span>
            <span class="text-[10px] bg-slate-200 text-slate-600 px-1.5 py-0.5 rounded font-mono">${topicCache[top.id].masks.length} Qs</span>
          </label>
        `).join('');

        section.innerHTML = `
          <div class="flex items-center justify-between px-3 py-2 bg-slate-100/80 border-b border-slate-200/80">
            <label class="flex items-center gap-2 text-xs font-bold text-brandNavy uppercase tracking-wider cursor-pointer">
              <input type="checkbox" id="cat-cb-${catIdx}" class="accent-brandNavy w-4 h-4 rounded cursor-pointer"
                     onchange="toggleCategoryCheckboxes(${catIdx}, this.checked)">
              <span>${cat.name}</span>
            </label>
            <button type="button" onclick="toggleCategoryCollapse(${catIdx})" class="text-slate-400 hover:text-brandNavy text-xs px-1.5 py-0.5">
              <span id="cat-arrow-${catIdx}">▼</span>
            </button>
          </div>
          <div id="cat-body-${catIdx}" class="p-2 space-y-0.5">
            ${topicsHtml}
          </div>
        `;
        container.appendChild(section);
      });
    }

    function toggleCategoryCollapse(catIdx) {
      const body = document.getElementById(`cat-body-${catIdx}`);
      const arrow = document.getElementById(`cat-arrow-${catIdx}`);
      const isHidden = body.classList.toggle('hidden');
      arrow.innerText = isHidden ? '▶' : '▼';
    }

    function toggleCategoryCheckboxes(catIdx, checked) {
      document.querySelectorAll(`.topic-checkbox[data-cat="${catIdx}"]`).forEach(cb => {
        cb.checked = checked;
      });
      updateBadgeCount();
    }

    function onTopicCheckboxChange(catIdx) {
      updateCategoryParentCheckbox(catIdx);
      updateBadgeCount();
    }

    function updateCategoryParentCheckbox(catIdx) {
      const children = Array.from(document.querySelectorAll(`.topic-checkbox[data-cat="${catIdx}"]`));
      const parentCb = document.getElementById(`cat-cb-${catIdx}`);
      if (!parentCb || children.length === 0) return;
      const checkedCount = children.filter(c => c.checked).length;
      parentCb.checked = checkedCount === children.length;
      parentCb.indeterminate = checkedCount > 0 && checkedCount < children.length;
    }

    function selectAllTopics(status) {
      document.querySelectorAll('.topic-checkbox').forEach(cb => cb.checked = status);
      activeCategories.forEach((_, idx) => updateCategoryParentCheckbox(idx));
      updateBadgeCount();
    }

    function updateBadgeCount() {
      const count = document.querySelectorAll('.topic-checkbox:checked').length;
      document.getElementById('selected-count-badge').innerText = count;
      document.getElementById('start-session-btn').classList.toggle('hidden', count === 0);
      activeCategories.forEach((_, idx) => updateCategoryParentCheckbox(idx));
    }

    function toggleTopicMenu(forceState) {
      const panel = document.getElementById('topic-dropdown-panel');
      if (typeof forceState === 'boolean') {
        panel.classList.toggle('hidden', !forceState);
      } else {
        panel.classList.toggle('hidden');
      }
    }

    window.addEventListener('click', (e) => {
      const panel = document.getElementById('topic-dropdown-panel');
      const btn = document.getElementById('topic-menu-btn');
      if (!panel.classList.contains('hidden') && !panel.contains(e.target) && !btn.contains(e.target)) {
        panel.classList.add('hidden');
      }
    });

    async function applyTopicSelection(closeMenu = true) {
      if (closeMenu) toggleTopicMenu(false);

      const checked = Array.from(document.querySelectorAll('.topic-checkbox:checked'));
      if (checked.length === 0) {
        showEmptyState("Please select at least one topic from the menu above.");
        return;
      }

      sessionQueue = [];
      totalReviewsCount = 0;
      againCount = 0;

      for (const cb of checked) {
        const topicId = cb.value;
        const data = topicCache[topicId];
        if (data && data.masks) {
          const topicCards = data.masks.map(m => ({ topicId, maskId: m.id }));
          topicCards.sort(() => Math.random() - 0.5);
          sessionQueue.push(...topicCards);
        }
      }

      if (sessionQueue.length === 0) {
        showEmptyState("Selected topics have 0 masks.");
        return;
      }

      if (document.getElementById('interleave-toggle').checked && checked.length > 1) {
        sessionQueue.sort(() => Math.random() - 0.5);
      }

      initialQueueSize = sessionQueue.length;

      if (checked.length === 1 && topicCache[checked[0].value]) {
        // Find title across active categories
        let tTitle = checked[0].value;
        activeCategories.forEach(cat => {
          const match = cat.topics.find(t => t.id === checked[0].value);
          if (match) tTitle = match.title;
        });
        document.getElementById('session-title').innerText = tTitle;
      } else {
        document.getElementById('session-title').innerText = `${checked.length} Topics Combined (${initialQueueSize} Labels)`;
      }

      document.getElementById('empty-state').classList.add('hidden');
      document.getElementById('canvas-container').classList.remove('hidden');
      startSession();
    }

    function showEmptyState(msg) {
      document.getElementById('action-bar').classList.add('hidden');
      document.getElementById('canvas-container').classList.add('hidden');
      document.getElementById('empty-state-text').innerText = msg;
      document.getElementById('empty-state').classList.remove('hidden');
      document.getElementById('progress-text').innerText = "Waiting for setup...";
      document.getElementById('queue-stats').innerText = "";
    }

    function startSession() {
      if (sessionQueue.length === 0) return;
      document.getElementById('celebration-overlay').classList.add('hidden');
      document.getElementById('action-bar').classList.remove('hidden');
      nextCard();
    }

    function nextCard() {
      if (sessionQueue.length === 0) {
        triggerCelebration();
        return;
      }

      currentCard = sessionQueue[0];
      isRevealed = false;
      const topic = topicCache[currentCard.topicId];

      const img = document.getElementById('topic-image');
      if (img.getAttribute('src') !== topic.image) {
        img.src = topic.image;
      }
      img.classList.remove('opacity-0');

      const layer = document.getElementById('masks-layer');
      layer.innerHTML = '';

      topic.masks.forEach(m => {
        const div = document.createElement('div');
        const isTarget = m.id === currentCard.maskId;
        div.className = `mask ${isTarget ? 'active' : ''}`;
        div.style.left = `${m.x}%`;
        div.style.top = `${m.y}%`;
        div.style.width = `${m.w}%`;
        div.style.height = `${m.h}%`;

        if (isTarget) {
          div.title = "Click or press Space to reveal";
          div.addEventListener('click', revealAnswer);
        }
        layer.appendChild(div);
      });

      document.getElementById('reveal-btn').classList.remove('hidden');
      document.getElementById('srs-buttons').classList.add('hidden');
      updateProgress();
    }

    function revealAnswer() {
      if (isRevealed || sessionQueue.length === 0) return;
      isRevealed = true;
      document.querySelector('.mask.active')?.classList.replace('active', 'revealed');
      document.getElementById('reveal-btn').classList.add('hidden');
      document.getElementById('srs-buttons').classList.remove('hidden');
    }

    function gradeCard(rating) {
      if (!isRevealed) return;
      totalReviewsCount++;
      const card = sessionQueue.shift();

      if (rating === 'again') {
        againCount++;
        sessionQueue.splice(Math.min(2, sessionQueue.length), 0, card);
      } else if (rating === 'hard') {
        sessionQueue.splice(Math.ceil(sessionQueue.length / 2), 0, card);
      } else if (rating === 'ok') {
        sessionQueue.push(card);
      }
      // 'easy' graduates the card

      nextCard();
    }

    function updateProgress() {
      const completed = initialQueueSize - sessionQueue.length;
      const pct = initialQueueSize > 0 ? Math.round((completed / initialQueueSize) * 100) : 0;
      document.getElementById('progress-bar').style.width = `${pct}%`;
      document.getElementById('progress-text').innerText = `Mastered: ${completed} of ${initialQueueSize} (${pct}%)`;
      document.getElementById('queue-stats').innerText = `${sessionQueue.length} remaining in queue`;
    }

    function triggerCelebration() {
      updateProgress();
      document.getElementById('masks-layer').innerHTML = '';
      document.getElementById('action-bar').classList.add('hidden');
      document.getElementById('celebration-overlay').classList.remove('hidden');

      const end = Date.now() + 2200;
      (function frame() {
        confetti({ particleCount: 4, angle: 60, spread: 55, origin: { x: 0, y: 0.65 } });
        confetti({ particleCount: 4, angle: 120, spread: 55, origin: { x: 1, y: 0.65 } });
        if (Date.now() < end) requestAnimationFrame(frame);
      })();

      const win = WIN_MESSAGES[Math.floor(Math.random() * WIN_MESSAGES.length)];
      document.getElementById('win-headline').innerText = win.h;
      document.getElementById('win-sub').innerText = win.sub;

      let badge = "⚡ Session Complete";
      if (totalReviewsCount === initialQueueSize) badge = "🎯 Flawless First-Try Sweep!";
      else if (againCount >= 3) badge = "🛡️ Relentless Grit — Mastered!";
      document.getElementById('win-badge').innerText = badge;

      document.getElementById('session-summary-stats').innerHTML = `
        <div><div class="text-slate-400">Labels Mastered</div><div class="text-base font-bold text-brandNavy">${initialQueueSize}</div></div>
        <div><div class="text-slate-400">Total Reviews</div><div class="text-base font-bold text-brandNavy">${totalReviewsCount}</div></div>
      `;
    }

    function inspectCompletedDiagram() {
      document.getElementById('celebration-overlay').classList.add('hidden');
    }

    function resetSession() {
      applyTopicSelection(false);
    }

    function setupKeyboardShortcuts() {
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && !isRevealed && !document.getElementById('action-bar').classList.contains('hidden')) {
          e.preventDefault();
          revealAnswer();
        } else if (isRevealed) {
          if (e.key === '1') gradeCard('again');
          if (e.key === '2') gradeCard('hard');
          if (e.key === '3') gradeCard('ok');
          if (e.key === '4') gradeCard('easy');
        }
      });
    }
  </script>
</body>
</html>
