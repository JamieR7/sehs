<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>IGCSE PE Flashcard Builder</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Gotham', 'Helvetica Neue', 'Arial', 'sans-serif'] },
          colors: { brandNavy: '#004587', brandGold: '#fbba07', brandRed: '#e73037' }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Gotham', 'Helvetica Neue', Arial, sans-serif; }
    #draw-area { cursor: crosshair; user-select: none; }
    .box {
      position: absolute;
      background: rgba(0, 69, 135, 0.65);
      border: 2px solid #fbba07;
      cursor: move;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
    }
    .box.selected {
      background: rgba(231, 48, 55, 0.55);
      border: 2px solid #e73037;
      z-index: 20;
    }
    .peek-mode .box { opacity: 0.15 !important; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 p-6 h-screen flex flex-col overflow-hidden">

  <div class="max-w-7xl w-full mx-auto flex flex-col h-full gap-4">
    
    <!-- CONTROLS BAR -->
    <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap gap-3 items-end z-30">
      
      <!-- Image Path -->
      <div class="flex-1 min-w-[240px]">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Image Path (in /images)</label>
        <input type="text" id="image-path" value="images/Bones.png" onchange="loadImage()"
               class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brandNavy font-medium">
      </div>

      <!-- Topic Title -->
      <div class="flex-1 min-w-[200px]">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Topic Title</label>
        <input type="text" id="topic-title" value="Skeletal and Muscular System" 
               class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brandNavy">
      </div>

      <!-- Filename ID -->
      <div class="w-48">
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">JSON Filename / ID</label>
        <div class="flex items-center bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm">
          <input type="text" id="topic-id" value="skeletal-system" class="w-full bg-transparent focus:outline-none font-mono text-sm">
          <span class="text-slate-400 text-xs font-mono">.json</span>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center gap-2">
        <button onclick="clearAllBoxes()" class="bg-slate-100 hover:bg-red-50 text-slate-600 hover:text-brandRed border border-slate-300 font-bold px-3 py-2 rounded-lg text-sm transition">
          Clear (<span id="mask-count">0</span>)
        </button>
        <button onclick="exportJSON('copy')" id="copy-btn" class="bg-brandNavy hover:bg-blue-900 text-white font-bold px-4 py-2 rounded-lg text-sm shadow-sm transition">
          📋 Copy JSON
        </button>
        <button onclick="exportJSON('download')" class="bg-brandGold hover:bg-yellow-400 text-brandNavy font-bold px-4 py-2 rounded-lg text-sm shadow-sm transition">
          ⬇ Save .json
        </button>
      </div>
    </div>

    <!-- WORKSPACE -->
    <div class="flex-1 relative bg-slate-200 rounded-xl overflow-hidden shadow-inner border border-slate-300 flex items-center justify-center p-4">
      <div id="img-error" class="hidden text-center max-w-md p-6 bg-white rounded-xl shadow border border-slate-200">
        <div class="text-brandRed font-bold text-sm mb-1">Could not load image at path:</div>
        <code id="error-path" class="text-xs bg-slate-100 px-2 py-1 rounded text-slate-700 block mb-3"></code>
      </div>

      <div id="draw-area" class="relative inline-block shadow-xl bg-white rounded overflow-hidden">
        <img id="source-img" src="" class="block max-h-[72vh] max-w-full w-auto h-auto pointer-events-none select-none" alt="Diagram">
        <div id="boxes-layer" class="absolute inset-0"></div>
      </div>
    </div>

    <!-- FOOTER SHORTCUTS -->
    <div class="flex flex-wrap justify-between items-center text-xs text-slate-500 font-medium px-1">
      <div>
        <span class="font-bold text-brandNavy">Draw:</span> Click &amp; drag &nbsp;|&nbsp; 
        <span class="font-bold text-brandNavy">Duplicate:</span> <kbd class="bg-white border px-1.5 py-0.5 rounded">Ctrl/Cmd + D</kbd> &nbsp;|&nbsp; 
        <span class="font-bold text-brandNavy">Peek:</span> Hold <kbd class="bg-white border px-1.5 py-0.5 rounded">Alt</kbd> &nbsp;|&nbsp; 
        <span class="font-bold text-brandNavy">Delete:</span> <kbd class="bg-white border px-1.5 py-0.5 rounded">Backspace</kbd>
      </div>
      <div>Save into folder: <code class="bg-white border px-1.5 py-0.5 rounded text-brandNavy font-bold">json/<span id="footer-filename">skeletal-system</span>.json</code></div>
    </div>

  </div>

  <script>
    const drawArea = document.getElementById('draw-area');
    const boxesLayer = document.getElementById('boxes-layer');
    const sourceImg = document.getElementById('source-img');

    let boxes = [];
    let selectedBoxId = null;
    let mode = null;
    let startX = 0, startY = 0;
    let moveOffsetX = 0, moveOffsetY = 0;
    let activeBox = null;

    document.getElementById('topic-id').addEventListener('input', (e) => {
      document.getElementById('footer-filename').innerText = e.target.value || 'topic';
    });

    function loadImage() {
      sourceImg.src = document.getElementById('image-path').value.trim();
    }

    sourceImg.onload = () => {
      document.getElementById('img-error').classList.add('hidden');
      drawArea.classList.remove('hidden');
    };

    sourceImg.onerror = () => {
      drawArea.classList.add('hidden');
      document.getElementById('error-path').innerText = document.getElementById('image-path').value;
      document.getElementById('img-error').classList.remove('hidden');
    };

    const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

    drawArea.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      const rect = drawArea.getBoundingClientRect();
      const clickX = clamp(((e.clientX - rect.left) / rect.width) * 100, 0, 100);
      const clickY = clamp(((e.clientY - rect.top) / rect.height) * 100, 0, 100);

      if (e.target.classList.contains('box')) {
        selectedBoxId = e.target.dataset.id;
        activeBox = boxes.find(b => b.id === selectedBoxId);
        mode = 'moving';
        moveOffsetX = clickX - activeBox.x;
        moveOffsetY = clickY - activeBox.y;
        renderBoxes();
        return;
      }

      selectedBoxId = null;
      mode = 'drawing';
      startX = clickX;
      startY = clickY;
      activeBox = { id: 'm' + Date.now(), x: startX, y: startY, w: 0, h: 0 };
      boxes.push(activeBox);
      renderBoxes();
    });

    window.addEventListener('mousemove', (e) => {
      if (!mode || !activeBox) return;
      const rect = drawArea.getBoundingClientRect();
      const currX = clamp(((e.clientX - rect.left) / rect.width) * 100, 0, 100);
      const currY = clamp(((e.clientY - rect.top) / rect.height) * 100, 0, 100);

      if (mode === 'drawing') {
        activeBox.x = Math.min(startX, currX);
        activeBox.y = Math.min(startY, currY);
        activeBox.w = Math.abs(currX - startX);
        activeBox.h = Math.abs(currY - startY);
      } else if (mode === 'moving') {
        activeBox.x = clamp(currX - moveOffsetX, 0, 100 - activeBox.w);
        activeBox.y = clamp(currY - moveOffsetY, 0, 100 - activeBox.h);
      }
      renderBoxes();
    });

    window.addEventListener('mouseup', () => {
      if (!mode) return;
      if (mode === 'drawing' && activeBox) {
        if (activeBox.w < 0.8 || activeBox.h < 0.8) {
          boxes.pop();
        } else {
          selectedBoxId = activeBox.id;
        }
      }
      mode = null;
      activeBox = null;
      renderBoxes();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Alt') drawArea.classList.add('peek-mode');
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      const selected = boxes.find(b => b.id === selectedBoxId);
      if (!selected) return;

      if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault();
        boxes = boxes.filter(b => b.id !== selectedBoxId);
        selectedBoxId = null;
        renderBoxes();
      }

      const step = e.shiftKey ? 1.0 : 0.2;
      if (e.key === 'ArrowLeft')  { e.preventDefault(); selected.x = clamp(selected.x - step, 0, 100 - selected.w); renderBoxes(); }
      if (e.key === 'ArrowRight') { e.preventDefault(); selected.x = clamp(selected.x + step, 0, 100 - selected.w); renderBoxes(); }
      if (e.key === 'ArrowUp')    { e.preventDefault(); selected.y = clamp(selected.y - step, 0, 100 - selected.h); renderBoxes(); }
      if (e.key === 'ArrowDown')  { e.preventDefault(); selected.y = clamp(selected.y + step, 0, 100 - selected.h); renderBoxes(); }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
        e.preventDefault();
        const dup = {
          id: 'm' + Date.now(),
          x: clamp(selected.x + 1.5, 0, 100 - selected.w),
          y: clamp(selected.y + 3.5, 0, 100 - selected.h),
          w: selected.w,
          h: selected.h
        };
        boxes.push(dup);
        selectedBoxId = dup.id;
        renderBoxes();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'Alt') drawArea.classList.remove('peek-mode');
    });

    function clearAllBoxes() {
      if (boxes.length === 0) return;
      if (confirm('Remove all masks?')) {
        boxes = [];
        selectedBoxId = null;
        renderBoxes();
      }
    }

    function renderBoxes() {
      boxesLayer.innerHTML = '';
      document.getElementById('mask-count').innerText = boxes.length;

      boxes.forEach((b, idx) => {
        const div = document.createElement('div');
        div.className = `box ${b.id === selectedBoxId ? 'selected' : ''}`;
        div.dataset.id = b.id;
        div.style.left = `${b.x}%`;
        div.style.top = `${b.y}%`;
        div.style.width = `${b.w}%`;
        div.style.height = `${b.h}%`;
        div.innerText = idx + 1;
        boxesLayer.appendChild(div);
      });
    }

    function exportJSON(action = 'copy') {
      const topicId = document.getElementById('topic-id').value.trim() || 'topic';
      const data = {
        id: topicId,
        title: document.getElementById('topic-title').value.trim(),
        image: document.getElementById('image-path').value.trim(),
        masks: boxes.map((b, i) => ({
          id: `m${i + 1}`,
          x: Number(b.x.toFixed(1)),
          y: Number(b.y.toFixed(1)),
          w: Number(b.w.toFixed(1)),
          h: Number(b.h.toFixed(1))
        }))
      };

      const jsonString = JSON.stringify(data, null, 2);

      if (action === 'download') {
        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${topicId}.json`;
        a.click();
        URL.revokeObjectURL(url);
      } else {
        navigator.clipboard.writeText(jsonString).then(() => {
          const btn = document.getElementById('copy-btn');
          const orig = btn.innerText;
          btn.innerText = '✓ Copied!';
          setTimeout(() => btn.innerText = orig, 1800);
        });
      }
    }

    loadImage();
  </script>
</body>
</html>
