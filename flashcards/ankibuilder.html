<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>IGCSE PE Builder - Collège du Léman</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { 
            sans: ['Gotham', 'Helvetica', 'Arial', 'sans-serif'],
            serif: ['Georgia', 'serif']
          },
          colors: { 
            cdlNavy: '#004587', 
            cdlBrightBlue: '#1EB9DC', 
            cdlRed: '#E73037',
            cdlGold: '#FBBA07' 
          }
        }
      }
    }
  </script>
  <style>
    body { 
      font-family: 'Gotham', 'Helvetica', 'Arial', sans-serif; 
      background-color: #f8f9fa;
    }
    #draw-area { cursor: crosshair; user-select: none; }
    .box {
      position: absolute;
      background: rgba(0, 69, 135, 0.68);
      border: 2px solid #FBBA07;
      cursor: move;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      transition: background-color 0.1s ease;
    }
    .box:hover { background: rgba(0, 69, 135, 0.85); }
    .box.selected {
      background: rgba(231, 48, 55, 0.65);
      border: 2px solid #ffffff;
      box-shadow: 0 0 12px rgba(231, 48, 55, 0.8);
      z-index: 20;
    }
    .peek-mode .box { opacity: 0.15 !important; }
    
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 8px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 8px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="text-slate-800 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="w-full bg-white px-6 py-3.5 flex justify-between items-center border-b-[4px] border-cdlRed shadow-[0_4px_30px_rgba(0,69,135,0.05)] z-40 relative flex-shrink-0">
    <div class="flex flex-col text-left">
      <h1 class="m-0 font-light text-2xl sm:text-3xl text-cdlNavy tracking-tight">
        IGCSE <span class="font-bold text-cdlBrightBlue">Flashcard Builder</span>
      </h1>
      <div class="font-serif italic text-cdlRed text-xs sm:text-sm mt-0.5">Creation &amp; Mapping Tool</div>
    </div>
    
    <div class="flex items-center gap-4">
      <a href="index.html" class="text-sm font-bold text-cdlNavy hover:text-cdlBrightBlue transition-colors flex items-center gap-2">
        <span>←</span> <span>Back to Player</span>
      </a>
    </div>
  </header>

  <div class="max-w-7xl w-full mx-auto flex flex-col flex-1 gap-3 p-4 min-h-0">
    
    <!-- CONTROLS BAR -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex flex-wrap gap-4 items-end z-30 flex-shrink-0">
      
      <!-- 1. Select Diagram Image -->
      <div class="flex-1 min-w-[240px] relative" id="image-picker-wrapper">
        <div class="flex justify-between items-center mb-1.5">
          <label class="text-[11px] font-bold text-cdlNavy uppercase tracking-wider">1. Image File Path</label>
          <label class="text-[11px] font-bold text-cdlBrightBlue hover:underline cursor-pointer flex items-center gap-1">
            <span>📂 Browse</span>
            <input type="file" id="local-file-picker" accept="image/*" class="hidden" onchange="handleFilePick(event)">
          </label>
        </div>
        <div class="relative">
          <input type="text" id="image-path" value="images/Bones.png" 
                 placeholder="images/file.png"
                 autocomplete="off"
                 onfocus="openImageDropdown()"
                 oninput="filterImageDropdown()"
                 onchange="loadImage(false)"
                 class="w-full bg-slate-50 border border-slate-300 rounded-lg pl-3 pr-8 py-2 text-sm focus:outline-none focus:border-cdlBrightBlue font-medium">
          <button type="button" onclick="toggleImageDropdown()" class="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 px-2">▼</button>
        </div>
        <div id="image-dropdown" class="hidden absolute left-0 right-0 mt-1.5 bg-white border border-slate-200 rounded-xl shadow-2xl max-h-60 overflow-y-auto z-50 divide-y divide-slate-100"></div>
      </div>

      <!-- 2. Topic Title Input -->
      <div class="flex-1 min-w-[220px]">
        <label class="block text-[11px] font-bold text-cdlNavy uppercase tracking-wider mb-1.5">2. Topic Title</label>
        <input type="text" id="topic-title" value="FITT Principle" oninput="updateIdentifiers()"
               class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-cdlBrightBlue font-medium">
      </div>

      <!-- 3. Unique ID Input -->
      <div class="w-40">
        <label class="block text-[11px] font-bold text-cdlNavy uppercase tracking-wider mb-1.5">3. Unique ID</label>
        <input type="text" id="topic-id" value="fitt" oninput="updateIdentifiers()"
               class="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-sm font-mono focus:outline-none focus:border-cdlBrightBlue font-medium">
      </div>

      <!-- Action Buttons & Manifest Generator -->
      <div class="flex items-center gap-2">
        <button type="button" onclick="clearAllBoxes()" class="bg-white hover:bg-red-50 text-slate-600 hover:text-cdlRed border border-slate-300 font-bold px-3 py-2 rounded-lg text-sm transition-colors flex items-center gap-1.5">
          Clear <span id="mask-count" class="bg-slate-200 text-slate-700 text-[10px] px-1.5 py-0.5 rounded-full">0</span>
        </button>
        <button type="button" onclick="exportManifestLine()" id="manifest-btn" title="Copy manifest JSON line" class="bg-slate-100 hover:bg-slate-200 text-cdlNavy font-bold px-3.5 py-2 rounded-lg text-sm transition-all border border-slate-300">
          📋 Copy Manifest Line
        </button>
        <button type="button" onclick="exportJSON('copy')" id="copy-btn" class="bg-white border-2 border-cdlNavy text-cdlNavy hover:bg-slate-50 font-bold px-4 py-2 rounded-lg text-sm transition-all">
          📋 Copy JSON
        </button>
        <button type="button" onclick="exportJSON('download')" class="bg-cdlNavy hover:bg-cdlBrightBlue text-white font-bold px-4 py-2 rounded-lg text-sm shadow transition-all">
          ⬇ Save .json
        </button>
      </div>
    </div>

    <!-- WORKSPACE -->
    <div class="flex-1 relative bg-slate-200 rounded-2xl overflow-hidden shadow-inner border border-slate-300 flex items-center justify-center p-4 min-h-0">
      <div id="img-error" class="hidden text-center max-w-md p-8 bg-white rounded-2xl shadow-lg border border-slate-200">
        <div class="text-cdlRed font-bold text-base mb-2">Could not load image at path:</div>
        <code id="error-path" class="text-sm bg-slate-100 px-3 py-1.5 rounded-md text-slate-700 block mb-4 border border-slate-200"></code>
        <p class="text-xs text-slate-500 leading-relaxed">Click <strong>📂 Browse</strong> above to select the image file directly from your computer.</p>
      </div>

      <div id="draw-area" class="relative inline-block shadow-2xl bg-white rounded-sm overflow-hidden">
        <img id="source-img" src="" class="block max-h-[calc(100vh-250px)] max-w-full w-auto h-auto pointer-events-none select-none" alt="Diagram">
        <div id="boxes-layer" class="absolute inset-0"></div>
      </div>
    </div>

    <!-- FOOTER SHORTCUTS -->
    <div class="flex flex-wrap justify-between items-center text-xs text-slate-500 font-medium px-2 flex-shrink-0">
      <div class="flex items-center gap-3">
        <span><strong class="text-cdlNavy">Draw:</strong> Click &amp; drag on image</span> <span class="opacity-30">|</span>
        <span><strong class="text-cdlNavy">Duplicate:</strong> <kbd class="bg-white border border-slate-300 px-1.5 py-0.5 rounded shadow-sm">Ctrl/Cmd + D</kbd></span> <span class="opacity-30">|</span>
        <span><strong class="text-cdlNavy">Delete:</strong> <kbd class="bg-white border border-slate-300 px-1.5 py-0.5 rounded shadow-sm">Backspace</kbd></span>
      </div>
      <div>Save into folder: <code class="bg-white border border-slate-200 px-2 py-0.5 rounded text-cdlNavy font-bold shadow-sm">json/<span id="footer-filename">fitt</span>.json</code></div>
    </div>

  </div>

  <script>
    const drawArea = document.getElementById('draw-area');
    const boxesLayer = document.getElementById('boxes-layer');
    const sourceImg = document.getElementById('source-img');
    const imageDropdown = document.getElementById('image-dropdown');

    let boxes = [];
    let selectedBoxId = null;
    let mode = null;
    let startX = 0, startY = 0;
    let moveOffsetX = 0, moveOffsetY = 0;
    let activeBox = null;

    let availableImages = [
      { path: 'images/Bones.png' },
      { path: 'images/VoluntaryMuscles.png' },
      { path: 'images/TrainingMethods.png' },
      { path: 'images/FITT.png' }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      renderImageDropdown();
      loadImage(true);
      updateIdentifiers();
    });

    function updateIdentifiers() {
      const id = document.getElementById('topic-id').value.trim() || 'topic';
      document.getElementById('footer-filename').innerText = id;
    }

    function exportManifestLine() {
      const id = document.getElementById('topic-id').value.trim();
      const title = document.getElementById('topic-title').value.trim();
      
      if (!id) {
        alert("Please enter a Unique ID first!");
        return;
      }

      const snippet = `{ "id": "${id}", "title": "${title}", "file": "json/${id}.json" },`;
      navigator.clipboard.writeText(snippet).then(() => {
        const btn = document.getElementById('manifest-btn');
        const orig = btn.innerText;
        btn.innerText = '✓ Copied Line!';
        setTimeout(() => btn.innerText = orig, 1800);
      });
    }

    function renderImageDropdown(filterText = '') {
      const query = filterText.toLowerCase().trim();
      const filtered = availableImages.filter(img => img.path.toLowerCase().includes(query));

      let html = filtered.map(img => `
        <button type="button" onclick="selectImageFromDropdown('${img.path}')"
                class="w-full text-left px-4 py-2.5 hover:bg-slate-50 flex items-center justify-between text-sm transition-colors border-l-2 border-transparent hover:border-cdlBrightBlue group">
          <span class="font-medium text-slate-700 group-hover:text-cdlNavy">${img.path}</span>
        </button>
      `).join('');

      html += `
        <button type="button" onclick="document.getElementById('local-file-picker').click()"
                class="w-full text-left px-4 py-2.5 bg-slate-50 hover:bg-blue-50 text-cdlBrightBlue font-bold text-xs flex items-center gap-2">
          <span>📂 Browse computer for image...</span>
        </button>
      `;
      imageDropdown.innerHTML = html;
    }

    function handleFilePick(event) {
      const file = event.target.files[0];
      if (!file) return;
      const relativePath = `images/${file.name}`;
      document.getElementById('image-path').value = relativePath;
      imageDropdown.classList.add('hidden');

      const previewUrl = URL.createObjectURL(file);
      sourceImg.src = previewUrl;
      boxes = [];
      selectedBoxId = null;
      renderBoxes();
    }

    function openImageDropdown() {
      renderImageDropdown('');
      imageDropdown.classList.remove('hidden');
    }

    function toggleImageDropdown() {
      imageDropdown.classList.toggle('hidden');
      if (!imageDropdown.classList.contains('hidden')) renderImageDropdown('');
    }

    function filterImageDropdown() {
      renderImageDropdown(document.getElementById('image-path').value);
      imageDropdown.classList.remove('hidden');
    }

    function selectImageFromDropdown(path) {
      document.getElementById('image-path').value = path;
      imageDropdown.classList.add('hidden');
      loadImage(true);
    }

    window.addEventListener('click', (e) => {
      if (!e.target.closest('#image-picker-wrapper')) {
        imageDropdown.classList.add('hidden');
      }
    });

    function loadImage(resetMasks = false) {
      sourceImg.src = document.getElementById('image-path').value.trim();
      if (resetMasks) {
        boxes = [];
        selectedBoxId = null;
        renderBoxes();
      }
    }

    sourceImg.onload = () => {
      document.getElementById('img-error').classList.add('hidden');
      drawArea.classList.remove('hidden');
    };

    sourceImg.onerror = () => {
      drawArea.classList.add('hidden');
      document.getElementById('error-path').innerText = document.getElementById('image-path').value;
      document.getElementById('img-error').classList.remove('hidden');
    };

    const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

    drawArea.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      const rect = drawArea.getBoundingClientRect();
      const clickX = clamp(((e.clientX - rect.left) / rect.width) * 100, 0, 100);
      const clickY = clamp(((e.clientY - rect.top) / rect.height) * 100, 0, 100);

      if (e.target.classList.contains('box')) {
        selectedBoxId = e.target.dataset.id;
        activeBox = boxes.find(b => b.id === selectedBoxId);
        mode = 'moving';
        moveOffsetX = clickX - activeBox.x;
        moveOffsetY = clickY - activeBox.y;
        renderBoxes();
        return;
      }

      selectedBoxId = null;
      mode = 'drawing';
      startX = clickX;
      startY = clickY;
      activeBox = { id: 'm' + Date.now(), x: startX, y: startY, w: 0, h: 0 };
      boxes.push(activeBox);
      renderBoxes();
    });

    window.addEventListener('mousemove', (e) => {
      if (!mode || !activeBox) return;
      const rect = drawArea.getBoundingClientRect();
      const currX = clamp(((e.clientX - rect.left) / rect.width) * 100, 0, 100);
      const currY = clamp(((e.clientY - rect.top) / rect.height) * 100, 0, 100);

      if (mode === 'drawing') {
        activeBox.x = Math.min(startX, currX);
        activeBox.y = Math.min(startY, currY);
        activeBox.w = Math.abs(currX - startX);
        activeBox.h = Math.abs(currY - startY);
      } else if (mode === 'moving') {
        activeBox.x = clamp(currX - moveOffsetX, 0, 100 - activeBox.w);
        activeBox.y = clamp(currY - moveOffsetY, 0, 100 - activeBox.h);
      }
      renderBoxes();
    });

    window.addEventListener('mouseup', () => {
      if (!mode) return;
      if (mode === 'drawing' && activeBox) {
        if (activeBox.w < 0.8 || activeBox.h < 0.8) {
          boxes.pop();
        } else {
          selectedBoxId = activeBox.id;
        }
      }
      mode = null;
      activeBox = null;
      renderBoxes();
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Alt') drawArea.classList.add('peek-mode');
      const tag = document.activeElement?.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA') return;

      const selected = boxes.find(b => b.id === selectedBoxId);
      if (!selected) return;

      if (e.key === 'Backspace' || e.key === 'Delete') {
        e.preventDefault();
        boxes = boxes.filter(b => b.id !== selectedBoxId);
        selectedBoxId = null;
        renderBoxes();
      }

      const step = e.shiftKey ? 1.0 : 0.2;
      if (e.key === 'ArrowLeft')  { e.preventDefault(); selected.x = clamp(selected.x - step, 0, 100 - selected.w); renderBoxes(); }
      if (e.key === 'ArrowRight') { e.preventDefault(); selected.x = clamp(selected.x + step, 0, 100 - selected.w); renderBoxes(); }
      if (e.key === 'ArrowUp')    { e.preventDefault(); selected.y = clamp(selected.y - step, 0, 100 - selected.h); renderBoxes(); }
      if (e.key === 'ArrowDown')  { e.preventDefault(); selected.y = clamp(selected.y + step, 0, 100 - selected.h); renderBoxes(); }

      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
        e.preventDefault();
        const dup = {
          id: 'm' + Date.now(),
          x: clamp(selected.x + 1.5, 0, 100 - selected.w),
          y: clamp(selected.y + 3.5, 0, 100 - selected.h),
          w: selected.w,
          h: selected.h
        };
        boxes.push(dup);
        selectedBoxId = dup.id;
        renderBoxes();
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.key === 'Alt') drawArea.classList.remove('peek-node');
    });

    function clearAllBoxes() {
      if (boxes.length === 0) return;
      if (confirm('Remove all masks from this diagram?')) {
        boxes = [];
        selectedBoxId = null;
        renderBoxes();
      }
    }

    function renderBoxes() {
      boxesLayer.innerHTML = '';
      document.getElementById('mask-count').innerText = boxes.length;

      boxes.forEach((b, idx) => {
        const div = document.createElement('div');
        div.className = `box ${b.id === selectedBoxId ? 'selected' : ''}`;
        div.dataset.id = b.id;
        div.style.left = `${b.x}%`;
        div.style.top = `${b.y}%`;
        div.style.width = `${b.w}%`;
        div.style.height = `${b.h}%`;
        div.innerText = idx + 1;
        boxesLayer.appendChild(div);
      });
    }

    function exportJSON(action = 'copy') {
      const topicId = document.getElementById('topic-id').value.trim();
      if (!topicId) {
        alert("Please enter a Unique ID first!");
        return;
      }

      const data = {
        id: topicId,
        title: document.getElementById('topic-title').value.trim(),
        image: document.getElementById('image-path').value.trim(),
        masks: boxes.map((b, i) => ({
          id: `m${i + 1}`,
          x: Number(b.x.toFixed(1)),
          y: Number(b.y.toFixed(1)),
          w: Number(b.w.toFixed(1)),
          h: Number(b.h.toFixed(1))
        }))
      };

      const jsonString = JSON.stringify(data, null, 2);

      if (action === 'download') {
        const blob = new Blob([jsonString], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${topicId}.json`;
        a.click();
        URL.revokeObjectURL(url);
      } else {
        navigator.clipboard.writeText(jsonString).then(() => {
          const btn = document.getElementById('copy-btn');
          const orig = btn.innerText;
          btn.innerText = '✓ Copied JSON!';
          setTimeout(() => btn.innerText = orig, 1800);
        });
      }
    }
  </script>
</body>
</html>
