    <!-- THE MIND TRICK: Intercept the system theme check and force 'dark' -->
    <script>
      const originalMatchMedia = window.matchMedia;
      window.matchMedia = function(query) {
        // If the app asks the browser if the user prefers dark mode, always say TRUE
        if (query === '(prefers-color-scheme: dark)') {
          return {
            matches: true,
            media: query,
            onchange: null,
            addListener: function() {},
            removeListener: function() {},
            addEventListener: function() {},
            removeEventListener: function() {},
            dispatchEvent: function() { return true; }
          };
        }
        return originalMatchMedia ? originalMatchMedia(query) : { matches: false };
      };
      
      // We also set the most common storage keys just in case it checks memory first
      try {
        localStorage.setItem('theme', 'dark');
        localStorage.setItem('vite-ui-theme', 'dark');
        localStorage.setItem('chakra-ui-color-mode', 'dark');
      } catch (e) {}
    </script>
