<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />

    <meta property="og:title" content="PE Tournament Planner" />
    <meta property="og:description" content="Simple 8-Team, 2-Court Group Tournament Manager" />

    <link rel="icon" type="image/png" href="/tourny/favicon.png" />

    <!-- THE LOCK: Forces 'dark' onto BOTH html and body tags -->
    <script>
      // 1. Add to HTML immediately
      document.documentElement.classList.add('dark');
      
      // 2. Set memory keys
      localStorage.setItem('vite-ui-theme', 'dark');
      localStorage.setItem('theme', 'dark');
      
      // 3. The Security Guard watching both tags
      const observer = new MutationObserver(() => {
        // Check HTML
        if (!document.documentElement.classList.contains('dark')) {
          document.documentElement.classList.add('dark');
        }
        // Check Body (if it has loaded yet)
        if (document.body && !document.body.classList.contains('dark')) {
          document.body.classList.add('dark');
        }
      });
      
      // Start watching HTML immediately
      observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });

      // Start watching Body as soon as it exists
      document.addEventListener('DOMContentLoaded', () => {
        document.body.classList.add('dark');
        observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
      });
    </script>
