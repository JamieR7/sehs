    <!-- THE MEMORY HIJACKER -->
    <script>
      // 1. Force the system check to report Dark Mode
      const originalMatchMedia = window.matchMedia;
      window.matchMedia = function(query) {
        if (query.includes('dark')) {
          return { matches: true, addEventListener: function(){}, removeEventListener: function(){} };
        }
        return { matches: false, addEventListener: function(){}, removeEventListener: function(){} };
      };

      // 2. Intercept the app's memory (localStorage) checks
      const originalGetItem = localStorage.getItem;
      localStorage.getItem = function(key) {
        const lowerKey = key.toLowerCase();
        // If the app asks for anything related to theme, mode, or color, lie and say 'dark'
        if (lowerKey.includes('theme') || lowerKey.includes('mode') || lowerKey.includes('color')) {
          return 'dark';
        }
        // Otherwise, return normal memory items
        return originalGetItem.call(window.localStorage, key);
      };
    </script>
