<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGCSE PE - Coming Soon</title>
    <style>
        /* CDL Primary & Secondary Brand Colors */
        :root {
            --cdl-blue: #004587;
            --cdl-bright-blue: #1EB9DC;
            --cdl-bright-red: #EF8162;
        }

        body {
            font-family: 'Gotham', 'Helvetica', 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f8f9fa;
            color: var(--cdl-blue);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header-container {
            width: 100%;
            background-color: #ffffff;
            padding: 70px 20px 50px;
            text-align: center;
            box-shadow: 0 4px 30px rgba(0, 69, 135, 0.05);
        }

        h1 {
            margin: 0;
            font-weight: 300;
            font-size: 42px;
            color: var(--cdl-blue);
            letter-spacing: -0.5px;
        }

        .highlight {
            color: var(--cdl-bright-blue);
            font-weight: bold;
        }

        .benefit-text {
            font-family: 'Georgia', serif;
            font-style: italic;
            color: var(--cdl-bright-red);
            font-size: 22px;
            margin-top: 15px;
        }

        .container {
            padding: 60px 20px;
            max-width: 1000px;
            text-align: center;
        }

        h2 {
            font-size: 36px;
            color: var(--cdl-bright-red);
            margin-bottom: 20px;
        }

        p {
            line-height: 1.7;
            font-size: 18px;
            margin-bottom: 50px;
            color: #4a4a4a;
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }

        .btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 350px;
            background-color: var(--cdl-blue);
            color: #ffffff;
            padding: 20px 35px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 69, 135, 0.15);
        }

        .btn:hover {
            background-color: var(--cdl-bright-blue);
            transform: translateY(-4px);
            box-shadow: 0 15px 25px rgba(30, 185, 220, 0.25);
        }

        .btn-icon {
            font-size: 22px;
            transition: transform 0.3s ease;
        }

        .btn:hover .btn-icon {
            transform: translateX(-6px); /* Arrow slides left on hover */
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>Physical Education <span class="highlight">IGCSE</span></h1>
        <div class="benefit-text">Cambridge IGCSE Syllabus</div>
    </div>

    <div class="container">
        <h2>🚧 Coming Soon! ⏳</h2>
        <p>
            This section is currently under construction. Check back soon for new interactive apps, syllabus materials, and exam training modules! 🏃‍♂️🎾🏆
        </p>
        
        <div class="button-container">
            <a href="/" class="btn">
                <span class="btn-icon">←</span>
                Back to Main Hub
            </a>
        </div>
    </div>

</body>
</html>
