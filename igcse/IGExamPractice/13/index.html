    <script>
        const questions = [
            // ==========================================
            // Aerobic and anaerobic respiration (14 Questions)
            // ==========================================
            {
                section: "Aerobic and anaerobic respiration",
                marks: 2,
                question: "State the summary equation for aerobic respiration.",
                markScheme: "<ul><li><strong>glucose + oxygen &rarr; carbon dioxide + water</strong> (2 marks: 1 mark for reactants on the left, 1 mark for products on the right).</li></ul>",
                hint: "What does the body take in from food and breathing to make energy, and what does it breathe out or produce as waste?",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 2,
                question: "State the summary equation for anaerobic respiration.",
                markScheme: "<ul><li><strong>glucose &rarr; lactic acid</strong> (+ energy) (2 marks: 1 mark for glucose, 1 mark for lactic acid).</li></ul>",
                hint: "This happens without oxygen and leaves a fatiguing waste product in the muscles.",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 2,
                question: "An equation for aerobic respiration is shown:<br><strong>glucose + A &rarr; B + water</strong><br>Name the substances represented by A and B.",
                markScheme: "<ul><li><strong>A:</strong> oxygen (1 mark)</li><li><strong>B:</strong> carbon dioxide (1 mark)</li></ul>",
                hint: "Think about what gas you inhale to combine with glucose, and what waste gas you exhale.",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 4,
                question: "Name and describe the main type of respiration being used to release energy for a sprinter and a long-distance runner.",
                markScheme: "1 mark for naming each type of respiration (max 2). 1 mark for each correct description/equation (max 2):<br><ul><li><strong>Sprinter:</strong> anaerobic (1 mark); glucose &rarr; lactic acid / glucose is broken down without oxygen and produces lactic acid (1 mark).</li><li><strong>Long-distance runner:</strong> aerobic (1 mark); glucose + oxygen &rarr; carbon dioxide + water / glucose is broken down with oxygen to produce carbon dioxide and water (1 mark).</li></ul>",
                hint: "A short explosive sprint relies on no oxygen, whereas a steady-state marathon relies on continuous oxygen supply.",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 4,
                question: "Performer A is lifting a heavy weight and Performer B is running at a steady pace in an endurance race. Describe the differences between how energy is being released by Performer A and how energy is being released by Performer B.",
                markScheme: "1 mark for each comparative difference between the two performers (max 4):<br><ul><li><strong>Performer A (Weightlifter):</strong> converts glucose into energy without oxygen (anaerobic) <strong>AND Performer B (Runner):</strong> converts glucose into energy with oxygen (aerobic);</li><li><strong>A:</strong> energy can only be released for a short period of time <strong>AND B:</strong> energy can be released over a long period of time;</li><li><strong>A:</strong> waste product is lactic acid <strong>AND B:</strong> waste products are water and carbon dioxide;</li><li><strong>A:</strong> muscles tire/fatigue quickly (high intensity / fast energy release) <strong>AND B:</strong> muscles maintain contractions for a long time (low intensity / slow energy release);</li><li><strong>A:</strong> an oxygen debt is created <strong>AND B:</strong> an oxygen debt is not created;</li></ul>",
                hint: "Compare oxygen use, waste products, duration, intensity, and oxygen debt between lifting a heavy weight and running long distances.",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 3,
                question: "Sprinting in track and field athletics is usually performed at high intensity. Outline how energy is released during a sprint. Include a summary equation in your answer.",
                markScheme: "<ul><li>Energy is released anaerobically / without oxygen being present (1 mark).</li><li>Equation: <strong>glucose</strong> (1 mark) &rarr; <strong>lactic acid</strong> (1 mark).</li></ul>",
                hint: "State that it happens without oxygen (anaerobic) for 1 mark, and write out both sides of the anaerobic equation for the other 2 marks.",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 2,
                question: "State a physical activity with an energy demand that is mainly aerobic. Give a reason for your answer.",
                markScheme: "<ul><li><strong>Physical activity (1 mark):</strong> An endurance activity, e.g. cross-country running / marathon running / long-distance cycling.</li><li><strong>Reason (1 mark):</strong> The activity requires energy over a long period of time / low-to-moderate intensity / oxygen can be supplied to muscles throughout / lactic acid is not produced so the performer does not tire quickly.</li></ul>",
                hint: "Pick any endurance sport and explain why it requires continuous oxygen and low-to-moderate intensity.",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 4,
                question: "Name one physical activity that uses mainly aerobic respiration and one physical activity that uses mainly anaerobic respiration. Give two justifications for each physical activity.",
                markScheme: "No marks for naming the activities alone; up to 2 marks for justifications for each appropriate activity:<br><ul><li><strong>Mainly aerobic (e.g. Cross-country running / cycling):</strong><br>1. Endurance-based / requires energy over a long period of time;<br>2. Low-to-moderate intensity / oxygen is supplied continuously / no lactic acid produced so muscles do not fatigue quickly (up to 2 marks).</li><li><strong>Mainly anaerobic (e.g. 100m sprint / shot put / long jump):</strong><br>1. Short duration / requires energy over a very short period of time;<br>2. High intensity / explosive muscular force/power required quickly without oxygen (up to 2 marks).</li></ul>",
                hint: "Pair an endurance event with 2 aerobic reasons (duration + intensity), and a sprint/throw/jump with 2 anaerobic reasons (duration + intensity).",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 2,
                question: "Describe, using two different physical activities, situations when a performer is likely to change from using aerobic respiration to using anaerobic respiration.",
                markScheme: "1 mark for each valid description in two different activities:<br><ul><li><strong>Track and field / Cycling:</strong> running/cycling at a steady pace during a distance race (aerobic), then sprinting in the final stages for the finish line (anaerobic);</li><li><strong>Basketball:</strong> moving at a steady pace while defending in a zone (aerobic), then sprinting down the court on a fast break when the ball is won (anaerobic);</li><li><strong>Football:</strong> jogging slowly into the penalty box (aerobic), then performing an explosive jump to head the ball (anaerobic);</li></ul>",
                hint: "Think about pacing: when does a player cruise at a steady aerobic pace and then suddenly burst into an all-out anaerobic effort?",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 2,
                question: "Explain why a performer can only sprint for short distances.",
                markScheme: "1 mark for each explanation (Any 2 of):<br><ul><li>Lactic acid builds up rapidly in the working muscles, which reduces the efficiency of muscular contractions and causes rapid fatigue;</li><li>The body does not have time to supply the muscles with enough oxygen for the high intensity required;</li><li>Sprinting recruits fast-twitch muscle fibres and rapidly depletes fuel stores, which tire quickly;</li></ul>",
                hint: "What waste product builds up when you sprint flat-out without enough oxygen, and how does it affect your muscles?",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 2,
                question: "Describe two differences between aerobic respiration and anaerobic respiration.",
                markScheme: "1 mark for each comparative difference (Any 2 of):<br><ul><li>Aerobic uses oxygen <strong>AND</strong> anaerobic does not use oxygen;</li><li>Aerobic produces carbon dioxide and water <strong>AND</strong> anaerobic produces lactic acid;</li><li>Aerobic can be used for a long duration (low/moderate intensity) <strong>AND</strong> anaerobic can only be used for a short duration (high intensity);</li></ul>",
                hint: "Contrast oxygen presence, waste products, or duration/intensity.",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 2,
                question: "State the main type of respiration taking place:<br>(i) during a tennis serve<br>(ii) when taking part in a long tennis rally",
                markScheme: "<ul><li><strong>(i) During a tennis serve:</strong> Anaerobic (1 mark).</li><li><strong>(ii) During a long tennis rally:</strong> Aerobic (1 mark).</li></ul>",
                hint: "A serve is a single explosive movement; a long rally requires sustained endurance.",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 2,
                question: "Explain why the main form of respiration used by a sprinter is anaerobic.",
                markScheme: "2 marks from:<br><ul><li>Short duration / short distance, meaning there is not enough time to take in and transport the amount of oxygen required;</li><li>High intensity / explosive, powerful movements require energy much faster than it can be produced by the aerobic system;</li></ul>",
                hint: "Link your answer to the two key factors: duration (how long) and intensity (how hard/fast).",
                isOfficial: true
            },
            {
                section: "Aerobic and anaerobic respiration",
                marks: 2,
                question: "Explain the aerobic energy demands and the anaerobic energy demands for a performer in a 2000-metre rowing (sculling) race.",
                markScheme: "<ul><li><strong>Aerobic (1 mark):</strong> During the main middle part of the race, the rower uses aerobic respiration to maintain a steady pace over a long duration at a lower/moderate intensity.</li><li><strong>Anaerobic (1 mark):</strong> At the explosive start of the race and during the final sprint finish, the rower uses anaerobic respiration due to the very high stroke rate and high intensity.</li></ul>",
                hint: "Think about how a 6-to-7 minute rowing race is paced: the start/finish vs the middle body of the race.",
                isOfficial: true
            },

            // ==========================================
            // Recovery (12 Questions)
            // ==========================================
            {
                section: "Recovery",
                marks: 3,
                question: "Describe how Excess Post-exercise Oxygen Consumption (EPOC) aids recovery after exercise.",
                markScheme: "1 mark for each description (Any 3 of):<br><ul><li>After exercise, the body continues to take in additional/excessive oxygen (breathing rate stays high and reduces gradually);</li><li>Heart rate and cardiac output stay elevated to transport oxygen around the body;</li><li>Removes lactic acid (converts it into water, carbon dioxide, and glucose);</li><li>Removes excess carbon dioxide;</li><li>Maintains high rates of aerobic respiration and restores glycogen to return the body to its resting state;</li></ul>",
                hint: "Why do your breathing rate and heart rate stay elevated after finishing a hard race?",
                isOfficial: true
            },
            {
                section: "Recovery",
                marks: 1,
                question: "State what Excess Post-exercise Oxygen Consumption (EPOC) is also known as.",
                markScheme: "<ul><li>Oxygen debt (1 mark).</li></ul>",
                hint: "It is the term used for 'borrowing' oxygen during anaerobic exercise that must be paid back afterward.",
                isOfficial: true
            },
            {
                section: "Recovery",
                marks: 3,
                question: "Explain how EPOC allows the body to recover after intense anaerobic exercise.",
                markScheme: "3 marks from:<br><ul><li>Maintains a high breathing rate and deep tidal volume after exercise finishes;</li><li>Takes in additional oxygen above resting levels to repay the oxygen debt;</li><li>Uses the extra oxygen to break down and remove lactic acid;</li><li>Converts lactic acid into carbon dioxide, water, and glucose to return the body to its resting state;</li></ul>",
                hint: "Mention breathing rate staying high, repaying the oxygen debt, and breaking down lactic acid.",
                isOfficial: true
            },
            {
                section: "Recovery",
                marks: 3,
                question: "Explain how three factors affect a performer's recovery time after exercise.",
                markScheme: "1 mark for each explanation of the effect on recovery time (Any 3 of):<br><ul><li><strong>Intensity of exercise:</strong> the harder/more intense the exercise, the greater the lactic acid build-up and the longer the recovery period;</li><li><strong>Age:</strong> older performers generally take longer to recover than younger performers;</li><li><strong>Level of fitness:</strong> a fitter performer has a stronger cardiovascular system to deliver oxygen and remove lactic acid faster;</li><li><strong>Sleep:</strong> good quality and quantity of sleep allows the body to recover faster physically and mentally;</li><li><strong>Diet / Hydration:</strong> consuming carbohydrates/protein and rehydrating promptly after exercise speeds up glycogen replenishment and muscle repair;</li><li><strong>Cool down / Recovery aids:</strong> active cool-downs, massage, or ice baths improve blood flow and speed up lactic acid removal;</li><li><strong>Genetics:</strong> some performers inherit the ability to recover faster from their parents;</li></ul>",
                hint: "Pick three factors (e.g. intensity, age, fitness level, sleep, hydration, cool-down) and explain whether they make recovery faster or slower.",
                isOfficial: true
            },
            {
                section: "Recovery",
                marks: 3,
                question: "Recovery is an important aspect of a cross-country runner's training programme. Describe what is meant by EPOC.",
                markScheme: "3 marks from:<br><ul><li>The amount of oxygen consumed/taken in after exercise;</li><li>Above the amount that would normally be consumed at rest (also known as oxygen debt);</li><li>Requires maintaining an elevated breathing rate and heart rate during recovery;</li><li>Used to break down and remove lactic acid produced during anaerobic efforts;</li></ul>",
                hint: "Break down the acronym: Excess Post-exercise Oxygen Consumption—what is it, how is it achieved, and what does it remove?",
                isOfficial: true
            },
            {
                section: "Recovery",
                marks: 2,
                question: "Explain how two factors, other than a cool down, can affect the recovery time of a performer.",
                markScheme: "1 mark for each explanation demonstrating quicker or longer recovery (Any 2 of):<br><ul><li><strong>Level of strength and fitness:</strong> fitter performers have stronger muscles and cardiovascular systems that absorb oxygen and remove lactic acid more quickly;</li><li><strong>Age:</strong> older performers generally require a longer recovery time than younger performers;</li><li><strong>Overtraining:</strong> a performer who has been overtraining will fatigue faster and take much longer to recover;</li><li><strong>Hydration / Diet:</strong> dehydration or failing to eat post-exercise nutrition at the right time slows down recovery;</li></ul>",
                hint: "Do not mention a cool down! Pick two from fitness level, age, sleep, hydration, diet, or intensity.",
                isOfficial: true
            },
            {
                section: "Recovery",
                marks: 2,
                question: "Describe how a performer may assist the removal of lactic acid from their muscles after a sprint race.",
                markScheme: "2 marks from:<br><ul><li>Perform an active cool down (light jogging and stretching to maintain blood flow);</li><li>Take in additional oxygen after exercise by maintaining a high breathing rate (EPOC);</li><li>Maintain good levels of hydration and eat carbohydrates/protein soon after the event;</li><li>Use recovery therapies such as sports massage or contrast (hot/cold) ice baths;</li></ul>",
                hint: "What practical steps can an athlete take immediately after a race to flush out lactic acid?",
                isOfficial: true
            },
            {
                section: "Recovery",
                marks: 1,
                question: "Describe the process of Excess Post-exercise Oxygen Consumption (EPOC) in one sentence.",
                markScheme: "<ul><li>The process of taking in additional oxygen needed by cells in the body after exercise in order to remove lactic acid / pay back the oxygen debt (1 mark).</li></ul>",
                hint: "Focus on 'additional oxygen' and 'removing lactic acid / paying back oxygen debt'.",
                isOfficial: true
            },
            {
                section: "Recovery",
                marks: 4,
                question: "Describe the term 'oxygen debt' and explain how the body pays back the oxygen debt after strenuous exercise.",
                markScheme: "<ul><li><strong>Description (1 mark):</strong> Oxygen debt is the temporary oxygen shortage in body tissues arising from anaerobic exercise / the amount of oxygen needed to break down lactic acid.</li><li><strong>Explanation (up to 3 marks):</strong><ul><li>The body takes in additional oxygen after exercise (EPOC);</li><li>Achieved by maintaining an elevated breathing rate, tidal volume (minute ventilation), and heart rate (cardiac output);</li><li>The additional oxygen reacts with lactic acid to break it down into water, carbon dioxide, and glucose;</li></ul></li></ul>",
                hint: "This is the exact 4-mark past exam question from your Chapter 4.2 slides: 1 mark for defining oxygen debt, 3 marks for explaining how EPOC pays it back.",
                isOfficial: false
            },

        // Conversational reflection prompts
        const reflectionPrompts = [
            "How did you do? Be honest with yourself—how many marks out of the total would you give your answer?",
            "Did anything in the mark scheme surprise you?",
            "If you dropped any marks here, what's your plan to make sure you nail it next time?",
            "Did you use the exact terminology? Often, close isn't quite enough in the exam.",
            "How could you have improved your answer to guarantee full marks?",
            "What was the trickiest part of this question for you?",
            "Which part of the mark scheme did you completely forget to include?",
            "How did you do? Are you confident to move on, or do you need to revisit this topic?"
        ];

        let currentQuestion = null;
        let recentQuestions = []; // Anti-repeat session tracker
        let bypassActive = false;

        // DOM Elements
        const sectionSelect = document.getElementById('section-select');
        const btnRandom = document.getElementById('btn-random');
        const questionContainer = document.getElementById('question-container');
        const displayQuestion = document.getElementById('display-question');
        const displayMarks = document.getElementById('display-marks');
        const userAnswer = document.getElementById('user-answer');
        const btnReveal = document.getElementById('btn-reveal');
        const btnHint = document.getElementById('btn-hint');
        const hintBox = document.getElementById('hint-box');
        const displayHint = document.getElementById('display-hint');
        const markSchemeContainer = document.getElementById('mark-scheme-container');
        const displayMarkScheme = document.getElementById('display-mark-scheme');
        const displayReflection = document.getElementById('display-reflection');
        const btnNext = document.getElementById('btn-next');
        
        // Traffic Light Elements

        const trafficDot = document.getElementById('traffic-light-dot');
        const trafficText = document.getElementById('traffic-light-text');

        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalBtnPrimary = document.getElementById('modal-btn-primary');
        const modalBtnSecondary = document.getElementById('modal-btn-secondary');

        // Functions
        function showModal(title, message, primaryText, secondaryText, onPrimaryClick, onSecondaryClick) {
            modalTitle.textContent = title;
            modalMessage.innerHTML = message;
            
            modalBtnPrimary.textContent = primaryText;
            modalBtnPrimary.onclick = () => {
                hideModal();
                if (onPrimaryClick) onPrimaryClick();
            };
            
            if (secondaryText) {
                modalBtnSecondary.textContent = secondaryText;
                modalBtnSecondary.classList.remove('hidden');
                modalBtnSecondary.onclick = () => {
                    hideModal();
                    if (onSecondaryClick) onSecondaryClick();
                };
            } else {
                modalBtnSecondary.classList.add('hidden');
            }
            
            customModal.classList.remove('hidden');
        }
        
        function hideModal() {
            customModal.classList.add('hidden');
        }

        function loadQuestion() {
            const selectedSection = sectionSelect.value;
            let filteredQuestions = questions;
            
            if (selectedSection !== 'all') {
                filteredQuestions = questions.filter(q => q.section === selectedSection);
            }
            
            if (filteredQuestions.length === 0) {
                showModal("Oops!", "No questions found for this section.", "OK");
                return;
            }

            // Filter out recently asked questions to avoid immediate repeats
            let availableQuestions = filteredQuestions.filter(q => !recentQuestions.includes(q));
            
            // If all questions in this category have been shown recently, reset history
            if (availableQuestions.length === 0) {
                recentQuestions = [];
                availableQuestions = filteredQuestions;
            }

            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            currentQuestion = availableQuestions[randomIndex];

            // Track recent questions (store up to 4 recent picks)
            recentQuestions.push(currentQuestion);
            if (recentQuestions.length > 4) {
                recentQuestions.shift();
            }

            // Setup Traffic Light UI
            trafficBanner.classList.remove('bg-green-100', 'border-green-300', 'bg-amber-100', 'border-amber-300');
            trafficDot.classList.remove('bg-green-500', 'bg-amber-500');
            
            if (currentQuestion.isOfficial) {
                trafficBanner.classList.add('bg-green-100', 'border-green-300');
                trafficDot.classList.add('bg-green-500');
                trafficText.innerHTML = "Official Cambridge Mark Scheme. Highly reliable.";
            } else {
                trafficBanner.classList.add('bg-amber-100', 'border-amber-300');
                trafficDot.classList.add('bg-amber-500');
                trafficText.innerHTML = "Syllabus-aligned but AI-generated. Be extra sceptical at times—always check against course material and ask each other and Coach Jamie if you have doubts.";
            }

            // Reset UI
            displayQuestion.innerHTML = currentQuestion.question;
            displayMarks.textContent = `[${currentQuestion.marks} mark${currentQuestion.marks > 1 ? 's' : ''}]`;
            userAnswer.value = '';
            userAnswer.disabled = false;
            questionContainer.classList.remove('hidden');
            markSchemeContainer.classList.add('hidden');
            hintBox.classList.add('hidden');
            bypassActive = false;
        }

        function revealMarkScheme() {
            const answer = userAnswer.value.trim();
            
            // Check for empty box
            if (answer === '') {
                showModal(
                    "Hold up!", 
                    "Oh no you don't! You have to write <em>something</em> before I show you the answer.<br><br>If that something is 'I don't know', that's fine, but take note: this is obviously an area you need to revisit again later.", 
                    "Try again"
                );
                return;
            }

            // Check for "I don't know" variants
            const idkVariants = ["i don't know", "idk", "i dunno", "no idea", "pass"];
            const isIdk = idkVariants.some(variant => answer.toLowerCase().includes(variant));
            
            if (isIdk) {
                processReveal();
                return;
            }

            // Word count validation (approx > 50% of mark scheme words)
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = currentQuestion.markScheme;
            const markSchemeText = tempDiv.textContent || tempDiv.innerText || "";
            
            const msWordCount = markSchemeText.split(/\s+/).filter(word => word.length > 0).length;
            const answerWordCount = answer.split(/\s+/).filter(word => word.length > 0).length;

            if (!bypassActive && (answerWordCount < (msWordCount * 0.5))) {
                showModal(
                    "Are you sure?", 
                    "Your answer looks a bit brief compared to what the examiner is looking for. <br><br>Have you given it your best shot?", 
                    "Sorry Coach, that's all I've got. Show me the mark scheme; I'll be honest with myself and come back better!", 
                    "Let me back in Coach, I've got more to say",
                    () => {
                        bypassActive = true;
                        processReveal();
                    },
                    () => {
                        userAnswer.focus();
                    }
                );
                return;
            }

            processReveal();
        }

        function processReveal() {
            displayMarkScheme.innerHTML = currentQuestion.markScheme;
            
            // Generate Random Reflection Prompt
            const randomPrompt = reflectionPrompts[Math.floor(Math.random() * reflectionPrompts.length)];
            displayReflection.textContent = randomPrompt;

            userAnswer.disabled = true;
            markSchemeContainer.classList.remove('hidden');
            
            // Scroll to mark scheme smoothly
            markSchemeContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Event Listeners
        btnRandom.addEventListener('click', loadQuestion);
        
        btnHint.addEventListener('click', () => {
            if (currentQuestion && currentQuestion.hint) {
                displayHint.textContent = currentQuestion.hint;
                hintBox.classList.remove('hidden');
            }
        });

        btnReveal.addEventListener('click', revealMarkScheme);
        btnNext.addEventListener('click', loadQuestion);

        // Close modal if clicking outside the box
        customModal.addEventListener('click', (e) => {
            if (e.target === customModal) {
                hideModal();
            }
        });

    </script>
