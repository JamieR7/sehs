                marks: 3,
                question: "Name the muscle groups located at the front of the upper leg, back of the upper leg, and the calf.",
                markScheme: "1 mark for each:<br><ul><li><strong>Front of upper leg:</strong> Quadriceps group</li><li><strong>Back of upper leg:</strong> Hamstring group</li><li><strong>Calf:</strong> Gastrocnemius</li></ul>",
                hint: "Think quads, hammies, and the scientific name for the calf.",
                isOfficial: false
            },
            {
                section: "Muscles",
                marks: 2,
                question: "Identify the muscle located across the chest and state its role.",
                markScheme: "<ul><li><strong>Muscle:</strong> Pectorals. (1 mark)</li><li><strong>Role:</strong> Adducts the arm at the shoulder (or draws the arm across the chest/pushing action). (1 mark)</li></ul>",
                hint: "The muscle used heavily in a bench press or push-up.",
                isOfficial: false
            },
            {
                section: "Muscles",
                marks: 2,
                question: "State the location of the trapezius and latissimus dorsi muscles.",
                markScheme: "<ul><li><strong>Trapezius:</strong> Upper back / neck area. (1 mark)</li><li><strong>Latissimus dorsi:</strong> Mid / lower back / wrapping around the side of the torso. (1 mark)</li></ul>",
                hint: "Both are on the posterior (back) of the body. One shrugs the shoulders, the other pulls the arms down.",
                isOfficial: false
            },
            {
                section: "Muscles",
                marks: 1,
                question: "Describe the role of the deltoid muscle during a tennis serve.",
                markScheme: "Abducts the arm at the shoulder / raises the arm to hit the ball. (1 mark)",
                hint: "The deltoid is the shoulder muscle. What does it do to lift the racket?",
                isOfficial: false
            },

            // ==========================================
            // Antagonistic muscle action
            // ==========================================
            {
                section: "Antagonistic muscle action",
                marks: 3,
                question: "Explain antagonistic muscle action at the elbow during the upward phase of a bicep curl. Identify the agonist and antagonist.",
                markScheme: "<ul><li>Muscles work in pairs; as one contracts, the other relaxes. (1 mark)</li><li><strong>Agonist (Prime Mover):</strong> The Biceps contract (shorten) to flex the elbow. (1 mark)</li><li><strong>Antagonist:</strong> The Triceps relax to allow the movement to happen. (1 mark)</li></ul>",
                hint: "Which muscle is doing the work to lift the weight, and which one has to stretch out to let it happen?",
                isOfficial: false
            },
            {
                section: "Antagonistic muscle action",
                marks: 2,
                question: "Differentiate between a concentric and an eccentric isotonic contraction.",
                markScheme: "<ul><li><strong>Concentric:</strong> The muscle shortens while generating force (e.g. lifting a weight). (1 mark)</li><li><strong>Eccentric:</strong> The muscle lengthens while under tension (e.g. lowering a weight slowly under control). (1 mark)</li></ul>",
                hint: "Both involve movement (isotonic), but one shortens the muscle and the other lengthens it under tension.",
                isOfficial: false
            },
            {
                section: "Antagonistic muscle action",
                marks: 2,
                question: "Define an isometric contraction and provide a sporting example.",
                markScheme: "<ul><li><strong>Definition:</strong> The muscle contracts and generates tension, but there is no change in muscle length and no movement at the joint. (1 mark)</li><li><strong>Example:</strong> Pushing in a rugby scrum / holding a handstand in gymnastics / holding a plank position. (1 mark)</li></ul>",
                hint: "Think 'iso' = same, 'metric' = length. What sports require you to hold a pose and push hard without moving?",
                isOfficial: false
            },
            {
                section: "Antagonistic muscle action",
                marks: 3,
                question: "Explain the antagonistic muscle action at the knee joint when a basketball player jumps for a rebound.",
                markScheme: "<ul><li><strong>Agonist:</strong> Quadriceps group contract to extend the knee. (1 mark)</li><li><strong>Antagonist:</strong> Hamstring group relaxes to allow the extension. (1 mark)</li><li>This coordinated action allows the player to straighten their legs forcefully to jump. (1 mark)</li></ul>",
                hint: "To jump, you have to straighten your legs. Which muscle fires to straighten the knee?",
                isOfficial: false
            },
            {
                section: "Antagonistic muscle action",
                marks: 2,
                question: "Describe an isometric contraction, giving an example from gymnastics.",
                markScheme: "<ul><li><strong>Description:</strong> The muscle contracts and creates tension but stays the same length (no movement at the joint). (1 mark)</li><li><strong>Example:</strong> Holding a crucifix position on the rings / holding a handstand. (1 mark)</li></ul>",
                hint: "Think of poses where the gymnast is perfectly still but their muscles are working incredibly hard.",
                isOfficial: false
            },
            {
                section: "Antagonistic muscle action",
                marks: 2,
                question: "Identify the agonist and antagonist at the knee joint when a footballer prepares to kick a ball by pulling their leg backwards.",
                markScheme: "<ul><li><strong>Agonist (Prime Mover):</strong> Hamstring group (contracts to flex the knee). (1 mark)</li><li><strong>Antagonist:</strong> Quadriceps group (relaxes). (1 mark)</li></ul>",
                hint: "This is the 'wind up' phase where the knee bends backwards. Which muscle bends the knee?",
                isOfficial: false
            },

            // ==========================================
            // Muscle fibre types
            // ==========================================
            {
                section: "Muscle fibre types",
                marks: 3,
                question: "Compare slow twitch and fast twitch muscle fibres in terms of force created, fatigue tolerance, and energy supply.",
                markScheme: "Award 1 mark for each correct comparison, up to 3 marks:<br><ul><li><strong>Force created:</strong> Fast twitch fibres generate a high amount of force quickly, whereas slow twitch generate low force.</li><li><strong>Fatigue tolerance:</strong> Slow twitch fibres have high fatigue tolerance (can work for a long time), whereas fast twitch tire very quickly.</li><li><strong>Energy supply:</strong> Slow twitch rely on the aerobic energy supply (using oxygen), whereas fast twitch rely on the anaerobic energy supply.</li></ul>",
                hint: "Compare a marathon runner's muscles to a shot putter's muscles.",
                isOfficial: false
            },
            {
                section: "Muscle fibre types",
                marks: 2,
                question: "Identify the main muscle fibre type used by a marathon runner and state its primary energy supply.",
                markScheme: "<ul><li><strong>Fibre type:</strong> Slow twitch muscle fibres. (1 mark)</li><li><strong>Energy supply:</strong> Aerobic energy supply. (1 mark)</li></ul>",
                hint: "They run for hours without stopping, so they need oxygen-fueled fibres that don't get tired.",
                isOfficial: false
            },
            {
                section: "Muscle fibre types",
                marks: 2,
                question: "Identify the main muscle fibre type used by a 100m sprinter and explain why it is suited to this event.",
                markScheme: "<ul><li><strong>Fibre type:</strong> Fast twitch muscle fibres. (1 mark)</li><li><strong>Explanation:</strong> They generate maximum force quickly for explosive speed, utilizing the anaerobic energy system for the short duration of the race. (1 mark)</li></ul>",
                hint: "Explosive speed requires high force very quickly, but it tires out fast.",
                isOfficial: false
            },
            {
                section: "Muscle fibre types",
                marks: 2,
                question: "Suggest why a 1500-metre swimmer requires a high percentage of slow-twitch muscle fibres.",
                markScheme: "<ul><li>Slow twitch fibres have high fatigue tolerance (they can work for a long time without tiring). (1 mark)</li><li>This suits the long-duration, aerobic nature of the 1500m swim. (1 mark)</li></ul>",
                hint: "It's a long race. What property of slow-twitch fibres makes them perfect for this?",
                isOfficial: false
            },
            {
                section: "Muscle fibre types",
                marks: 2,
                question: "Explain the difference in energy supply between fast-twitch and slow-twitch muscle fibres.",
                markScheme: "<ul><li>Slow-twitch fibres rely primarily on the aerobic energy supply (using oxygen to release energy). (1 mark)</li><li>Fast-twitch fibres rely primarily on the anaerobic energy supply (releasing energy without oxygen for quick bursts). (1 mark)</li></ul>",
                hint: "One uses oxygen, the other doesn't.",
                isOfficial: false
            },
            {
                section: "Muscle fibre types",
                marks: 2,
                question: "Identify the muscle fibre type most suited to a weightlifter performing a 1-rep max lift, and justify your choice.",
                markScheme: "<ul><li><strong>Fibre type:</strong> Fast-twitch fibres. (1 mark)</li><li><strong>Justification:</strong> They produce maximum force quickly for explosive movements (even though they fatigue quickly). (1 mark)</li></ul>",
                hint: "A 1-rep max requires immense power for just a few seconds.",
                isOfficial: false
            }
        ];

        // Conversational reflection prompts
        const reflectionPrompts = [
            "How did you do? Be honest with yourself—how many marks out of the total would you give your answer?",
            "Did anything in the mark scheme surprise you?",
            "If you dropped any marks here, what's your plan to make sure you nail it next time?",
            "Did you use the exact terminology? Often, close isn't quite enough in the exam.",
            "How could you have improved your answer to guarantee full marks?",
            "What was the trickiest part of this question for you?",
            "Which part of the mark scheme did you completely forget to include?",
            "How did you do? Are you confident to move on, or do you need to revisit this topic?"
        ];

        let currentQuestion = null;
        let recentQuestions = []; // Anti-repeat session tracker
        let bypassActive = false;

        // DOM Elements
        const sectionSelect = document.getElementById('section-select');
        const btnRandom = document.getElementById('btn-random');
        const questionContainer = document.getElementById('question-container');
        const displayQuestion = document.getElementById('display-question');
        const displayMarks = document.getElementById('display-marks');
        const userAnswer = document.getElementById('user-answer');
        const btnReveal = document.getElementById('btn-reveal');
        const btnHint = document.getElementById('btn-hint');
        const hintBox = document.getElementById('hint-box');
        const displayHint = document.getElementById('display-hint');
        const markSchemeContainer = document.getElementById('mark-scheme-container');
        const displayMarkScheme = document.getElementById('display-mark-scheme');
        const displayReflection = document.getElementById('display-reflection');
        const btnNext = document.getElementById('btn-next');
        
        // Traffic Light Elements
        const trafficBanner = document.getElementById('traffic-light-banner');
        const trafficDot = document.getElementById('traffic-light-dot');
        const trafficText = document.getElementById('traffic-light-text');

        // Modal Elements
        const customModal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalBtnPrimary = document.getElementById('modal-btn-primary');
        const modalBtnSecondary = document.getElementById('modal-btn-secondary');

        // Functions
        function showModal(title, message, primaryText, secondaryText, onPrimaryClick, onSecondaryClick) {
            modalTitle.textContent = title;
            modalMessage.innerHTML = message;
            
            modalBtnPrimary.textContent = primaryText;
            modalBtnPrimary.onclick = () => {
                hideModal();
                if (onPrimaryClick) onPrimaryClick();
            };
            
            if (secondaryText) {
                modalBtnSecondary.textContent = secondaryText;
                modalBtnSecondary.classList.remove('hidden');
                modalBtnSecondary.onclick = () => {
                    hideModal();
                    if (onSecondaryClick) onSecondaryClick();
                };
            } else {
                modalBtnSecondary.classList.add('hidden');
            }
            
            customModal.classList.remove('hidden');
        }
        
        function hideModal() {
            customModal.classList.add('hidden');
        }

        function loadQuestion() {
            const selectedSection = sectionSelect.value;
            let filteredQuestions = questions;
            
            if (selectedSection !== 'all') {
                filteredQuestions = questions.filter(q => q.section === selectedSection);
            }
            
            if (filteredQuestions.length === 0) {
                showModal("Oops!", "No questions found for this section.", "OK");
                return;
            }

            // Filter out recently asked questions to avoid immediate repeats
            let availableQuestions = filteredQuestions.filter(q => !recentQuestions.includes(q));
            
            // If all questions in this category have been shown recently, reset history
            if (availableQuestions.length === 0) {
                recentQuestions = [];
                availableQuestions = filteredQuestions;
            }

            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            currentQuestion = availableQuestions[randomIndex];

            // Track recent questions (store up to 4 recent picks)
            recentQuestions.push(currentQuestion);
            if (recentQuestions.length > 4) {
                recentQuestions.shift();
            }

            // Setup Traffic Light UI
            trafficBanner.classList.remove('bg-green-100', 'border-green-300', 'bg-amber-100', 'border-amber-300');
            trafficDot.classList.remove('bg-green-500', 'bg-amber-500');
            
            if (currentQuestion.isOfficial) {
                trafficBanner.classList.add('bg-green-100', 'border-green-300');
                trafficDot.classList.add('bg-green-500');
                trafficText.innerHTML = "Official Cambridge Mark Scheme. Highly reliable.";
            } else {
                trafficBanner.classList.add('bg-amber-100', 'border-amber-300');
                trafficDot.classList.add('bg-amber-500');
                trafficText.innerHTML = "Syllabus-aligned but AI-generated. Be extra sceptical at times—always check against course material and ask each other and Coach Jamie if you have doubts.";
            }

            // Reset UI
            displayQuestion.innerHTML = currentQuestion.question;
            displayMarks.textContent = `[${currentQuestion.marks} mark${currentQuestion.marks > 1 ? 's' : ''}]`;
            userAnswer.value = '';
            userAnswer.disabled = false;
            questionContainer.classList.remove('hidden');
            markSchemeContainer.classList.add('hidden');
            hintBox.classList.add('hidden');
            bypassActive = false;
        }

        function revealMarkScheme() {
            const answer = userAnswer.value.trim();
            
            // Check for empty box
            if (answer === '') {
                showModal(
                    "Hold up!", 
                    "Oh no you don't! You have to write <em>something</em> before I show you the answer.<br><br>If that something is 'I don't know', that's fine, but take note: this is obviously an area you need to revisit again later.", 
                    "Try again"
                );
                return;
            }

            // Check for "I don't know" variants
            const idkVariants = ["i don't know", "idk", "i dunno", "no idea", "pass"];
            const isIdk = idkVariants.some(variant => answer.toLowerCase().includes(variant));
            
            if (isIdk) {
                processReveal();
                return;
            }

            // Word count validation (approx > 50% of mark scheme words)
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = currentQuestion.markScheme;
            const markSchemeText = tempDiv.textContent || tempDiv.innerText || "";
            
            const msWordCount = markSchemeText.split(/\s+/).filter(word => word.length > 0).length;
            const answerWordCount = answer.split(/\s+/).filter(word => word.length > 0).length;

            if (!bypassActive && (answerWordCount < (msWordCount * 0.5))) {
                showModal(
                    "Are you sure?", 
                    "Your answer looks a bit brief compared to what the examiner is looking for. <br><br>Have you given it your best shot?", 
                    "Sorry Coach, that's all I've got. Show me the mark scheme; I'll be honest with myself and come back better!", 
                    "Let me back in Coach, I've got more to say",
                    () => {
                        bypassActive = true;
                        processReveal();
                    },
                    () => {
                        userAnswer.focus();
                    }
                );
                return;
            }

            processReveal();
        }

        function processReveal() {
            displayMarkScheme.innerHTML = currentQuestion.markScheme;
            
            // Generate Random Reflection Prompt
            const randomPrompt = reflectionPrompts[Math.floor(Math.random() * reflectionPrompts.length)];
            displayReflection.textContent = randomPrompt;

            userAnswer.disabled = true;
            markSchemeContainer.classList.remove('hidden');
            
            // Scroll to mark scheme smoothly
            markSchemeContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Event Listeners
        btnRandom.addEventListener('click', loadQuestion);
        
        btnHint.addEventListener('click', () => {
            if (currentQuestion && currentQuestion.hint) {
                displayHint.textContent = currentQuestion.hint;
                hintBox.classList.remove('hidden');
            }
        });

        btnReveal.addEventListener('click', revealMarkScheme);
        btnNext.addEventListener('click', loadQuestion);

        // Close modal if clicking outside the box
        customModal.addEventListener('click', (e) => {
            if (e.target === customModal) {
                hideModal();
            }
        });

    </script>
</body>
</html>
