        // Conversational reflection prompts
        const reflectionPrompts = [

        // Functions
        function showModal(title, message, primaryText, secondaryText, onPrimaryClick, onSecondaryClick) {
            modalTitle.textContent = title;
            modalMessage.innerHTML = message;
            
            modalBtnPrimary.textContent = primaryText;
            modalBtnPrimary.onclick = () => {
                hideModal();
                if (onPrimaryClick) onPrimaryClick();
            };
            
            if (secondaryText) {
                modalBtnSecondary.textContent = secondaryText;
                modalBtnSecondary.classList.remove('hidden');
                modalBtnSecondary.onclick = () => {
                    hideModal();
                    if (onSecondaryClick) onSecondaryClick();
                };
            } else {
                modalBtnSecondary.classList.add('hidden');
            }
            
            customModal.classList.remove('hidden');
        }
        
        function hideModal() {
            customModal.classList.add('hidden');
        }

        function loadQuestion() {
            const selectedSection = sectionSelect.value;
            let filteredQuestions = questions;
            
            if (selectedSection !== 'all') {
                filteredQuestions = questions.filter(q => q.section === selectedSection);
            }
            
            if (filteredQuestions.length === 0) {
                showModal("Oops!", "No questions found for this section.", "OK");
                return;
            }

            // Exhaustive Anti-Repeat: Filter out any question already seen in this cycle
            let availableQuestions = filteredQuestions.filter(q => !recentQuestions.includes(q));
            
            // Once all questions in the selected section have been seen, reset the deck
            if (availableQuestions.length === 0) {
                recentQuestions = [];
                // Prevent the very last question of the previous cycle from being the very first of the new cycle
                if (filteredQuestions.length > 1 && currentQuestion) {
                    availableQuestions = filteredQuestions.filter(q => q !== currentQuestion);
                } else {
                    availableQuestions = filteredQuestions;
                }
            }

            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            currentQuestion = availableQuestions[randomIndex];

            // Add to seen pile (never shifts out until the entire section is completed)
            recentQuestions.push(currentQuestion);

            // Setup Three-Tier Traffic Light UI
            trafficBanner.classList.remove('bg-green-100', 'border-green-300', 'bg-amber-100', 'border-amber-300');
            trafficDot.classList.remove('bg-green-500', 'bg-amber-500');
            
            if (currentQuestion.isOfficial) {
                trafficBanner.classList.add('bg-green-100', 'border-green-300');
                trafficDot.classList.add('bg-green-500');
                const paperRef = currentQuestion.paper ? ` (${currentQuestion.paper})` : '';
                if (currentQuestion.isDiagramAdapted) {
                    trafficText.innerHTML = `Official Cambridge Mark Scheme${paperRef}. Highly reliable. <span class="font-normal text-gray-600">(Note: Question text slightly adapted to remove diagram reference).</span>`;
                } else {
                    trafficText.innerHTML = `Official Cambridge Question & Mark Scheme${paperRef}. 100% Verbatim & highly reliable.`;
                }
            } else {
                trafficBanner.classList.add('bg-amber-100', 'border-amber-300');
                trafficDot.classList.add('bg-amber-500');
                trafficText.innerHTML = "Syllabus-aligned but AI-generated. Be extra sceptical at times—always check against course material and ask each other and Coach Jamie if you have doubts.";
            }

            // Reset UI
            displayQuestion.innerHTML = currentQuestion.question;
            displayMarks.textContent = `[${currentQuestion.marks} mark${currentQuestion.marks > 1 ? 's' : ''}]`;
            userAnswer.value = '';
            userAnswer.disabled = false;
            questionContainer.classList.remove('hidden');
            markSchemeContainer.classList.add('hidden');
            hintBox.classList.add('hidden');
            bypassActive = false;
        }

        function revealMarkScheme() {
            const answer = userAnswer.value.trim();
            
            // Check for empty box
            if (answer === '') {
                showModal(
                    "Hold up!", 
                    "Oh no you don't! You have to write <em>something</em> before I show you the answer.<br><br>If that something is 'I don't know', that's fine, but take note: this is obviously an area you need to revisit again later.", 
                    "Try again"
                );
                return;
            }

            // Check for "I don't know" variants
            const idkVariants = ["i don't know", "idk", "i dunno", "no idea", "pass"];
            const isIdk = idkVariants.some(variant => answer.toLowerCase().includes(variant));
            
            if (isIdk) {
                processReveal();
                return;
            }

            // Smart Word-Count Validator: Math.min(currentQuestion.marks * 6, msWordCount * 0.4)
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = currentQuestion.markScheme;
            const markSchemeText = tempDiv.textContent || tempDiv.innerText || "";
            
            const msWordCount = markSchemeText.split(/\s+/).filter(word => word.length > 0).length;
            const answerWordCount = answer.split(/\s+/).filter(word => word.length > 0).length;
            const minRequiredWords = Math.min(currentQuestion.marks * 6, msWordCount * 0.4);

            if (!bypassActive && (answerWordCount < minRequiredWords)) {
                showModal(
                    "Are you sure?", 
                    "Your answer looks a bit brief compared to what the examiner is looking for. <br><br>Have you given it your best shot?", 
                    "Sorry Coach, that's all I've got. Show me the mark scheme; I'll be honest with myself and come back better!", 
                    "Let me back in Coach, I've got more to say",
                    () => {
                        bypassActive = true;
                        processReveal();
                    },
                    () => {
                        userAnswer.focus();
                    }
                );
                return;
            }

            processReveal();
        }

        function processReveal() {
            displayMarkScheme.innerHTML = currentQuestion.markScheme;
            
            // Generate Random Reflection Prompt
            const randomPrompt = reflectionPrompts[Math.floor(Math.random() * reflectionPrompts.length)];
            displayReflection.textContent = randomPrompt;

            userAnswer.disabled = true;
            markSchemeContainer.classList.remove('hidden');
            
            // Scroll to mark scheme smoothly
            markSchemeContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Event Listeners
        btnRandom.addEventListener('click', loadQuestion);
        
        // Reset seen pile for new category and auto-load when dropdown changes
        sectionSelect.addEventListener('change', () => {
            recentQuestions = [];
            loadQuestion();
        });
        
        btnHint.addEventListener('click', () => {
            if (currentQuestion && currentQuestion.hint) {
                displayHint.textContent = currentQuestion.hint;
                hintBox.classList.remove('hidden');
            }
        });

        btnReveal.addEventListener('click', revealMarkScheme);
        btnNext.addEventListener('click', loadQuestion);

        // Close modal if clicking outside the box
        customModal.addEventListener('click', (e) => {
            if (e.target === customModal) {
                hideModal();
            }
        });

    </script>
