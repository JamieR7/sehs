            color: #111827 !important;

<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Header -->

        <div>
            <div class="mb-2">

    <!-- Main Content -->
    <main class="w-full max-w-4xl bg-white shadow-lg rounded-b-xl p-6 md:p-8 flex flex-col space-y-6">
        
        <!-- Controls -->
        <div class="flex flex-col sm:flex-row gap-4 items-center justify-between bg-gray-50 p-4 rounded-lg border border-gray-200">
            <div class="w-full sm:w-2/3">
                <label for="section-select" class="block text-sm font-bold text-cdlBlue mb-2">Select Syllabus Section:</label>
                <select id="section-select" class="w-full h-12 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cdlBrightBlue text-base cursor-pointer">
                    <option value="all">All Sections (Random - 54 Questions)</option>
                    <optgroup label="Respiratory System">
                        <option value="Pathway of air">&nbsp;&nbsp;&nbsp;&nbsp;Pathway of air</option>
                        <option value="Gaseous exchange at the alveoli">&nbsp;&nbsp;&nbsp;&nbsp;Gaseous exchange at the alveoli</option>

                    </optgroup>
                    <optgroup label="Circulatory System">
                        <option value="Components of blood">&nbsp;&nbsp;&nbsp;&nbsp;Components of blood</option>

                </select>
            </div>
            <div class="w-full sm:w-1/3 flex justify-end">
                <button id="btn-random" class="w-full h-12 sm:w-auto btn-blue px-6 py-2 mt-auto rounded-md font-bold shadow-md">
                    Load Question
                </button>
            </div>
        </div>

        <!-- Question Display -->
        <div id="question-container" class="hidden flex flex-col space-y-4">
            
            <!-- Traffic Light Indicator -->
            <div id="traffic-light-banner" class="flex items-start p-3 rounded-md border text-sm font-bold w-full transition-colors">
                <div id="traffic-light-dot" class="w-4 h-4 rounded-full mr-3 mt-0.5 flex-shrink-0"></div>
                <div id="traffic-light-text" class="text-gray-700 leading-tight"></div>
            </div>

            <div class="flex justify-between items-start pt-2">
                <h3 class="text-xl font-bold text-cdlBlue leading-snug" id="display-question">Question goes here</h3>

            </div>
            
            <div class="flex flex-col space-y-2">
                <label for="user-answer" class="text-sm font-bold text-gray-600">Your Answer:</label>
                <textarea id="user-answer" rows="5" class="w-full p-4 border-2 border-gray-200 rounded-md focus:outline-none focus:border-cdlBrightBlue resize-none text-gray-800" placeholder="Type your answer here..."></textarea>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-2">

            <!-- Hint Box -->
            <div id="hint-box" class="hidden bg-cdlBrightYellow bg-opacity-30 border-l-4 border-cdlGold p-4 rounded-r-md mt-4">

                <p id="display-hint" class="font-bold text-cdlBlue"></p>
            </div>
        </div>

        <!-- Mark Scheme Display -->
        <div id="mark-scheme-container" class="hidden mt-6 border-t-2 border-gray-100 pt-6">

                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>

            </h3>
            <div id="display-mark-scheme" class="bg-gray-50 p-5 rounded-md border border-gray-200 text-gray-800 leading-relaxed prose max-w-none">

            </div>

                <p id="display-reflection" class="text-lg font-light"></p>
            </div>
            
            <div class="mt-6 flex justify-end">
                <button id="btn-next" class="btn-blue px-6 py-3 rounded-md font-bold shadow-md flex items-center">
                    Next Question
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>
        </div>

    </main>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 border-t-8 border-cdlRed transform transition-all">
            <h3 id="modal-title" class="text-2xl font-bold text-cdlBlue mb-2">Notice</h3>
            <p id="modal-message" class="text-gray-600 mb-6 leading-relaxed"></p>
            <div class="flex flex-col space-y-3 mt-4">
                <button id="modal-btn-secondary" class="px-4 py-2 rounded-md font-bold text-gray-600 border border-gray-300 hover:bg-gray-100 hidden text-sm"></button>
                <button id="modal-btn-primary" class="btn-blue px-6 py-2 rounded-md font-bold shadow-sm text-sm"></button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            // ==========================================
            // RESPIRATORY SYSTEM
            // ==========================================

            // 1. Pathway of air (5 Questions)
            {
                section: "Pathway of air",
                marks: 2,
                question: "Complete the following pathway of air into the body:<br>1. nose or mouth<br>2. trachea<br>3. _______<br>4. _______<br>5. alveoli",
                markScheme: "<em>1 mark for each:</em><ul><li><strong>3:</strong> bronchi;</li><li><strong>4:</strong> bronchioles;</li></ul>",
                hint: "Think of an upside-down tree: the trachea is the trunk, which splits into two large branches (3), which then split into many smaller twigs (4).",
                isOfficial: true
            },
            {
                section: "Pathway of air",
                marks: 1,
                question: "Which letter, A, B or C, correctly shows the pathway of air into the lungs?<br><br>A: trachea &rarr; mouth/nasal passage &rarr; bronchioles &rarr; bronchi<br>B: mouth/nasal passage &rarr; bronchi &rarr; trachea &rarr; bronchioles<br>C: mouth/nasal passage &rarr; trachea &rarr; bronchi &rarr; bronchioles",
                markScheme: "<em>1 mark for:</em><br><strong>C;</strong>",
                hint: "Air goes in the mouth/nose, down the windpipe (trachea), splits into the two main tubes (bronchi), then into the smaller tubes (bronchioles).",
                isOfficial: true
            },
            {
                section: "Pathway of air",
                marks: 3,
                question: "Identify the structures A, B and C to complete the pathway of air into the body:<br><br>mouth/nasal passage &rarr; <strong>A</strong> &rarr; bronchi &rarr; <strong>B</strong> &rarr; <strong>C</strong>",
                markScheme: "<em>1 mark for each:</em><ul><li><strong>A:</strong> trachea;</li><li><strong>B:</strong> bronchioles;</li><li><strong>C:</strong> alveoli;</li></ul>",
                hint: "A is the windpipe. B are the small branches. C are the tiny air sacs where gas exchange happens.",
                isOfficial: true
            },
            {
                section: "Pathway of air",
                marks: 1,
                question: "Identify the structure that connects the trachea to the bronchioles.",
                markScheme: "Bronchus / bronchi; (1 mark)",
                hint: "The windpipe splits into two of these main tubes (one entering each lung) before branching into smaller bronchioles.",
                isOfficial: false
            },
            {
                section: "Pathway of air",
                marks: 1,
                question: "Describe the pathway of air from the bronchioles to the site of gaseous exchange.",
                markScheme: "Air travels from the bronchioles directly into the alveoli; (1 mark)",
                hint: "What are the tiny air sacs at the very end of the respiratory pathway called?",
                isOfficial: false
            },

            // 2. Gaseous exchange at the alveoli (5 Questions)
            {
                section: "Gaseous exchange at the alveoli",
                marks: 4,
                question: "State and explain two characteristics of alveoli that assist gaseous exchange.",
                markScheme: "<em>1 mark for each characteristic stated.<br>1 mark for each explanation.</em><ul><li><strong>characteristic:</strong> one-cell thick;<br><strong>explanation:</strong> small distance for oxygen / carbon dioxide / gases to pass through faster;</li><li><strong>characteristic:</strong> surrounded by capillaries / blood supply;<br><strong>explanation:</strong> this increases the amount of blood available for the transfer of gases / maintains concentration gradient;</li><li><strong>characteristic:</strong> large surface area / large number of alveoli;<br><strong>explanation:</strong> large area for gas exchange / diffusion to take place at / more gases can pass through;</li><li><strong>characteristic:</strong> walls of alveoli are moist;<br><strong>explanation:</strong> gases dissolve to pass through;</li><li><strong>characteristic:</strong> the walls of alveoli contain elastic fibres;<br><strong>explanation:</strong> which allows the walls to increase surface area slightly during inspiration;</li></ul>",
                hint: "Pick any two of the 5 classic features: 1. One-cell thick walls, 2. Surrounded by capillaries, 3. Large surface area (millions of alveoli), 4. Moist walls, 5. Elastic fibres.",
                isOfficial: true
            },
            {
                section: "Gaseous exchange at the alveoli",
                marks: 2,
                question: "Gaseous exchange takes place at the alveoli. Describe what is meant by gaseous exchange at the alveoli.",
                markScheme: "<em>2 marks for:</em><ul><li>oxygen delivered to the blood;</li><li>carbon dioxide removed from the blood;</li></ul>",
                hint: "What gas diffuses from the alveoli into the blood, and what waste gas diffuses from the blood into the alveoli?",
                isOfficial: true
            },
            {
                section: "Gaseous exchange at the alveoli",
                marks: 2,
                question: "Suggest the benefits for a performer of efficient gaseous exchange.",
                markScheme: "<em>Any 2 for 2 marks:</em><ul><li>speeds the removal of carbon dioxide;</li><li>speeds the transfer of oxygen to muscles;</li><li>delays the onset of lactic acid;</li><li>speeds the removal of lactic acid;</li><li>speeds the body's return to its natural state;</li><li>allows a performer to maintain effort for longer;</li><li>able to participate in endurance activities;</li></ul>",
                hint: "If your lungs are great at getting oxygen into the blood and CO2 out, how does that help your muscles during an endurance race?",
                isOfficial: true
            },
            {
                section: "Gaseous exchange at the alveoli",
                marks: 2,
                question: "Muscles need a good supply of oxygen. Explain how the following characteristics of the alveoli assist gaseous exchange:<br>1. Large surface area<br>2. Walls with a thickness of one cell",
                markScheme: "<em>1 mark for each explanation.</em><ul><li><strong>(large surface area)</strong> lots of oxygen / carbon dioxide can diffuse at the same time;</li><li><strong>(walls with a thickness of one cell)</strong> less distance so diffusion of oxygen and carbon dioxide through alveoli wall is faster;</li></ul><em>Accept alternative wording.</em>",
                hint: "Why does having millions of alveoli (large area) and ultra-thin walls speed up diffusion?",
                isOfficial: true
            },
            {
                section: "Gaseous exchange at the alveoli",
                marks: 2,
                question: "Explain how moist walls and elastic fibres in the alveoli assist gaseous exchange.",
                markScheme: "<ul><li><strong>Moist walls (1 mark):</strong> Gases (oxygen and carbon dioxide) dissolve in the moisture so they can diffuse across the walls more easily.</li><li><strong>Elastic fibres (1 mark):</strong> Allow the alveoli walls to stretch and expand to increase surface area slightly during inspiration (and recoil during expiration).</li></ul>",
                hint: "What does the thin film of water on the alveoli walls do to gases, and why do the air sacs need to be stretchy?",
                isOfficial: false
            },

            // 3. Mechanics of breathing (7 Questions)
            {
                section: "Mechanics of breathing",
                marks: 2,
                question: "Describe the function of the intercostal muscles in normal breathing.",
                markScheme: "<em>2 marks for:</em><ul><li>contract to expand the chest cavity / move the ribs up and out during inspiration;</li><li>relax to reduce the chest cavity / allow the ribs to move downwards and inwards during expiration;</li></ul><em>Accept correct ref. to specific types of intercostal muscles.</em>",
                hint: "Think about what happens to your rib cage when you breathe in (inspiration) and breathe out (expiration).",
                isOfficial: true
            },
            {
                section: "Mechanics of breathing",
                marks: 4,
                question: "Describe the role of the diaphragm during normal breathing.",
                markScheme: "<em>1 mark for each description.<br>Any 4 of:</em><ul><li>it contracts / becomes flatter / moves downwards during inspiration / breathing in;</li><li>causes the chest volume to increase;</li><li>causes the air pressure in the chest to decrease;</li><li>it relaxes / returns to dome shape during expiration / breathing out;</li><li>causes the chest volume to reduce;</li><li>causes the air pressure in the chest to increase;</li></ul>",
                hint: "Cover both inspiration (contracts/flattens -> volume up -> pressure down) and expiration (relaxes/domes -> volume down -> pressure up).",
                isOfficial: true
            },
            {
                section: "Mechanics of breathing",
                marks: 2,
                question: "Complete the sentences to describe changes to the lungs during inhalation and exhalation:<br><br>The volume of air in the lungs ________________ during inhalation.<br>The pressure of air in the lungs ________________ causing exhalation.",
                markScheme: "<em>1 mark for each correctly completed sentence.</em><ul><li>The volume of air in the lungs <strong>increases;</strong> during inhalation.</li><li>The pressure of air in the lungs <strong>increases;</strong> causing exhalation.</li></ul>",
                hint: "When you breathe in, what happens to the amount (volume) of air? To push air out, what has to happen to the pressure inside?",
                isOfficial: true
            },
            {
                section: "Mechanics of breathing",
                marks: 5,
                question: "Describe the mechanics of breathing during inspiration and expiration at rest.",
                markScheme: "<em>1 mark for each description (3 marks max from either inspiration or expiration, 5 marks max in total):</em><br><br><strong>inspiration:</strong><ul><li>diaphragm contracts / becomes flatter;</li><li>intercostal muscles contract;</li><li>rib cage moves outward / upward;</li><li>causes the chest volume to increase;</li><li>causes the air pressure in the chest to decrease (below atmospheric air);</li></ul><strong>expiration:</strong><ul><li>diaphragm relaxes / domes upwards;</li><li>rib cage moves inwards / downwards;</li><li>intercostal muscles relax;</li><li>chest volume reduces;</li><li>causes air pressure in the chest to increase;</li></ul>",
                hint: "Note the mark scheme rule: you can get a maximum of 3 marks for inspiration and 3 marks for expiration (up to 5 total), so make sure you write almeno 3 points for each!",
                isOfficial: true
            },
            {
                section: "Mechanics of breathing",
                marks: 4,
                question: "Complete the descriptions to state how the ribs and diaphragm move during inhalation and exhalation during normal breathing:<br>1. Ribs during inhalation<br>2. Ribs during exhalation<br>3. Diaphragm during inhalation<br>4. Diaphragm during exhalation",
                markScheme: "<em>1 mark for each correct response:</em><ul><li><strong>1. Ribs (inhalation):</strong> moves outwards <strong>AND</strong> upwards;</li><li><strong>2. Ribs (exhalation):</strong> moves inwards <strong>AND</strong> downwards;</li><li><strong>3. Diaphragm (inhalation):</strong> contracts <strong>AND</strong> becomes flatter (moves down);</li><li><strong>4. Diaphragm (exhalation):</strong> relaxes <strong>AND</strong> domes / moves upwards;</li></ul>",
                hint: "Notice the 'AND' in the mark scheme! For ribs, give both directions (upwards AND outwards / downwards AND inwards). For diaphragm, state contracts/relaxes AND shape change (flattens/domes).",
                isOfficial: true
            },
            {
                section: "Mechanics of breathing",
                marks: 3,
                question: "Explain the action of the intercostal muscles and the diaphragm during expiration (breathing out) at rest.",
                markScheme: "<ul><li>Intercostal muscles relax to allow the rib cage to move downwards and inwards. (1 mark)</li><li>The diaphragm relaxes and domes upwards. (1 mark)</li><li>This decreases the chest cavity volume, increasing air pressure in the lungs to force air out. (1 mark)</li></ul>",
                hint: "What do the ribs and diaphragm do to make the chest cavity smaller and push air out?",
                isOfficial: false
            },
            {
                section: "Mechanics of breathing",
                marks: 1,
                question: "State the effect of the diaphragm contracting on the air pressure in the lungs.",
                markScheme: "It reduces / decreases the air pressure in the lungs (below atmospheric pressure, causing air to rush in). (1 mark)",
                hint: "When the chest cavity volume gets bigger, what happens to the air pressure inside?",
                isOfficial: false
            },

            // 4. Breathing volumes and minute ventilation (8 Questions)
            {
                section: "Breathing volumes and minute ventilation",
                marks: 2,
                question: "Describe what is meant by the term tidal volume and state how this changes during exercise.",
                markScheme: "<em>1 mark for the description.<br>1 mark for the change during exercise.</em><ul><li><strong>description of tidal volume:</strong> the volume / amount of air entering or leaving with each breath;</li><li><strong>change during exercise:</strong> increases;</li></ul>",
                hint: "Think of the ocean 'tide' going in and out with each breath. Does the depth of each breath get bigger or smaller when you exercise?",
                isOfficial: true
            },
            {
                section: "Breathing volumes and minute ventilation",
                marks: 3,
                question: "Minute ventilation increases during exercise. Define the term minute ventilation and describe two benefits of an increased minute ventilation during exercise.",
                markScheme: "<em>1 mark for the definition.<br>1 mark for each benefit (2 marks max.).</em><br><br><strong>definition:</strong><ul><li>the volume of air that you breathe per minute;</li></ul><strong>benefit (Any 2 of):</strong><ul><li>increase in the volume of oxygen into the body;</li><li>increases the volume of carbon dioxide removed from the body;</li><li>increases oxygen supply to muscles / keep going for longer;</li><li>increases the efficiency of diffusion of oxygen through the alveoli / capillaries;</li><li>reduces the onset of lactic acid / speeds up removal of lactic acid;</li></ul>",
                hint: "What does minute ventilation measure in 60 seconds, and why does breathing more air per minute help working muscles?",
                isOfficial: true
            },
            {
                section: "Breathing volumes and minute ventilation",
                marks: 2,
                question: "Identify two breathing volumes that do not increase during exercise.",
                markScheme: "<em>2 marks for:</em><ul><li>residual volume;</li><li>vital capacity;</li></ul>",
                hint: "Which volume measures the maximum you can forcibly breathe out after a deep breath, and which is the air left in the lungs that you can never breathe out?",
                isOfficial: true
            },
            {
                section: "Breathing volumes and minute ventilation",
                marks: 6,
                question: "Describe each of the following breathing volumes and state the effect of exercise on each of them:<br>1. Tidal volume<br>2. Vital capacity<br>3. Residual volume",
                markScheme: "<em>1 mark for each breathing volume description.<br>1 mark for each effect of exercise.</em><ul><li><strong>(tidal volume)</strong> the volume / amount of air entering or leaving the lungs with each breath;<br><strong>(effect of exercise)</strong> increase;</li><li><strong>(vital capacity)</strong> the maximum volume / amount of air that can be breathed out after breathing in as deeply as you can;<br><strong>(effect of exercise)</strong> no change;</li><li><strong>(residual volume)</strong> the amount of air left in the lungs after breathing out as hard as possible;<br><strong>(effect of exercise)</strong> no change;</li></ul>",
                hint: "Only ONE of these three volumes increases during exercise—the other two stay the same (no change)!",
                isOfficial: true
            },
            {
                section: "Breathing volumes and minute ventilation",
                marks: 2,
                question: "Minute ventilation is a measure of the efficiency of the respiratory system. Identify the two components used to calculate minute ventilation and state their units of measurement.",
                markScheme: "<em>1 mark for each factor with an appropriate unit of measurement.</em><ul><li><strong>tidal volume</strong> measured in millilitres / litres;</li><li><strong>number of breaths (breathing rate)</strong> measured per minute (breaths per minute);</li></ul>",
                hint: "Minute Ventilation = T____ V_____ (in litres or ml) × B________ R___ (in breaths per minute).",
                isOfficial: true
            },
            {

                section: "Cardiac output",
                marks: 2,
                question: "Describe the long-term effects of regular exercise on resting pulse rate and stroke volume.",
                markScheme: "<em>2 from:</em><ul><li><strong>resting pulse rate:</strong> reduces / decreases (bradycardia) / returns to resting heart rate more quickly; (1 mark)</li><li><strong>stroke volume:</strong> increases / the amount of blood pumped from the ventricle per beat increases; (1 mark)</li></ul>",
                hint: "Over months of endurance training, does resting pulse rate go up or down? Does stroke volume go up or down?",
                isOfficial: true
            }
        ];

        // Conversational reflection prompts
        const reflectionPrompts = [
            "How did you do? Be honest with yourself—how many marks out of the total would you give your answer?",
            "Did anything in the mark scheme surprise you?",
            "If you dropped any marks here, what's your plan to make sure you nail it next time?",
            "Did you use the exact terminology? Often, close isn't quite enough in the exam.",
            "How could you have improved your answer to guarantee full marks?",
            "What was the trickiest part of this question for you?",
            "Which part of the mark scheme did you completely forget to include?",
            "How did you do? Are you confident to move on, or do you need to revisit this topic?"
        ];

        let currentQuestion = null;
        let recentQuestions = []; // Anti-repeat session tracker
        let bypassActive = false;

        // DOM Elements
        const sectionSelect = document.getElementById('section-select');
        const btnRandom = document.getElementById('btn-random');
        const questionContainer = document.getElementById('question-container');
        const displayQuestion = document.getElementById('display-question');
        const displayMarks = document.getElementById('display-marks');
        const userAnswer = document.getElementById('user-answer');
        const btnReveal = document.getElementById('btn-reveal');
        const btnHint = document.getElementById('btn-hint');
        const hintBox = document.getElementById('hint-box');
        const displayHint = document.getElementById('display-hint');
        const markSchemeContainer = document.getElementById('mark-scheme-container');
        const displayMarkScheme = document.getElementById('display-mark-scheme');
        const displayReflection = document.getElementById('display-reflection');
        const btnNext = document.getElementById('btn-next');
        
        // Traffic Light Elements
        const trafficBanner = document.getElementById('traffic-light-banner');
        const trafficDot = document.getElementById('traffic-light-dot');
        const trafficText = document.getElementById('traffic-light-text');

        // Modal Elements
        const customModal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalBtnPrimary = document.getElementById('modal-btn-primary');
        const modalBtnSecondary = document.getElementById('modal-btn-secondary');

        // Functions
        function showModal(title, message, primaryText, secondaryText, onPrimaryClick, onSecondaryClick) {
            modalTitle.textContent = title;
            modalMessage.innerHTML = message;
            
            modalBtnPrimary.textContent = primaryText;
            modalBtnPrimary.onclick = () => {
                hideModal();
                if (onPrimaryClick) onPrimaryClick();
            };
            
            if (secondaryText) {
                modalBtnSecondary.textContent = secondaryText;
                modalBtnSecondary.classList.remove('hidden');
                modalBtnSecondary.onclick = () => {
                    hideModal();
                    if (onSecondaryClick) onSecondaryClick();
                };
            } else {
                modalBtnSecondary.classList.add('hidden');
            }
            
            customModal.classList.remove('hidden');
        }
        
        function hideModal() {
            customModal.classList.add('hidden');
        }

        function loadQuestion() {
            const selectedSection = sectionSelect.value;
            let filteredQuestions = questions;
            
            if (selectedSection !== 'all') {
                filteredQuestions = questions.filter(q => q.section === selectedSection);
            }
            
            if (filteredQuestions.length === 0) {
                showModal("Oops!", "No questions found for this section.", "OK");
                return;
            }

            // Filter out recently asked questions to avoid immediate repeats
            let availableQuestions = filteredQuestions.filter(q => !recentQuestions.includes(q));
            
            // If all questions in this category have been shown recently, reset history
            if (availableQuestions.length === 0) {
                recentQuestions = [];
                availableQuestions = filteredQuestions;
            }

            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            currentQuestion = availableQuestions[randomIndex];

            // Track recent questions (store up to 4 recent picks)
            recentQuestions.push(currentQuestion);
            if (recentQuestions.length > 4) {
                recentQuestions.shift();
            }

            // Setup Traffic Light UI
            trafficBanner.classList.remove('bg-green-100', 'border-green-300', 'bg-amber-100', 'border-amber-300');
            trafficDot.classList.remove('bg-green-500', 'bg-amber-500');
            
            if (currentQuestion.isOfficial) {
                trafficBanner.classList.add('bg-green-100', 'border-green-300');
                trafficDot.classList.add('bg-green-500');
                trafficText.innerHTML = "Official Cambridge Mark Scheme. Highly reliable.";
            } else {
                trafficBanner.classList.add('bg-amber-100', 'border-amber-300');
                trafficDot.classList.add('bg-amber-500');
                trafficText.innerHTML = "Syllabus-aligned but AI-generated. Be extra sceptical at times—always check against course material and ask each other and Coach Jamie if you have doubts.";
            }

            // Reset UI
            displayQuestion.innerHTML = currentQuestion.question;
            displayMarks.textContent = `[${currentQuestion.marks} mark${currentQuestion.marks > 1 ? 's' : ''}]`;
            userAnswer.value = '';
            userAnswer.disabled = false;
            questionContainer.classList.remove('hidden');
            markSchemeContainer.classList.add('hidden');
            hintBox.classList.add('hidden');
            bypassActive = false;
        }

        function revealMarkScheme() {
            const answer = userAnswer.value.trim();
            
            // Check for empty box
            if (answer === '') {
                showModal(
                    "Hold up!", 
                    "Oh no you don't! You have to write <em>something</em> before I show you the answer.<br><br>If that something is 'I don't know', that's fine, but take note: this is obviously an area you need to revisit again later.", 
                    "Try again"
                );
                return;
            }

            // Check for "I don't know" variants
            const idkVariants = ["i don't know", "idk", "i dunno", "no idea", "pass"];
            const isIdk = idkVariants.some(variant => answer.toLowerCase().includes(variant));
            
            if (isIdk) {
                processReveal();
                return;
            }

            // Word count validation (scales reasonably with question marks)
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = currentQuestion.markScheme;
            const markSchemeText = tempDiv.textContent || tempDiv.innerText || "";
            
            const msWordCount = markSchemeText.split(/\s+/).filter(word => word.length > 0).length;
            const answerWordCount = answer.split(/\s+/).filter(word => word.length > 0).length;
            const expectedMinWords = Math.min(currentQuestion.marks * 6, msWordCount * 0.4);

            if (!bypassActive && (answerWordCount < expectedMinWords)) {
                showModal(
                    "Are you sure?", 
                    "Your answer looks a bit brief compared to what the examiner is looking for. <br><br>Have you given it your best shot?", 
                    "Sorry Coach, that's all I've got. Show me the mark scheme; I'll be honest with myself and come back better!", 
                    "Let me back in Coach, I've got more to say",
                    () => {
                        bypassActive = true;
                        processReveal();
                    },
                    () => {
                        userAnswer.focus();
                    }
                );
                return;
            }

            processReveal();
        }

        function processReveal() {
            displayMarkScheme.innerHTML = currentQuestion.markScheme;
            
            // Generate Random Reflection Prompt
            const randomPrompt = reflectionPrompts[Math.floor(Math.random() * reflectionPrompts.length)];
            displayReflection.textContent = randomPrompt;

            userAnswer.disabled = true;
            markSchemeContainer.classList.remove('hidden');
            
            // Scroll to mark scheme smoothly
            markSchemeContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Event Listeners
        btnRandom.addEventListener('click', loadQuestion);
        
        btnHint.addEventListener('click', () => {
            if (currentQuestion && currentQuestion.hint) {
                displayHint.textContent = currentQuestion.hint;
                hintBox.classList.remove('hidden');
            }
        });

        btnReveal.addEventListener('click', revealMarkScheme);
        btnNext.addEventListener('click', loadQuestion);

        // Close modal if clicking outside the box
        customModal.addEventListener('click', (e) => {
            if (e.target === customModal) {
                hideModal();
            }
        });

    </script>
</body>
</html>
