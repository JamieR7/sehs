<body class="min-h-screen flex flex-col items-center py-10 px-4">

                <button id="modal-btn-primary" class="btn-blue px-6 py-2 rounded-md font-bold shadow-sm text-sm"></button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            // ==========================================
            // 1. Principles of force (12 Questions: 6 Official + 6 Generated)
            // ==========================================
            {
                section: "Principles of force",
                marks: 3,
                question: "State what is meant by each of the following terms:<br>• Force<br>• Mass<br>• Acceleration",
                markScheme: "<em>1 mark per term:</em><br><br><strong>force:</strong><ul><li>a pull or a push action (applied upon an object);<br><em>(Accept force = mass &times; acceleration.)</em></li></ul><strong>mass:</strong><ul><li>the quantity / amount of matter in a body / idea of how much matter;</li></ul><strong>acceleration:</strong><ul><li>the rate at which an object changes speed / time taken to change speed / velocity;</li></ul><em>Accept F = m &times; a or a correct re-arrangement of this equation for 1 mark.</em>",
                hint: "Think of pushing/pulling an object (Force), how much 'stuff'/matter is in it in kg (Mass), and how quickly its speed changes (Acceleration).",
                isOfficial: true
            },
            {
                section: "Principles of force",
                marks: 1,
                question: "State what is meant by the term force.",
                markScheme: "<em>Any 1 of:</em><ul><li>a push / a pull / pushing / pulling action (applied upon an object);</li><li>= mass &times; acceleration / m &times; a;</li></ul>",
                hint: "Keep it simple: it is either a p____ or a p____ applied to an object (or state the 3-letter formula!).",
                isOfficial: true
            },
            {
                section: "Principles of force",
                marks: 2,
                question: "State how force can be calculated.",
                markScheme: "<em>1 mark for stating two parts of: mass <strong>OR</strong> acceleration <strong>OR</strong> multiplying / times by / product of;<br>2 marks for all parts, i.e.</em><ul><li>(force =) <strong>mass &times; acceleration</strong> <strong>OR</strong> mass multiplied / times by acceleration;</li></ul>",
                hint: "Remember Newton's famous second law formula: F = m × a.",
                isOfficial: true
            },
            {
                section: "Principles of force",
                marks: 4,
                question: "When a performer hits the ball during a squash match, a force is applied. Define the two named concepts used to calculate force.",
                markScheme: "<em>1 mark for each concept identified.<br>1 mark for an appropriate definition.</em><br><ul><li><strong>concept:</strong> mass;<br><strong>definition:</strong> the quantity of matter in a body regardless of its volume or of any forces acting on it (measured in kilogram or kg) / the amount of material of which it is made;</li><li><strong>concept:</strong> acceleration;<br><strong>definition:</strong> the rate at which an object changes speed (measured in metres per second per second (m/s&sup2;)) / the rate of change of velocity;</li></ul>",
                hint: "First name the two variables from the Force equation (m___ and a___________), then define what each one means!",
                isOfficial: true
            },
            {
                section: "Principles of force",
                marks: 2,
                question: "Force can be applied through a push or pull. Use a named physical activity to describe an example of each of the following:<br>• Example of a push force being used<br>• Example of a pull force being used",
                markScheme: "<em>1 mark for each example.</em><br><br>for example in rugby:<ul><li><strong>(push)</strong> pushing opponent in the scrum;</li><li><strong>(pull)</strong> grabbing the opponent's shirt when making a tackle to pull them back;</li></ul>",
                hint: "Pick a sport like Rugby, Rowing, or Weight Training where you clearly push something away and pull something towards you.",
                isOfficial: true
            },
            {
                section: "Principles of force",
                marks: 2,
                question: "Describe the relationship between acceleration, force and mass during physical activity.",
                markScheme: "<em>2 marks from:</em><ul><li>force is equal to mass multiplied by acceleration;</li><li>greater the force, the greater the acceleration;</li><li>bigger the mass, the more force needed to accelerate it;</li><li>mass generally stays the same;</li></ul>",
                hint: "If mass stays the same and you apply MORE force, what happens to acceleration? If an object has a LARGER mass (like a heavy shot put), what is needed to accelerate it?",
                isOfficial: true
            },
            {
                section: "Principles of force",
                marks: 2,
                question: "Explain how increases and decreases in force can cause acceleration and deceleration in a 100-metre sprint.",
                markScheme: "<ul><li><strong>Acceleration (1 mark):</strong> An increase in muscular force applied against the blocks/track (greater than air resistance) causes the sprinter to accelerate (increase speed) in the direction of the force.</li><li><strong>Deceleration (1 mark):</strong> After crossing the finish line, decreasing forward muscular drive while applying a braking force against the ground (alongside air resistance) causes the sprinter to decelerate (slow down).</li></ul>",
                hint: "Link an increase in forward force to speeding up (acceleration) and a decrease in forward force / braking force to slowing down (deceleration).",
                isOfficial: false
            },
            {
                section: "Principles of force",
                marks: 2,
                question: "A sprinter with a mass of 70 kg accelerates out of the starting blocks at 5 m/s². Calculate the force produced by the sprinter. Include the unit in your answer.",
                markScheme: "<ul><li><strong>Calculation (1 mark):</strong> Force = 70 &times; 5 = <strong>350</strong>;</li><li><strong>Unit (1 mark):</strong> <strong>Newtons (N)</strong> (accept 350 N).</li></ul>",
                hint: "Use Force = mass × acceleration. Don't forget the unit of force named after Sir Isaac Newton!",
                isOfficial: false
            },
            {
                section: "Principles of force",
                marks: 2,
                question: "An athlete throws a men's shot put (mass = 7.26 kg) and a women's shot put (mass = 4 kg) using the exact same amount of muscular force. Explain which shot put will accelerate faster and why.",
                markScheme: "<ul><li>The <strong>4 kg (women's) shot put</strong> will accelerate faster. (1 mark)</li><li>Because Force = mass &times; acceleration, when the same force is applied to a smaller mass, it produces a greater acceleration (a bigger mass requires more force to accelerate it). (1 mark)</li></ul>",
                hint: "If Force is identical, does a lighter mass or a heavier mass accelerate more easily?",
                isOfficial: false
            },
            {
                section: "Principles of force",
                marks: 2,
                question: "A hockey player wants to pass the ball to a teammate on the far side of the pitch rather than a teammate standing nearby. Using the principles of force, explain what the player must do differently.",
                markScheme: "<ul><li>The mass of the hockey ball stays the same. (1 mark)</li><li>Since Force = mass &times; acceleration, the player must apply a <strong>greater muscular force</strong> with their stick to produce greater acceleration so the ball travels further and faster. (1 mark)</li></ul>",
                hint: "The ball's mass doesn't change! So how does the player use F = m × a to make the ball accelerate faster?",
                isOfficial: false
            },
            {
                section: "Principles of force",
                marks: 2,
                question: "Explain how a football goalkeeper uses force to decelerate a fast-moving ball when making a catch.",
                markScheme: "<ul><li>The goalkeeper applies a pushing/resisting muscular force with their hands and arms in the <strong>opposite direction</strong> to the ball's flight. (1 mark)</li><li>This opposing force rapidly reduces the ball's speed, causing it to decelerate to a stop. (1 mark)</li></ul>",
                hint: "In which direction must the goalkeeper apply force with their hands to slow the oncoming ball down to zero?",
                isOfficial: false
            },
            {
                section: "Principles of force",
                marks: 2,
                question: "Two rugby players are sprinting at the same rate of acceleration, but Player A has a mass of 105 kg and Player B has a mass of 80 kg. Explain which player generates greater force on impact in a tackle.",
                markScheme: "<ul><li><strong>Player A (105 kg)</strong> generates greater force. (1 mark)</li><li>Because Force = mass &times; acceleration, having a bigger mass at the same acceleration results in a larger total force. (1 mark)</li></ul>",
                hint: "Plug the numbers into Force = mass × acceleration: if acceleration is equal, who hits harder?",
                isOfficial: false
            },

            // ==========================================
            // 2. Applications of force (16 Questions: 8 Official + 8 Generated)
            // ==========================================
            {
                section: "Applications of force",

                question: "Explain how two named forces act on an athlete during a long jump event.",

            },
            {
                section: "Applications of force",
                marks: 4,
                question: "A performer kicks a ball. Name two forces and explain how each force acts on the ball when it is in the air.",
                markScheme: "<em>1 mark for each force named. (Max. 2 marks).<br>1 mark for each explanation. (Max. 2 marks).</em><br><ul><li><strong>gravity / weight;</strong><br><strong>explanation:</strong> pulls the ball downwards / towards the ground;</li><li><strong>air resistance / drag;</strong><br><strong>explanation:</strong> the air will slow the ball down / acts in direct opposition to the ball's movement / increases as speed increases / increases if surface of ball is not smooth;</li><li><strong>force applied at release / muscular force;</strong><br>the power generated when kicking the ball / is greater than gravitational pull / the harder the ball is kicked the greater the force;</li></ul><em>Accept alternative wording.</em>",
                hint: "Look at the syllabus bullet for 'an object flying through the air': 1. Force applied at release, 2. Air resistance, 3. Gravity.",
                isOfficial: true
            },
            {
                section: "Applications of force",
                marks: 2,
                question: "A badminton player hits a shuttlecock. Explain how two forces act on the shuttlecock when it is moving through the air.",
                markScheme: "<em>2 from:</em><br><br><strong>air resistance / drag:</strong><ul><li><strong>explanation:</strong> the air in the way of the shuttle is pushed out of the way / the air will slow the movement of the shuttle down;</li><li>acts in direct opposition to the shuttle;</li><li>as the surface of the shuttle is not totally smooth there is greater resistance or drag as the shuttle travels through the air;</li></ul><strong>gravity / weight:</strong><ul><li><strong>explanation:</strong> pulls the shuttle towards the ground;</li><li>the effect of the force applied on the shuttle reduces so gravity overcomes the force and increases the downward pull;</li></ul><strong>force applied at release / muscular force:</strong><ul><li><strong>explanation:</strong> the power generated when hitting the shuttle is greater than gravitational pull and air resistance which allows the shuttle to go into the air;</li><li>applied at the point of hitting principally by the deltoid, pectorals and latissimus dorsi;</li></ul>",
                hint: "Why does a feathered shuttlecock slow down so quickly in flight (Air resistance) and then drop to the court (Gravity)?",
                isOfficial: true
            },
            {
                section: "Applications of force",
                marks: 4,
                question: "Explain how two named forces act on a diver during their dive from a diving board.",
                markScheme: "<em>max 2 marks for naming an appropriate force<br>max 2 marks for each explanation linked to an appropriate force</em><br><ul><li><strong>gravity / weight;</strong><br>when the performer reaches the top of their jump from the board gravity will pull the body towards the ground / pool;</li><li><strong>air resistance / drag / friction;</strong><br>as the diver moves through the air there is an amount of resistance against the diver's body / the straighter the body position the easier air will flow over the body;</li><li><strong>muscular force;</strong><br>physical effort of the diver to push upward from the board;</li></ul>",
                hint: "Name two forces (e.g. Muscular force at take-off, Gravity pulling them down to the water, or Air resistance during flight) and explain their role in the dive.",
                isOfficial: true
            },
            {
                section: "Applications of force",
                marks: 6,
                question: "Explain the effect of three named forces acting on a cyclist travelling at speed in a road race.",
                markScheme: "<em>1 mark for each named force. (3 marks max.) 1 mark for each explanation of the effect of each force. (3 marks max.)</em><br><ul><li><strong>air resistance;</strong><br>acts to reduce the speed of the cyclist as the faster they go the greater the resistance / works against the direction of the cyclist / slows the cyclist down;</li><li><strong>gravity;</strong><br>pulls the bike towards the ground / if the cyclist leans too far over when cornering the centre of gravity changes and can result in falling;</li><li><strong>friction;</strong><br>makes the bike stick to the road / cyclist uses smooth tyres to reduce the effect of friction / brakes rub against the wheel when applied to slow the bike / opposes the forward motion;</li><li><strong>muscular force;</strong><br>the power exerted on the pedals by the cyclist allows the cyclist to increase / maintain speed;</li></ul><em>Accept forces with appropriate explanations.</em>",
                hint: "You need 3 named forces (3 marks) + 3 explanations applied specifically to cycling (3 marks).",
                isOfficial: true
            },
            {
                section: "Applications of force",
                marks: 6,
                question: "Identify three forces acting on a golf ball as it is hit and moves through the air. Explain how each force affects the flight of the ball.",
                markScheme: "<em>1 mark for identification of each force. 1 mark for each appropriate explanation, for example:</em><br><ul><li><strong>gravity;</strong><br>pulls the ball back down towards the ground;</li><li><strong>air resistance;</strong><br>slows the ball down / reduces distance the ball travels;</li><li><strong>force applied at release / muscular force;</strong><br>the greater the force applied the further the ball will travel / speeds the ball up;</li></ul><em>Accept other relevant forces.</em>",
                hint: "Use the exact three forces from the syllabus for an object flying through the air: Force applied at release, Air resistance, and Gravity.",
                isOfficial: true
            },
            {
                section: "Applications of force",
                marks: 6,
                question: "Identify three different forces acting on a 100-metre sprinter at the start of a race. Explain how each force affects the sprinter.",
                markScheme: "<em>1 mark for each force (3 marks max).<br>1 mark for explaining an appropriate effect of the force (3 marks max).</em><br><ul><li><strong>gravity;</strong><br><strong>effect:</strong> pulls the sprinter towards the ground as they drive out of the blocks / forces the sprinter's feet to return to the ground;</li><li><strong>muscular force;</strong><br><strong>effect:</strong> the power the sprinter exerts to push himself out of the blocks quicker / continues to be applied through to the ground;</li><li><strong>air resistance;</strong><br><strong>effect:</strong> the faster the sprinter accelerates there is greater air resistance which will slow the sprinter down / acts in opposite direction to motion to slow them down / acts against the runner to slow them down;</li><li><strong>ground reaction force;</strong><br><strong>effect:</strong> the force from the ground to the sprinter that is equal and opposite to the action force / the harder the sprinter pushes the force downwards and backwards helps to move the sprinter upwards and forwards;</li></ul>",
                hint: "This 6-mark question appeared in both 2023 and 2025! Pick 3 from Gravity, Air resistance, Muscular force, and Ground reaction force.",
                isOfficial: true
            },

                hint: "Think about what a track or time-trial cyclist does with their body posture, clothing, helmet, and bike frame to slice through the air.",
                isOfficial: true
            },
            {
                section: "Applications of force",
                marks: 3,
                question: "Identify three forces that act on a javelin during the throw and flight.",
                markScheme: "<em>1 mark for each force identified.</em><ul><li>muscular force / force applied at release;</li><li>air resistance;</li><li>gravity;</li></ul><em>Accept other appropriate forces.</em>",

        // Conversational reflection prompts

            "Did anything in the mark scheme surprise you?",

            "Did you use the exact terminology? Often, close isn't quite enough in the exam.",
            "How could you have improved your answer to guarantee full marks?",

        ];

        let recentQuestions = []; // Anti-repeat session tracker
        let bypassActive = false;

        const btnRandom = document.getElementById('btn-random');
        const questionContainer = document.getElementById('question-container');

        const btnNext = document.getElementById('btn-next');
        
        // Traffic Light Elements

        const trafficDot = document.getElementById('traffic-light-dot');
        const trafficText = document.getElementById('traffic-light-text');

        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalBtnPrimary = document.getElementById('modal-btn-primary');
        const modalBtnSecondary = document.getElementById('modal-btn-secondary');

        // Functions
        function showModal(title, message, primaryText, secondaryText, onPrimaryClick, onSecondaryClick) {
            modalTitle.textContent = title;
            modalMessage.innerHTML = message;
            
            modalBtnPrimary.textContent = primaryText;
            modalBtnPrimary.onclick = () => {
                hideModal();
                if (onPrimaryClick) onPrimaryClick();
            };
            
            if (secondaryText) {
                modalBtnSecondary.textContent = secondaryText;
                modalBtnSecondary.classList.remove('hidden');
                modalBtnSecondary.onclick = () => {
                    hideModal();
                    if (onSecondaryClick) onSecondaryClick();
                };
            } else {
                modalBtnSecondary.classList.add('hidden');
            }
            
            customModal.classList.remove('hidden');
        }
        
        function hideModal() {
            customModal.classList.add('hidden');
        }

        function loadQuestion() {
            const selectedSection = sectionSelect.value;
            let filteredQuestions = questions;
            
            if (selectedSection !== 'all') {
                filteredQuestions = questions.filter(q => q.section === selectedSection);
            }
            
            if (filteredQuestions.length === 0) {
                showModal("Oops!", "No questions found for this section.", "OK");
                return;
            }

            // Filter out recently asked questions to avoid immediate repeats
            let availableQuestions = filteredQuestions.filter(q => !recentQuestions.includes(q));
            
            // If all questions in this category have been shown recently, reset history
            if (availableQuestions.length === 0) {
                recentQuestions = [];
                availableQuestions = filteredQuestions;
            }

            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            currentQuestion = availableQuestions[randomIndex];

            // Track recent questions (store up to 4 recent picks)
            recentQuestions.push(currentQuestion);
            if (recentQuestions.length > 4) {
                recentQuestions.shift();
            }

            // Setup Traffic Light UI
            trafficBanner.classList.remove('bg-green-100', 'border-green-300', 'bg-amber-100', 'border-amber-300');
            trafficDot.classList.remove('bg-green-500', 'bg-amber-500');
            
            if (currentQuestion.isOfficial) {
                trafficBanner.classList.add('bg-green-100', 'border-green-300');
                trafficDot.classList.add('bg-green-500');
                trafficText.innerHTML = "Official Cambridge Mark Scheme. Highly reliable.";
            } else {
                trafficBanner.classList.add('bg-amber-100', 'border-amber-300');
                trafficDot.classList.add('bg-amber-500');
                trafficText.innerHTML = "Syllabus-aligned but AI-generated. Be extra sceptical at times—always check against course material and ask each other and Coach Jamie if you have doubts.";
            }

            // Reset UI
            displayQuestion.innerHTML = currentQuestion.question;
            displayMarks.textContent = `[${currentQuestion.marks} mark${currentQuestion.marks > 1 ? 's' : ''}]`;
            userAnswer.value = '';
            userAnswer.disabled = false;
            questionContainer.classList.remove('hidden');
            markSchemeContainer.classList.add('hidden');
            hintBox.classList.add('hidden');
            bypassActive = false;
        }

        function revealMarkScheme() {
            const answer = userAnswer.value.trim();
            
            // Check for empty box
            if (answer === '') {
                showModal(
                    "Hold up!", 
                    "Oh no you don't! You have to write <em>something</em> before I show you the answer.<br><br>If that something is 'I don't know', that's fine, but take note: this is obviously an area you need to revisit again later.", 
                    "Try again"
                );
                return;
            }

            // Check for "I don't know" variants
            const idkVariants = ["i don't know", "idk", "i dunno", "no idea", "pass"];
            const isIdk = idkVariants.some(variant => answer.toLowerCase().includes(variant));
            
            if (isIdk) {
                processReveal();
                return;
            }

            // Word count validation (scales reasonably with question marks)
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = currentQuestion.markScheme;
            const markSchemeText = tempDiv.textContent || tempDiv.innerText || "";
            
            const msWordCount = markSchemeText.split(/\s+/).filter(word => word.length > 0).length;
            const answerWordCount = answer.split(/\s+/).filter(word => word.length > 0).length;
            const expectedMinWords = Math.min(currentQuestion.marks * 6, msWordCount * 0.4);

            if (!bypassActive && (answerWordCount < expectedMinWords)) {
                showModal(
                    "Are you sure?", 
                    "Your answer looks a bit brief compared to what the examiner is looking for. <br><br>Have you given it your best shot?", 
                    "Sorry Coach, that's all I've got. Show me the mark scheme; I'll be honest with myself and come back better!", 
                    "Let me back in Coach, I've got more to say",
                    () => {
                        bypassActive = true;
                        processReveal();
                    },
                    () => {
                        userAnswer.focus();
                    }
                );
                return;
            }

            processReveal();
        }

        function processReveal() {
            displayMarkScheme.innerHTML = currentQuestion.markScheme;
            
            // Generate Random Reflection Prompt
            const randomPrompt = reflectionPrompts[Math.floor(Math.random() * reflectionPrompts.length)];
            displayReflection.textContent = randomPrompt;

            userAnswer.disabled = true;
            markSchemeContainer.classList.remove('hidden');
            
            // Scroll to mark scheme smoothly
            markSchemeContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Event Listeners
        btnRandom.addEventListener('click', loadQuestion);
        
        btnHint.addEventListener('click', () => {
            if (currentQuestion && currentQuestion.hint) {
                displayHint.textContent = currentQuestion.hint;
                hintBox.classList.remove('hidden');
            }
        });

        btnReveal.addEventListener('click', revealMarkScheme);
        btnNext.addEventListener('click', loadQuestion);

        // Close modal if clicking outside the box
        customModal.addEventListener('click', (e) => {
            if (e.target === customModal) {
                hideModal();
            }
        });

    </script>
