        tailwind.config = {

            background-color: rgba(0, 69, 135, 0.7);

            background-position: right 1rem center;
            background-size: 1em;
        }

            color: #111827 !important;
            background-color: #ffffff !important;

            font-weight: bold;
            color: #004587;
            background-color: #f9fafb;
        }

</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Header -->
    <header class="w-full max-w-4xl bg-white rounded-t-xl shadow-md p-6 border-b-4 border-cdlRed flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <div class="mb-2">
                <a href="../../" class="inline-flex items-center text-xs font-bold text-cdlBlue bg-gray-100 hover:bg-cdlBrightBlue hover:text-white px-3 py-1.5 rounded-full transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />

                    Back to IGCSE Hub
                </a>
            </div>
            <h1 class="text-3xl font-light text-cdlBlue mb-1">IGCSE <span class="highlight-text font-bold">Physical Education</span></h1>
            <h2 class="text-lg font-bold text-gray-500">Topic 3: (3.1 & 3.2) Skill Acquisition, Learning & Coaching</h2>
        </div>
        <div class="hidden sm:block flex-shrink-0">
            <img src="../../images/athletics-logo.png" alt="Collège du Léman Athletics" class="h-16 w-auto object-contain">
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-4xl bg-white shadow-lg rounded-b-xl p-6 md:p-8 flex flex-col space-y-6">
        
        <!-- Controls -->
        <div class="flex flex-col sm:flex-row gap-4 items-center justify-between bg-gray-50 p-4 rounded-lg border border-gray-200">
            <div class="w-full sm:w-2/3">
                <label for="section-select" class="block text-sm font-bold text-cdlBlue mb-2">Select Syllabus Section:</label>
                <select id="section-select" class="w-full h-12 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cdlBrightBlue text-base cursor-pointer">
                    <option value="all">All Sections (Random - 50 Questions)</option>
                    <optgroup label="(3.1) Skill, Ability & Information Processing">
                        <option value="Skill and ability">&nbsp;&nbsp;&nbsp;&nbsp;Skill and ability</option>
                        <option value="Skilled performance">&nbsp;&nbsp;&nbsp;&nbsp;Skilled performance</option>
                        <option value="Skill classification continua">&nbsp;&nbsp;&nbsp;&nbsp;Skill classification continua</option>
                        <option value="Simple information processing model">&nbsp;&nbsp;&nbsp;&nbsp;Simple information processing model</option>
                    </optgroup>
                    <optgroup label="(3.2) Learning, Feedback & Guidance">
                        <option value="The stages of learning">&nbsp;&nbsp;&nbsp;&nbsp;The stages of learning</option>
                        <option value="Feedback">&nbsp;&nbsp;&nbsp;&nbsp;Feedback</option>
                        <option value="Guidance">&nbsp;&nbsp;&nbsp;&nbsp;Guidance</option>
                    </optgroup>
                </select>
            </div>
            <div class="w-full sm:w-1/3 flex justify-end">
                <button id="btn-random" class="w-full h-12 sm:w-auto btn-blue px-6 py-2 mt-auto rounded-md font-bold shadow-md">
                    Load Question
                </button>
            </div>
        </div>

        <!-- Question Display -->
        <div id="question-container" class="hidden flex flex-col space-y-4">
            
            <!-- Traffic Light Indicator -->
            <div id="traffic-light-banner" class="flex items-start p-3 rounded-md border text-sm font-bold w-full transition-colors">
                <div id="traffic-light-dot" class="w-4 h-4 rounded-full mr-3 mt-0.5 flex-shrink-0"></div>
                <div id="traffic-light-text" class="text-gray-700 leading-tight"></div>
            </div>

            <div class="flex justify-between items-start pt-2">
                <h3 class="text-xl font-bold text-cdlBlue leading-snug" id="display-question">Question goes here</h3>
                <span id="display-marks" class="bg-cdlRed text-white text-sm font-bold px-3 py-1 rounded-full whitespace-nowrap ml-4"></span>
            </div>
            
            <div class="flex flex-col space-y-2">
                <label for="user-answer" class="text-sm font-bold text-gray-600">Your Answer:</label>
                <textarea id="user-answer" rows="5" class="w-full p-4 border-2 border-gray-200 rounded-md focus:outline-none focus:border-cdlBrightBlue resize-none text-gray-800" placeholder="Type your answer here..."></textarea>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-2">
                <button id="btn-hint" class="text-cdlBlue font-bold underline hover:text-cdlBrightBlue text-sm flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                    Need a hint?

                    Reveal Mark Scheme
                </button>

            <!-- Hint Box -->
            <div id="hint-box" class="hidden bg-cdlBrightYellow bg-opacity-30 border-l-4 border-cdlGold p-4 rounded-r-md mt-4">
                <p class="text-sm text-gray-600 mb-2 italic"><strong>Note:</strong> If you're asking for a hint, you should probably come back here later to see if you can manage without one!</p>
                <p id="display-hint" class="font-bold text-cdlBlue"></p>
            </div>
        </div>

        <!-- Mark Scheme Display -->
        <div id="mark-scheme-container" class="hidden mt-6 border-t-2 border-gray-100 pt-6">
            <h3 class="text-lg font-bold text-cdlRed mb-3 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Mark Scheme
            </h3>
            <div id="display-mark-scheme" class="bg-gray-50 p-5 rounded-md border border-gray-200 text-gray-800 leading-relaxed prose max-w-none">
                <!-- Mark scheme content injected here -->
            </div>

            <!-- Metacognitive Prompt -->
            <div class="mt-6 bg-cdlBlue text-white p-5 rounded-md shadow-inner">
                <h4 class="font-bold text-cdlBrightBlue mb-2 text-sm uppercase tracking-wider">Reflection</h4>
                <p id="display-reflection" class="text-lg font-light"></p>
            </div>
            
            <div class="mt-6 flex justify-end">
                <button id="btn-next" class="btn-blue px-6 py-3 rounded-md font-bold shadow-md flex items-center">
                    Next Question
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>
        </div>

    </main>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 border-t-8 border-cdlRed transform transition-all">
            <h3 id="modal-title" class="text-2xl font-bold text-cdlBlue mb-2">Notice</h3>
            <p id="modal-message" class="text-gray-600 mb-6 leading-relaxed"></p>
            <div class="flex flex-col space-y-3 mt-4">
                <button id="modal-btn-secondary" class="px-4 py-2 rounded-md font-bold text-gray-600 border border-gray-300 hover:bg-gray-100 hidden text-sm"></button>
                <button id="modal-btn-primary" class="btn-blue px-6 py-2 rounded-md font-bold shadow-sm text-sm"></button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            // ==========================================
            // 1. Skill and ability (8 Questions)
            // ==========================================
            {
                section: "Skill and ability",
                marks: 2,
                question: "Describe one feature of a skill and one feature of ability.",
                markScheme: "<em>1 mark for describing a feature of skill.<br>1 mark for describing a feature of ability.</em><br><br><strong>skill:</strong><ul><li>learned / practiced / sport-specific / easily adapted;</li></ul><strong>ability:</strong><ul><li>innate / you are born with them / general / enduring / difficult to change;</li></ul>",
                hint: "Think about our computer analogy from class: which one is the 'hardware' you are born with, and which one is the 'software' you install through practice?",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 3,
                question: "Explain, using an example of each, the difference between skill and ability.",
                markScheme: "<em>1 mark for describing an example of a skill.</em><ul><li>for example shooting a ball in netball;</li></ul><em>1 mark for describing an example of an ability.</em><ul><li>for example jumping / running;</li></ul><em>1 mark for an explanation of a difference between skill and ability.</em><ul><li>for example: skills are learnt / practised / sport-specific / more easily adapted whereas abilities are innate / you are born with them / general / enduring / difficult to change;</li></ul>",
                hint: "Make sure you do three things: give a sport-specific skill example, give a general physical ability example, and state how they differ.",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 2,
                question: "Describe:<br>• Skill<br>• Ability",
                markScheme: "<em>1 mark for each description.</em><br><ul><li><strong>skill</strong> – a learned and practiced ability that brings about the result that you want to achieve with maximum certainty and efficiency;</li><li><strong>ability</strong> – the qualities and characteristics a person is born with;</li></ul>",
                hint: "Remember the exact definitions from Level 1 of our slides: maximum certainty and efficiency vs qualities you are born with.",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 3,
                question: "State three factors that cause variation in skill levels.",
                markScheme: "<em>1 mark for each factor.<br>Any 3 of:</em><ul><li>age / maturity / experience / stage of learning;</li><li>culture;</li><li>motivation;</li><li>anxiety;</li><li>arousal conditions;</li><li>facilities;</li><li>environment;</li><li>teaching / coaching / practice;</li></ul><em>Accept other valid answers.</em>",
                hint: "Think of our mnemonics: 'A.C.H.I.E.V.E.' or 'Athletes Can Master Any Activity From Excellent Teaching'.",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 4,
                question: "Explain, using examples, how two factors could cause variations in the skill level of performers.",
                markScheme: "<em>1 mark for naming each factor (2 marks max.).<br>1 mark for explaining the effect of each named factor (2 marks max.).</em><br><br><strong>factors & explanations, for example:</strong><ul><li><strong>age / maturity, etc.:</strong> performers who are young may not have the experience of being in a particular situation before / may not know how to react / may not yet have developed the physical attributes to be able to perform well / impacts of school / work commitments for relevant age group;</li><li><strong>culture:</strong> some cultures may not provide opportunities to develop skills due to restrictions on performers, e.g. females may not be able to swim in mixed sessions so may not have many opportunities to develop swimming skills;</li><li><strong>motivation:</strong> a performer who lacks motivation is unlikely to develop skills as they might drop out when training becomes difficult / a highly motivated performer will always train hard and give the effort required;</li><li><strong>anxiety:</strong> some performers are naturally more anxious than others / concerned that they may not be able to play well / may let their teammates down / concerned when they are being watched, etc.;</li><li><strong>arousal conditions:</strong> the perceived quality of the opposition may cause high arousal which lowers the skill level / arousal levels affect focus / cause distraction / the importance of the event affects the arousal level;</li><li><strong>facilities:</strong> the kind of facilities that are available and accessible will influence the activities that a person takes part in / this would include the costs of facilities;</li><li><strong>environment:</strong> if a performer lives in an area which has high snowfall they will be able to ski more often than someone who lives a distance from slopes and has to travel;</li><li><strong>teaching / coaching, etc.:</strong> the higher the quality of coaching / teaching available and more practice / training the faster the speed of development;</li></ul><em>Accept other valid explanations.</em>",
                hint: "Don't just list two factors! Name a factor for 1 mark, then explain with an example how it actually raises or lowers a player's skill level for the 2nd mark.",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 4,
                question: "Explain how each of the following factors can affect a performer's skill level:<br>1. Age and maturity<br>2. Culture<br>3. Arousal conditions<br>4. Motivation",
                markScheme: "<em>1 mark for each factor explained.</em><br><br><strong>age and maturity:</strong><ul><li>some activities have age restrictions preventing young performers from participating so skill levels will be low;</li><li>the earlier someone starts playing a sport allows more opportunity to learn a skill so skill levels may be higher compared to others of a similar age;</li><li>older performers may have more experience of when to apply skills for the best result so have a higher skill level;</li><li>young children have not developed coordination / balance needed so skill level is low / elderly people's coordination may decrease so skill level is lower;</li></ul><strong>culture:</strong><ul><li>certain sports have greater exposure / opportunities in certain countries so have a higher profile which leads to higher skill level;</li><li>some countries excel in certain sports so greater opportunities to play that sport leading to higher skill level;</li><li>the culture within families to play certain sports often means children are influenced to play leading to higher skill level;</li><li>some sports are traditional due to climate and geography so people expect to take part, e.g. cross-country skiing in Norway, so skill levels are higher;</li><li>some women's participation may be restricted so their skill level may be lower;</li></ul><strong>arousal conditions:</strong><ul><li>underarousal (LOW) / overarousal (HIGH) results in a lack of focus which results in low skill levels;</li><li>optimal arousal leads to being focused and results in high skill levels;</li><li>a performer who prefers low arousal activities may perform fine motor skills at a higher level;</li><li>a performer who prefers high arousal activities may perform gross motor skills at a higher level;</li></ul><strong>motivation:</strong><ul><li>if the performer lacks motivation, they will not work hard in training to improve skills so skill levels are low;</li><li>a performer with low motivation will not have focus / give up easily if a skill proves to be difficult to learn so skill levels are low;</li><li>a motivated performer will be prepared to sacrifice things to work hard to improve so skill levels will be high;</li></ul><em>Accept reverse points and other appropriate examples.</em>",
                hint: "Link each of the four factors directly to why someone's skill level would become higher or lower.",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 4,
                question: "Use examples from four different physical activities to explain how each of the following factors can affect the skill level of a performer:<br>1. Age and maturity<br>2. Culture<br>3. Arousal conditions<br>4. Facilities",
                markScheme: "<em>1 mark for explaining the effect of each factor. Physical activities must be appropriate and different.</em><br><br>For example:<br><strong>(age and maturity – e.g. rugby):</strong><ul><li>rugby may have age restrictions preventing young performers from participating so skill levels will be low;</li><li>the earlier someone starts playing rugby the more opportunity they have to learn rugby skills so skill levels may be higher compared to others of a similar age;</li><li>older performers may have more experience of when to apply rugby skills for the best result so have a higher skill level;</li><li>young children have not developed coordination / balance needed to play rugby so skill level is low / elderly people's coordination may decrease so skill level in rugby is lower;</li></ul><strong>(culture – e.g. cricket):</strong><ul><li>cricket may have greater exposure in the country / more opportunities in certain countries so have a higher profile which leads to higher skill level;</li><li>some countries excel in cricket so greater opportunities to play cricket leading to higher skill level;</li><li>the culture within families to play cricket often means children are influenced to play cricket, leading to higher skill level;</li><li>some sports like cricket are traditional due to climate and geography so people expect to take part, so skill levels are higher;</li><li>some women's participation in cricket in some countries may be restricted so their skill level may be lower;</li></ul><strong>(arousal conditions – e.g. netball):</strong><ul><li>underarousal / overarousal in netball may result in a lack of focus which results in low skill levels;</li><li>optimal arousal leads to being focused and results in high skill levels in netball;</li><li>a netball performer who prefers low arousal activities may perform fine motor skills at a higher level, e.g. a goal shooter;</li><li>a performer who prefers high arousal activities may perform gross motor skills at a higher level, e.g. a centre;</li></ul><strong>(facilities – e.g. swimming):</strong><ul><li>having a swimming pool available and accessible would influence the time spent swimming / this would include the costs of facilities, e.g. a swimmer may not be able to develop swimming skills without regular access to a pool so skill level will be lower;</li></ul>",
                hint: "Read carefully: you must name FOUR DIFFERENT sports (one for each factor) to get full marks!",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 2,
                question: "Using the concept of ability and practice, explain why a performer with high natural ability may still not become a skilled performer.",
                markScheme: "<ul><li>Ability is only the innate genetic potential a person is born with (the 'hardware'). (1 mark)</li><li>Remembering that <strong>Ability + Practice = Skill</strong>, without quality teaching/coaching, motivation, or dedicated practice, innate abilities cannot be converted into refined, sport-specific skills. (1 mark)</li></ul>",
                hint: "Think about the equation on our Michael Jordan slide: Ability + ________ = Skill.",
                isOfficial: false
            },

            // ==========================================
            // 2. Skilled performance (6 Questions)
            // ==========================================
            {
                section: "Skilled performance",
                marks: 3,
                question: "State three characteristics of a skilled performance.",
                markScheme: "<em>1 mark for each correct response.</em><br><br>for example:<ul><li>fluent;</li><li>aesthetically pleasing;</li><li>consistent;</li><li>accurate;</li><li>goal-directed;</li><li>coordinated;</li></ul><em>Accept other appropriate examples.</em>",
                hint: "Think of the 6 traits we looked at with the Scott McTominay overhead kick slide.",
                isOfficial: true
            },
            {
                section: "Skilled performance",
                marks: 3,
                question: "Describe, using examples from a named physical activity, three characteristics of a skilled performance.",
                markScheme: "<em>1 mark for each example used to show a characteristic.<br>Answers should be linked to 3 of the following characteristics:</em><br><br>for example:<ul><li><strong>fluent</strong> – a performer is able to perform a skill without hesitation / makes quick decisions / moves smoothly from one skill to another, e.g. a netball player catching a ball and pivoting immediately;</li><li><strong>aesthetically pleasing</strong> – a movement looks good, e.g. a gymnast completes a twisting movement that looks easy and will score high marks with a judge;</li><li><strong>consistent</strong> – a performer is able to complete a skill repeatedly, e.g. a tennis player is able to complete a high proportion of first serves;</li><li><strong>accurate</strong> – a performer is able to complete the task successfully / exactly / without error, e.g. a basketball player scores a free throw;</li><li><strong>goal-directed</strong> – a performer focuses on performing a specific task and being determined to achieve this goal, e.g. a sprinter trying to achieve a personal best;</li><li><strong>coordinated</strong> – a performer being able to move different parts of the body efficiently and with control, e.g. a basketball player dribbling the ball;</li></ul>",
                hint: "Pick ONE sport and give three concrete examples of what fluent, accurate, consistent, coordinated, goal-directed, or aesthetically pleasing looks like in that sport.",
                isOfficial: true
            },
            {
                section: "Skilled performance",
                marks: 4,
                question: "Describe, from a named physical activity, examples of each of the following characteristics of a skilled performance:<br>• Fluent<br>• Consistent<br>• Accurate<br>• Goal-directed",
                markScheme: "<em>No mark for naming a physical activity. 1 mark for an example of each characteristic described.</em><br><br>for example in tennis:<ul><li><strong>fluent:</strong> a player is able to hit the ball using a full swing of the racket in a flowing movement;</li><li><strong>consistent:</strong> the player is able to hit most first serves with control into the opponent's court;</li><li><strong>accurate:</strong> the movements are precise so the player is able to keep the majority of balls in court;</li><li><strong>goal-directed:</strong> shows a performer being determined to achieve their target, such as hitting shots to an opponent's weakness;</li></ul>",
                hint: "Stick to one sport (like tennis or basketball) and describe what each of those four specific words looks like on the court.",
                isOfficial: true
            },
            {
                section: "Skilled performance",
                marks: 4,
                question: "(i) Describe an example of one named characteristic of a skilled performance from rugby. (2)<br>(ii) Describe an example of a different named characteristic of a skilled performance from artistic gymnastics. (2)",
                markScheme: "<strong>(i) Rugby:</strong> <em>1 mark for a characteristic. 1 mark for an appropriate example.</em><ul><li><strong>fluent:</strong> a performer can catch the ball and pass it without hesitation;</li><li><strong>aesthetically pleasing:</strong> the performer can jump high to catch the ball cleanly which looks good to the coach;</li><li><strong>consistent:</strong> the performer can throw the ball at a lineout so his team can catch the ball the majority of the time;</li><li><strong>accurate:</strong> the performer can successfully kick the ball between the posts at a penalty;</li><li><strong>goal-directed:</strong> the performer follows the coach's game plan, e.g. kicking the ball across the pitch when a player is unmarked;</li><li><strong>coordinated:</strong> a performer can catch the ball and kick whilst continuing to run;</li></ul><strong>(ii) Artistic gymnastics:</strong> <em>1 mark for a DIFFERENT characteristic. 1 mark for an appropriate example.</em><ul><li><strong>fluent:</strong> the gymnast can link movements smoothly such as moving from a handspring into a front walkover;</li><li><strong>aesthetically pleasing:</strong> the handstand looks good and enables the judges to give a high score;</li><li><strong>consistent:</strong> the gymnast can land somersaults correctly most times without falling;</li><li><strong>accurate:</strong> the performer can complete a floor routine without stepping off the mat;</li><li><strong>goal-directed:</strong> to complete a beam routine without falling from the beam;</li><li><strong>coordinated:</strong> the gymnast can know where their body is in space to be able to start a rotation during a vault and know when to extend legs to be able to land;</li></ul>",
                hint: "Make sure you use two DIFFERENT characteristics—one applied to rugby, and a different one applied to gymnastics.",
                isOfficial: true
            },
            {
                section: "Skilled performance",
                marks: 6,
                question: "An elite association football player is dribbling the ball. Explain how the elite player may show three named characteristics of a skilled performance.",
                markScheme: "<em>1 mark for each named characteristic.<br>1 mark for each appropriate explanation.<br>3 from:</em><ul><li><strong>fluent:</strong> the player is able to dribble the ball without hesitation or stumbling;</li><li><strong>aesthetically pleasing:</strong> the player looks good to the spectator / coach;</li><li><strong>consistent:</strong> the player is able to control the ball well at all times;</li><li><strong>accurate:</strong> the player is able to dribble the ball into the space away from the opponents / able to pass the ball directly to a teammate;</li><li><strong>goal-directed:</strong> if the player loses the ball, he will be determined to get the ball back;</li><li><strong>coordinated:</strong> the player is able to control the ball with both feet;</li></ul><em>Accept other appropriate explanations.</em>",
                hint: "You need 3 named characteristics (3 marks) + 3 explanations linked specifically to football dribbling (3 marks).",
                isOfficial: true
            },
            {
                section: "Skilled performance",
                marks: 2,
                question: "Explain the difference between 'accurate' and 'consistent' as characteristics of a skilled performance, using a basketball free throw as an example.",

                isOfficial: true
            },

            // ==========================================
            // 6. Feedback (6 Questions)
            // ==========================================
            {
                section: "Feedback",
                marks: 2,
                question: "Describe two different types of feedback.",
                markScheme: "<em>Any 2 from:</em><br><ul><li><strong>intrinsic:</strong> information that comes from within through thoughts / emotions / muscles (how a movement feels);</li><li><strong>extrinsic:</strong> information that comes from an external source such as a teacher or coach;</li><li><strong>knowledge of performance:</strong> analysis of the technique used to perform a skill;</li><li><strong>knowledge of results:</strong> knowing your score, time, distance or a place in a race, scoring a goal allows the performer to know how well they are doing;</li></ul>",
                hint: "Remember the 4 boxes on our Coaching Feedback slide: Intrinsic, Extrinsic, Knowledge of Performance, and Knowledge of Results.",
                isOfficial: true
            },
            {
                section: "Feedback",
                marks: 3,
                question: "Explain three reasons why feedback is important for a performer.",
                markScheme: "<em>1 mark for each explanation.<br>3 from:</em><ul><li>performers can identify strengths / weaknesses to focus training methods / know what they need to improve;</li><li>able to correct errors before they become a routine part of performance / help design appropriate training programmes / use to set goals / avoid making the same mistakes;</li><li>ensures the performer knows if progress is being made / able to measure if progress is being made / reinforces the positive aspects of a performance;</li><li>motivates the performer to continue to work hard by raising their expectation of their own ability / by increasing confidence / by reducing anxiety / by increasing levels of arousal;</li><li>maintains the performer's focus on the performance rather than the result;</li><li>performer will feel supported / stops the performer from feeling isolated which is important when performers train or perform in isolation;</li><li>ensures training time is not wasted / more efficient than trial and error / prevents a performer losing interest in participation;</li><li>allows a performer to start developing methods of intrinsic feedback / develop greater control over their performance;</li></ul>",
                hint: "Use our class acronym: S.T.A.M.I.N.A.S. (Safety, Technique, Areas of strength/weakness, Motivation, Intrinsic developed, No wasted time, Aims/goals, Support).",
                isOfficial: true
            },
            {
                section: "Feedback",
                marks: 2,
                question: "Describe how the feedback used by a performer at the cognitive stage of learning differs from the feedback used by a performer at the autonomous stage of learning.",
                markScheme: "<em>1 mark for a description of each difference.</em><br><ul><li>the cognitive performer would use mainly extrinsic feedback <strong>AND</strong> the autonomous performer would use mainly intrinsic feedback;</li><li>the cognitive performer would use mainly knowledge of results <strong>AND</strong> the autonomous performer would use mainly knowledge of performance;</li><li>the cognitive performer copes better with positive feedback <strong>AND</strong> the autonomous performer can cope with negative feedback;</li></ul><em>Accept alternative wording.</em>",
                hint: "Compare Extrinsic vs Intrinsic, and Knowledge of Results vs Knowledge of Performance across the two stages.",
                isOfficial: true
            },
            {
                section: "Feedback",
                marks: 2,
                question: "Knowledge of results is a type of feedback. Explain one advantage and one disadvantage of this type of feedback for a performer at the cognitive stage of learning.",
                markScheme: "<em>1 mark for explaining an advantage. 1 mark for explaining a disadvantage. Answers must relate to the cognitive stage.</em><br><br><strong>advantage:</strong><ul><li>the performer can see the outcome of the skill being completed straight away / easy to set targets / can work without a coach being present as the feedback is obvious / if successful is highly motivating;</li></ul><strong>disadvantage:</strong><ul><li>does not help improve technique / can reinforce incorrect technique / if results are poor can be highly demotivating / improvements in results may be slow to achieve despite technique improving / results may not reflect performance;</li></ul>",
                hint: "Why is seeing the ball go in the net great for a beginner, and why can just looking at the score be unhelpful for their technique?",
                isOfficial: true
            },
            {
                section: "Feedback",
                marks: 4,
                question: "(a) Suggest possible negative effects for a performer who receives limited extrinsic feedback. (2)<br>(b) Explain two benefits of intrinsic feedback. (2)",
                markScheme: "<strong>10(a) 2 from (2 marks):</strong><ul><li>learning will be slower / may develop poor skills / errors may become established / not able to improve skills easily / greater risk of injury;</li><li>performer may become confused / do not know if performance was good or bad / become more anxious / lower confidence;</li><li>lacks motivation / feels isolated;</li><li>not able to develop intrinsic feedback;</li><li>difficult to set appropriate goals / know when goals have been achieved;</li><li>may not recognise the need to change if results are good / may not know if the skills being used are correctly applied / waste time working on unnecessary skills;</li></ul><strong>10(b) 2 from (2 marks):</strong><ul><li>does not need to rely on a coach being present / gives more time to practice / practice can take place when the performer is ready;</li><li>easy to make adjustment / adjustments can be made during a performance / feedback can be immediate;</li><li>helps a performer to focus on the feel of the skill;</li><li>helps performers to solve problems themselves / helps performers to develop skills independently / monitor their own progress;</li><li>motivating / increases confidence / makes the performer feel good;</li></ul>",
                hint: "(a) What goes wrong if a coach never tells a learner how they are doing? (b) Why is it great when an elite player can 'feel' their own technique?",
                isOfficial: true
            },
            {
                section: "Feedback",
                marks: 4,
                question: "Identify two types of feedback that a basketball coach can provide during a practice session. Describe a different example of how each type of feedback can be provided by the basketball coach.",
                markScheme: "<em>1 mark for each type of feedback (2 marks max.). 1 mark for each description of these (2 marks max.).</em><br><ul><li><strong>extrinsic;</strong><br><em>(description of example)</em> coach telling the performer about their technique of shooting / a coach using words of encouragement or praise for a good shot / interception / a coach shouting coaching points after the performer misses the basket due to poor technique;</li><li><strong>knowledge of performance;</strong><br><em>(description of example)</em> coach telling a player about their strengths / weaknesses when shooting;</li><li><strong>knowledge of results;</strong><br><em>(description of example)</em> coach telling performer number of successful passes / shots at the end of a set of attempts;</li></ul><em>Accept other relevant examples.</em>",
                hint: "Note that the question asks what the COACH can provide (so don't pick Intrinsic!). Pick two from Extrinsic, KP, or KR and give basketball examples.",
                isOfficial: true
            },

            // ==========================================
            // 7. Guidance (5 Questions)
            // ==========================================
            {
                section: "Guidance",
                marks: 3,
                question: "Describe, using examples, how visual guidance benefits a performer at the cognitive stage of learning.",
                markScheme: "<em>1 mark for each benefit described. Each benefit must have an example.</em><br><br>for example:<ul><li><strong>(simple) demonstrations:</strong> are clear and easy to see / able to repeat / copy;</li><li><strong>demonstrations from different angles:</strong> avoid confusion / helps performer relate if left- or right-handed;</li><li><strong>video of own performance:</strong> motivational / see own strengths / weaknesses;</li><li><strong>video of elite performer:</strong> help to understand how the skill fits into a game / full context;</li><li><strong>posters / charts:</strong> breaking a skill down into parts / reminder in changing areas;</li><li><strong>use of a visual cue:</strong> highlights key points of the skill;</li></ul><em>Accept other valid examples with benefits.</em>",
                hint: "Remember: each point needs BOTH an example of visual guidance (e.g. demonstration, poster, cones) AND how it helps a beginner!",
                isOfficial: true
            },
            {
                section: "Guidance",
                marks: 2,
                question: "Suggest why a coach should mainly use verbal guidance for a performer at the autonomous stage of learning.",
                markScheme: "<em>Any 2 of:</em><ul><li>the performer has the ability / understanding to analyse the information from the coach;</li><li>the performer can process the information during performance;</li><li>adjustments may be tactical;</li><li>the relationship with the coach allows for a greater level of discussion over the situation rather than just instructions;</li><li>changes to techniques are often quite detailed;</li><li>the coach may not have the ability to demonstrate the changes needed;</li><li>at half-time / between jumps, etc. may be few resources available / little time available during a game to use other types of guidance;</li></ul>",
                hint: "Why doesn't an Olympic athlete need the coach to hold their arm or show them a basic demonstration?",
                isOfficial: true
            },
            {
                section: "Guidance",
                marks: 4,
                question: "Identify a different type of guidance that would be most appropriate for a performer at the Cognitive stage of learning and the Autonomous stage of learning. Justify each choice.",
                markScheme: "<em>2 marks max. for naming types of guidance (must be different).<br>2 marks max. for matching justification.</em><br><br><strong>cognitive stage:</strong><ul><li><strong>visual:</strong> the performer can see an accurate performance and form a mental picture of the correct performance / demonstration can be repeated if required / can see the skill from different angles / if a video is used it can be slow motion to focus on certain aspects of a skill / can replicate the skill;</li><li><strong>manual / mechanical:</strong> reduces anxiety when performing certain skills / allows a coach to give minor adjustments to the position of performer's limbs / helps to feel the movement of the skill;</li><li><strong>verbal:</strong> can be given immediately / can use questions and answers to check learning / can be combined with visual;</li></ul><strong>autonomous stage:</strong><ul><li><strong>verbal:</strong> can be given at a later date / the performer has the ability to understand technical terms / analyse information / may include the need for tactical adjustment to the execution of a skill / a coach may not be able to provide visual guidance of high enough quality / information can be processed during the performance / changes to techniques are often detailed / do not need as much (visual/mechanical/manual) guidance / can fix mistakes quickly;</li><li><strong>visual:</strong> use of recordings of own performance to make critical analysis / watch other performers to adjust performance when playing them;</li><li><strong>manual / mechanical:</strong> to develop complex movements / skills that could be dangerous if no support was provided;</li></ul>",
                hint: "For each stage, do two things: name a suitable type of guidance AND explain why it suits a learner at that specific stage.",
                isOfficial: true
            },
            {
                section: "Guidance",
                marks: 6,
                question: "(a) A coach may demonstrate a skill as a form of visual guidance. Suggest two advantages and two disadvantages for a performer when visual guidance is used. (4)<br>(b)(i) Identify an example of manual / mechanical guidance in a named physical activity. (1)<br>(b)(ii) Describe an advantage that manual / mechanical guidance provides for a performer. (1)",
                markScheme: "<strong>5(a) (4 marks):</strong> <em>2 marks max. for advantages. 2 marks max. for disadvantages.</em><br><strong>advantages:</strong><ul><li>performer can see the skill in context / see how it's done / know what to replicate;</li><li>allows a mental image of the skill to be developed;</li><li>demonstrations can be repeated if necessary;</li><li>questions can be asked during the demonstration;</li><li>demonstrations can be slowed down to show detailed information;</li><li>skill can be broken down into sub-routines / part of the skill can be repeated;</li><li>posters / videos / books can be used at any time;</li><li>motivates the performer if it looks easy to achieve;</li></ul><strong>disadvantages:</strong><ul><li>not all may be able to see if there are large numbers watching the demonstration;</li><li>the demonstration may be poor and lead to confusion / develop incorrect technique;</li><li>demonstrations should be shown for left- and right-handed performers, if not there may be confusion;</li><li>demonstrations require performers to concentrate fully to gain an advantage;</li><li>complicated skills may be difficult for some performers to follow without additional verbal guidance;</li><li>those performers at the autonomous stage of learning may not have a coach who can provide a useful demonstration;</li><li>would not be suitable for blind / partially-sighted performers / not everyone is a visual learner;</li><li>demotivate the performer if the demonstration looks too complex;</li></ul><strong>5(b)(i) (1 mark):</strong><ul><li>gymnastics / rock climbing – harness; swimming – flotation equipment; golf – physical support and guidance by a coach; cricket bowling / tennis serve / football – shooting machines; gymnastics / trampolining – soft landing areas;</li></ul><strong>5(b)(ii) (1 mark):</strong><ul><li>safety when practicing complex / dangerous activities; develop a feel for the skill; builds confidence; manual guidance can improve basic technique, e.g. position of the grip on a golf club / machines can provide consistent supply of balls;</li></ul>",
                hint: "(a) Give 2 pros and 2 cons of watching demonstrations. (b) Give 1 concrete example of manual/mechanical aid and 1 benefit.",
                isOfficial: true
            },
            {
                section: "Guidance",
                marks: 6,
                question: "Use examples from a named physical activity to describe how a coach may provide three named types of guidance to a performer.",
                markScheme: "<em>Physical activity must be appropriate. 1 mark for each type of guidance (max. 3). 1 mark for each relevant description (max. 3).</em><br><br>for example in gymnastics (or swimming):<ul><li><strong>visual;</strong><br>coach may demonstrate a handstand (to enable the skill to be seen) / coach may display posters of elite gymnasts performing a somersault / coach may show a video of a cartwheel (to be able to analyse performance and determine areas to improve) / coach may use targets on the floor to help 'spot' the landing from a vault;</li><li><strong>verbal;</strong><br>coach may give instructions to the gymnast about how to perform a forward roll / coach may remind the gymnast of their floor routine beforehand / a coach may use questioning to assess the level of understanding of a forward roll / a coach may provide accurate descriptions of a forward roll;</li><li><strong>manual;</strong><br>a coach may adjust the physical position of a gymnast, e.g. hold the gymnast's legs straight in a handstand / a coach may help a gymnast to develop a feeling of the movement during a cartwheel, e.g. by supporting the gymnast's hips;</li><li><strong>mechanical;</strong><br>a coach may use a harness to reduce the danger when performing a somersault (or use a float in swimming to isolate leg kick);</li></ul><em>Accept other examples of each type of guidance.</em>",
                hint: "Pick ONE sport (Gymnastics or Swimming are easiest!) and give a specific example for three of the four guidance types (Visual, Verbal, Manual, Mechanical).",
                isOfficial: true
            }
        ];

        // Conversational reflection prompts
        const reflectionPrompts = [
            "How did you do? Be honest with yourself—how many marks out of the total would you give your answer?",
            "Did anything in the mark scheme surprise you?",
            "If you dropped any marks here, what's your plan to make sure you nail it next time?",
            "Did you use the exact terminology? Often, close isn't quite enough in the exam.",
            "How could you have improved your answer to guarantee full marks?",
            "What was the trickiest part of this question for you?",
            "Which part of the mark scheme did you completely forget to include?",
            "How did you do? Are you confident to move on, or do you need to revisit this topic?"
        ];

        let currentQuestion = null;
        let recentQuestions = []; // Anti-repeat session tracker
        let bypassActive = false;

        // DOM Elements
        const sectionSelect = document.getElementById('section-select');
        const btnRandom = document.getElementById('btn-random');
        const questionContainer = document.getElementById('question-container');
        const displayQuestion = document.getElementById('display-question');
        const displayMarks = document.getElementById('display-marks');
        const userAnswer = document.getElementById('user-answer');
        const btnReveal = document.getElementById('btn-reveal');
        const btnHint = document.getElementById('btn-hint');
        const hintBox = document.getElementById('hint-box');
        const displayHint = document.getElementById('display-hint');
        const markSchemeContainer = document.getElementById('mark-scheme-container');
        const displayMarkScheme = document.getElementById('display-mark-scheme');
        const displayReflection = document.getElementById('display-reflection');
        const btnNext = document.getElementById('btn-next');
        
        // Traffic Light Elements
        const trafficBanner = document.getElementById('traffic-light-banner');
        const trafficDot = document.getElementById('traffic-light-dot');
        const trafficText = document.getElementById('traffic-light-text');

        // Modal Elements
        const customModal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalBtnPrimary = document.getElementById('modal-btn-primary');
        const modalBtnSecondary = document.getElementById('modal-btn-secondary');

        // Functions
        function showModal(title, message, primaryText, secondaryText, onPrimaryClick, onSecondaryClick) {
            modalTitle.textContent = title;
            modalMessage.innerHTML = message;
            
            modalBtnPrimary.textContent = primaryText;
            modalBtnPrimary.onclick = () => {
                hideModal();
                if (onPrimaryClick) onPrimaryClick();
            };
            
            if (secondaryText) {
                modalBtnSecondary.textContent = secondaryText;
                modalBtnSecondary.classList.remove('hidden');
                modalBtnSecondary.onclick = () => {
                    hideModal();
                    if (onSecondaryClick) onSecondaryClick();
                };
            } else {
                modalBtnSecondary.classList.add('hidden');
            }
            
            customModal.classList.remove('hidden');
        }
        
        function hideModal() {
            customModal.classList.add('hidden');
        }

        function loadQuestion() {
            const selectedSection = sectionSelect.value;
            let filteredQuestions = questions;
            
            if (selectedSection !== 'all') {
                filteredQuestions = questions.filter(q => q.section === selectedSection);
            }
            
            if (filteredQuestions.length === 0) {
                showModal("Oops!", "No questions found for this section.", "OK");
                return;
            }

            // Filter out recently asked questions to avoid immediate repeats
            let availableQuestions = filteredQuestions.filter(q => !recentQuestions.includes(q));
            
            // If all questions in this category have been shown recently, reset history
            if (availableQuestions.length === 0) {
                recentQuestions = [];
                availableQuestions = filteredQuestions;
            }

            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            currentQuestion = availableQuestions[randomIndex];

            // Track recent questions (store up to 4 recent picks)
            recentQuestions.push(currentQuestion);
            if (recentQuestions.length > 4) {
                recentQuestions.shift();
            }

            // Setup Traffic Light UI
            trafficBanner.classList.remove('bg-green-100', 'border-green-300', 'bg-amber-100', 'border-amber-300');
            trafficDot.classList.remove('bg-green-500', 'bg-amber-500');
            
            if (currentQuestion.isOfficial) {
                trafficBanner.classList.add('bg-green-100', 'border-green-300');
                trafficDot.classList.add('bg-green-500');
                trafficText.innerHTML = "Official Cambridge Mark Scheme. Highly reliable.";
            } else {
                trafficBanner.classList.add('bg-amber-100', 'border-amber-300');
                trafficDot.classList.add('bg-amber-500');
                trafficText.innerHTML = "Syllabus-aligned but AI-generated. Be extra sceptical at times—always check against course material and ask each other and Coach Jamie if you have doubts.";
            }

            // Reset UI
            displayQuestion.innerHTML = currentQuestion.question;
            displayMarks.textContent = `[${currentQuestion.marks} mark${currentQuestion.marks > 1 ? 's' : ''}]`;
            userAnswer.value = '';
            userAnswer.disabled = false;
            questionContainer.classList.remove('hidden');
            markSchemeContainer.classList.add('hidden');
            hintBox.classList.add('hidden');
            bypassActive = false;
        }

        function revealMarkScheme() {
            const answer = userAnswer.value.trim();
            
            // Check for empty box
            if (answer === '') {
                showModal(
                    "Hold up!", 
                    "Oh no you don't! You have to write <em>something</em> before I show you the answer.<br><br>If that something is 'I don't know', that's fine, but take note: this is obviously an area you need to revisit again later.", 
                    "Try again"
                );
                return;
            }

            // Check for "I don't know" variants
            const idkVariants = ["i don't know", "idk", "i dunno", "no idea", "pass"];
            const isIdk = idkVariants.some(variant => answer.toLowerCase().includes(variant));
            
            if (isIdk) {
                processReveal();
                return;
            }

            // Word count validation (scales reasonably with question marks even when full mark schemes are long)
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = currentQuestion.markScheme;
            const markSchemeText = tempDiv.textContent || tempDiv.innerText || "";
            
            const msWordCount = markSchemeText.split(/\s+/).filter(word => word.length > 0).length;
            const answerWordCount = answer.split(/\s+/).filter(word => word.length > 0).length;
            const expectedMinWords = Math.min(currentQuestion.marks * 7, msWordCount * 0.4);

            if (!bypassActive && (answerWordCount < expectedMinWords)) {
                showModal(
                    "Are you sure?", 
                    "Your answer looks a bit brief compared to what the examiner is looking for. <br><br>Have you given it your best shot?", 
                    "Sorry Coach, that's all I've got. Show me the mark scheme; I'll be honest with myself and come back better!", 
                    "Let me back in Coach, I've got more to say",
                    () => {
                        bypassActive = true;
                        processReveal();
                    },
                    () => {
                        userAnswer.focus();
                    }
                );
                return;
            }

            processReveal();
        }

        function processReveal() {
            displayMarkScheme.innerHTML = currentQuestion.markScheme;
            
            // Generate Random Reflection Prompt
            const randomPrompt = reflectionPrompts[Math.floor(Math.random() * reflectionPrompts.length)];
            displayReflection.textContent = randomPrompt;

            userAnswer.disabled = true;
            markSchemeContainer.classList.remove('hidden');
            
            // Scroll to mark scheme smoothly
            markSchemeContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Event Listeners
        btnRandom.addEventListener('click', loadQuestion);
        
        btnHint.addEventListener('click', () => {
            if (currentQuestion && currentQuestion.hint) {
                displayHint.textContent = currentQuestion.hint;
                hintBox.classList.remove('hidden');
            }
        });

        btnReveal.addEventListener('click', revealMarkScheme);
        btnNext.addEventListener('click', loadQuestion);

        // Close modal if clicking outside the box
        customModal.addEventListener('click', (e) => {
            if (e.target === customModal) {
                hideModal();
            }
        });

    </script>
</body>
</html>
