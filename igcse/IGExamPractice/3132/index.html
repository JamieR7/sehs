<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGCSE PE Revision - Collège du Léman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.cdnfonts.com/css/gotham" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cdlBlue: '#004587',
                        cdlRed: '#E73037',
                        cdlGold: '#FBBA07',
                        cdlBrightBlue: '#1EB9DC',
                        cdlBrightRed: '#EF8162',
                        cdlBrightYellow: '#FFE37E'
                    },
                    fontFamily: {
                        gotham: ['Gotham', 'sans-serif'],
                    }
                }
            }

    </script>
    <style>
        body { font-family: 'Gotham', sans-serif; background-color: #f3f4f6; color: #004587; }
        .btn-blue { background-color: #004587; color: white; transition: all 0.2s; }
        .btn-blue:hover { background-color: #003366; }
        .btn-gold { background-color: #FBBA07; color: #004587; transition: all 0.2s; }
        .btn-gold:hover { background-color: #e5a806; }
        .btn-red { background-color: #E73037; color: white; transition: all 0.2s; }
        .btn-red:hover { background-color: #cc2a31; }
        
        .modal-overlay {
            background-color: rgba(0, 69, 135, 0.7);
            backdrop-filter: blur(4px);
        }
        
        .highlight-text {
            font-weight: 700;
            color: #1EB9DC;
            letter-spacing: 0.05em;
        }

        select {
            color: #111827 !important; 
            background-color: #ffffff !important;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 1rem center;
            background-size: 1em;
        }
        select option {
            color: #111827 !important;
            background-color: #ffffff !important;
        }
        optgroup {
            font-weight: bold;
            color: #004587;
            background-color: #f9fafb;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Header -->
    <header class="w-full max-w-4xl bg-white rounded-t-xl shadow-md p-6 border-b-4 border-cdlRed flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <div class="mb-2">
                <a href="../../" class="inline-flex items-center text-xs font-bold text-cdlBlue bg-gray-100 hover:bg-cdlBrightBlue hover:text-white px-3 py-1.5 rounded-full transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Back to IGCSE Hub
                </a>
            </div>
            <h1 class="text-3xl font-light text-cdlBlue mb-1">IGCSE <span class="highlight-text font-bold">Physical Education</span></h1>
            <h2 class="text-lg font-bold text-gray-500">Topic 3: (3.1 & 3.2) Skill Acquisition, Learning & Coaching</h2>
        </div>
        <div class="hidden sm:block flex-shrink-0">
            <img src="../../images/athletics-logo.png" alt="Collège du Léman Athletics" class="h-16 w-auto object-contain">
        </div>
    </header>

    <!-- Main Content -->
    <main class="w-full max-w-4xl bg-white shadow-lg rounded-b-xl p-6 md:p-8 flex flex-col space-y-6">
        
        <!-- Controls -->
        <div class="flex flex-col sm:flex-row gap-4 items-center justify-between bg-gray-50 p-4 rounded-lg border border-gray-200">
            <div class="w-full sm:w-2/3">
                <label for="section-select" class="block text-sm font-bold text-cdlBlue mb-2">Select Syllabus Section:</label>
                <select id="section-select" class="w-full h-12 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cdlBrightBlue text-base cursor-pointer">
                    <option value="all">All Sections (Random - 50 Questions)</option>
                    <optgroup label="(3.1) Skill, Ability & Information Processing">
                        <option value="Skill and ability">&nbsp;&nbsp;&nbsp;&nbsp;Skill and ability</option>
                        <option value="Skilled performance">&nbsp;&nbsp;&nbsp;&nbsp;Skilled performance</option>
                        <option value="Skill classification continua">&nbsp;&nbsp;&nbsp;&nbsp;Skill classification continua</option>
                        <option value="Simple information processing model">&nbsp;&nbsp;&nbsp;&nbsp;Simple information processing model</option>
                    </optgroup>
                    <optgroup label="(3.2) Learning, Feedback & Guidance">
                        <option value="The stages of learning">&nbsp;&nbsp;&nbsp;&nbsp;The stages of learning</option>
                        <option value="Feedback">&nbsp;&nbsp;&nbsp;&nbsp;Feedback</option>
                        <option value="Guidance">&nbsp;&nbsp;&nbsp;&nbsp;Guidance</option>
                    </optgroup>
                </select>
            </div>
            <div class="w-full sm:w-1/3 flex justify-end">
                <button id="btn-random" class="w-full h-12 sm:w-auto btn-blue px-6 py-2 mt-auto rounded-md font-bold shadow-md">
                    Load Question
                </button>
            </div>
        </div>

        <!-- Question Display -->
        <div id="question-container" class="hidden flex flex-col space-y-4">
            
            <!-- Traffic Light Indicator -->
            <div id="traffic-light-banner" class="flex items-start p-3 rounded-md border text-sm font-bold w-full transition-colors">
                <div id="traffic-light-dot" class="w-4 h-4 rounded-full mr-3 mt-0.5 flex-shrink-0"></div>
                <div id="traffic-light-text" class="text-gray-700 leading-tight"></div>
            </div>

            <div class="flex justify-between items-start pt-2">
                <h3 class="text-xl font-bold text-cdlBlue leading-snug" id="display-question">Question goes here</h3>
                <span id="display-marks" class="bg-cdlRed text-white text-sm font-bold px-3 py-1 rounded-full whitespace-nowrap ml-4"></span>
            </div>
            
            <div class="flex flex-col space-y-2">
                <label for="user-answer" class="text-sm font-bold text-gray-600">Your Answer:</label>
                <textarea id="user-answer" rows="5" class="w-full p-4 border-2 border-gray-200 rounded-md focus:outline-none focus:border-cdlBrightBlue resize-none text-gray-800" placeholder="Type your answer here..."></textarea>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-2">
                <button id="btn-hint" class="text-cdlBlue font-bold underline hover:text-cdlBrightBlue text-sm flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />
                    </svg>
                    Need a hint?
                </button>
                <button id="btn-reveal" class="w-full sm:w-auto btn-gold px-8 py-3 rounded-md font-bold shadow-md text-lg">
                    Reveal Mark Scheme
                </button>
            </div>

            <!-- Hint Box -->
            <div id="hint-box" class="hidden bg-cdlBrightYellow bg-opacity-30 border-l-4 border-cdlGold p-4 rounded-r-md mt-4">
                <p class="text-sm text-gray-600 mb-2 italic"><strong>Note:</strong> If you're asking for a hint, you should probably come back here later to see if you can manage without one!</p>
                <p id="display-hint" class="font-bold text-cdlBlue"></p>
            </div>
        </div>

        <!-- Mark Scheme Display -->
        <div id="mark-scheme-container" class="hidden mt-6 border-t-2 border-gray-100 pt-6">
            <h3 class="text-lg font-bold text-cdlRed mb-3 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                Mark Scheme
            </h3>
            <div id="display-mark-scheme" class="bg-gray-50 p-5 rounded-md border border-gray-200 text-gray-800 leading-relaxed prose max-w-none">
                <!-- Mark scheme content injected here -->
            </div>

            <!-- Metacognitive Prompt -->
            <div class="mt-6 bg-cdlBlue text-white p-5 rounded-md shadow-inner">
                <h4 class="font-bold text-cdlBrightBlue mb-2 text-sm uppercase tracking-wider">Reflection</h4>
                <p id="display-reflection" class="text-lg font-light"></p>
            </div>
            
            <div class="mt-6 flex justify-end">
                <button id="btn-next" class="btn-blue px-6 py-3 rounded-md font-bold shadow-md flex items-center">
                    Next Question
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>
        </div>

    </main>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 border-t-8 border-cdlRed transform transition-all">
            <h3 id="modal-title" class="text-2xl font-bold text-cdlBlue mb-2">Notice</h3>
            <p id="modal-message" class="text-gray-600 mb-6 leading-relaxed"></p>
            <div class="flex flex-col space-y-3 mt-4">
                <button id="modal-btn-secondary" class="px-4 py-2 rounded-md font-bold text-gray-600 border border-gray-300 hover:bg-gray-100 hidden text-sm"></button>
                <button id="modal-btn-primary" class="btn-blue px-6 py-2 rounded-md font-bold shadow-sm text-sm"></button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            // ==========================================
            // 1. Skill and ability (8 Questions)
            // ==========================================
            {
                section: "Skill and ability",
                marks: 2,
                question: "Describe one feature of a skill and one feature of ability.",
                markScheme: "1 mark for describing a feature of skill. 1 mark for describing a feature of ability.<br><ul><li><strong>Skill:</strong> learned / practiced / sport-specific / easily adapted;</li><li><strong>Ability:</strong> innate / you are born with them / general / enduring / difficult to change;</li></ul>",
                hint: "Think about our computer analogy from class: which one is the 'hardware' you are born with, and which one is the 'software' you install through practice?",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 3,
                question: "Explain, using an example of each, the difference between skill and ability.",
                markScheme: "<ul><li><strong>Example of a skill (1 mark):</strong> e.g. shooting a ball in netball / serving in tennis;</li><li><strong>Example of an ability (1 mark):</strong> e.g. jumping / running / balance / coordination / reaction time;</li><li><strong>Explanation of difference (1 mark):</strong> skills are learnt / practised / sport-specific / more easily adapted, whereas abilities are innate / you are born with them / general / enduring / difficult to change;</li></ul>",
                hint: "Make sure you do three things: give a sport-specific skill example, give a general physical ability example, and state how they differ.",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 2,
                question: "Describe the terms 'Skill' and 'Ability'.",
                markScheme: "1 mark for each description:<br><ul><li><strong>Skill:</strong> a learned and practiced ability that brings about the result that you want to achieve with maximum certainty and efficiency;</li><li><strong>Ability:</strong> the qualities and characteristics a person is born with (that allow a person to learn or acquire skills);</li></ul>",
                hint: "Remember the exact definitions from Level 1 of our slides: maximum certainty and efficiency vs qualities you are born with.",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 3,
                question: "State three factors that cause variation in skill levels.",
                markScheme: "1 mark for each factor (Any 3 of):<br><ul><li>Age and maturity;</li><li>Culture;</li><li>Motivation;</li><li>Anxiety;</li><li>Arousal conditions;</li><li>Facilities;</li><li>Environment;</li><li>Teaching and coaching;</li></ul>",
                hint: "Think of our mnemonics: 'A.C.H.I.E.V.E.' or 'Athletes Can Master Any Activity From Excellent Teaching'.",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 4,
                question: "Explain, using examples, how two factors could cause variations in the skill level of performers.",
                markScheme: "1 mark for naming each factor (2 marks max). 1 mark for explaining the effect of each named factor (2 marks max):<br><ul><li><strong>Age / maturity:</strong> young performers may not have the experience or physical attributes to perform well;</li><li><strong>Culture:</strong> some cultures may restrict opportunities (e.g. females in mixed swimming) or promote national sports heavily;</li><li><strong>Motivation:</strong> a performer lacking motivation may drop out when training becomes difficult, whereas a highly motivated performer trains hard;</li><li><strong>Anxiety:</strong> naturally anxious performers may worry about letting teammates down or failing when watched;</li><li><strong>Arousal conditions:</strong> high arousal in an important event can lower focus or disrupt fine skills;</li><li><strong>Facilities:</strong> the availability, accessibility, and cost of facilities influence how often a person can train;</li><li><strong>Environment:</strong> living in an area with high snowfall enables a performer to ski more often than someone who has to travel;</li><li><strong>Teaching / coaching:</strong> higher quality coaching and more practice increases the speed of skill development;</li></ul>",
                hint: "Don't just list two factors! Name a factor for 1 mark, then explain how it actually raises or lowers a player's skill level for the 2nd mark.",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 4,
                question: "Explain how each of the following factors can affect a performer's skill level:<br>1. Age and maturity<br>2. Culture<br>3. Arousal conditions<br>4. Motivation",
                markScheme: "1 mark for each factor explained:<br><ul><li><strong>Age and maturity:</strong> some activities have age restrictions preventing young performers from participating / starting earlier gives more opportunity to learn / young children haven't developed coordination yet;</li><li><strong>Culture:</strong> certain sports have greater exposure or tradition in specific countries (e.g. cross-country skiing in Norway) or within families, leading to higher skill levels;</li><li><strong>Arousal conditions:</strong> underarousal or overarousal results in a lack of focus and lower skill levels, whereas optimal arousal leads to high focus and skill;</li><li><strong>Motivation:</strong> if a performer lacks motivation, they will not work hard in training or will give up easily when a skill is difficult to learn;</li></ul>",
                hint: "Link each of the four factors directly to why someone's skill level would become higher or lower.",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 4,
                question: "Use examples from four different physical activities to explain how each of the following factors can affect the skill level of a performer: Age and maturity, Culture, Arousal conditions, Facilities.",
                markScheme: "1 mark for explaining the effect of each factor. Physical activities must be appropriate and different:<br><ul><li><strong>Age and maturity (e.g. Rugby):</strong> rugby has age restrictions on contact/tackling for young players, or older players have more tactical experience;</li><li><strong>Culture (e.g. Cricket):</strong> cricket has high exposure and family tradition in certain countries, creating more opportunities to develop high skill levels;</li><li><strong>Arousal conditions (e.g. Netball):</strong> overarousal causes a lack of focus for a Goal Shooter performing fine shooting skills, lowering skill level;</li><li><strong>Facilities (e.g. Swimming):</strong> regular access to an affordable swimming pool increases training time and raises swimming skill levels;</li></ul>",
                hint: "Read carefully: you must name FOUR DIFFERENT sports (one for each factor) to get full marks!",
                isOfficial: true
            },
            {
                section: "Skill and ability",
                marks: 2,
                question: "Using the concept of ability and practice, explain why a performer with high natural ability may still not become a skilled performer.",
                markScheme: "<ul><li>Ability is only the innate genetic potential a person is born with (the 'hardware'). (1 mark)</li><li>Remembering that <strong>Ability + Practice = Skill</strong>, without quality teaching/coaching, motivation, or dedicated practice, innate abilities cannot be converted into refined, sport-specific skills. (1 mark)</li></ul>",
                hint: "Think about the equation on our Michael Jordan slide: Ability + ________ = Skill.",
                isOfficial: false
            },

            // ==========================================
            // 2. Skilled performance (6 Questions)
            // ==========================================
            {
                section: "Skilled performance",
                marks: 3,
                question: "State three characteristics of a skilled performance.",
                markScheme: "1 mark for each correct response (Any 3 of):<br><ul><li>Fluent;</li><li>Aesthetically pleasing;</li><li>Consistent;</li><li>Accurate;</li><li>Goal-directed;</li><li>Coordinated;</li></ul>",
                hint: "Think of the 6 traits we looked at with the Scott McTominay overhead kick slide.",
                isOfficial: true
            },
            {
                section: "Skilled performance",
                marks: 3,
                question: "Describe, using examples from a named physical activity, three characteristics of a skilled performance.",
                markScheme: "1 mark for each example used to show a characteristic in a named activity:<br><ul><li><strong>Fluent:</strong> performing a skill without hesitation / moving smoothly from one skill to another (e.g. a netball player catching a ball and pivoting immediately);</li><li><strong>Aesthetically pleasing:</strong> a movement looks good to the eye of a spectator or judge (e.g. a gymnast completing a twisting vault that looks effortless);</li><li><strong>Consistent:</strong> completing a skill repeatedly to a high standard (e.g. a tennis player landing a high proportion of first serves);</li><li><strong>Accurate:</strong> completing the task precisely without error (e.g. a basketball player scoring a free throw cleanly);</li><li><strong>Goal-directed:</strong> focusing on a specific target and showing determination to achieve it (e.g. a sprinter driving for a personal best);</li><li><strong>Coordinated:</strong> moving different parts of the body together efficiently with control (e.g. dribbling a basketball while running);</li></ul>",
                hint: "Pick ONE sport and give three concrete examples of what fluent, accurate, consistent, coordinated, goal-directed, or aesthetically pleasing looks like in that sport.",
                isOfficial: true
            },
            {
                section: "Skilled performance",
                marks: 4,
                question: "Describe, from a named physical activity, examples of each of the following characteristics of a skilled performance: Fluent, Consistent, Accurate, Goal-directed.",
                markScheme: "No mark for naming the activity. 1 mark for an example of each characteristic described (e.g. in Tennis):<br><ul><li><strong>Fluent:</strong> hitting the ball using a full swing of the racket in a smooth, flowing movement;</li><li><strong>Consistent:</strong> hitting most first serves with control into the opponent's service box repeatedly;</li><li><strong>Accurate:</strong> movements are precise so the player keeps the majority of shots close to the lines/in court;</li><li><strong>Goal-directed:</strong> showing determination to achieve a target, such as repeatedly hitting shots to an opponent's weaker backhand;</li></ul>",
                hint: "Stick to one sport (like tennis or basketball) and describe what each of those four specific words looks like on the court.",
                isOfficial: true
            },
            {
                section: "Skilled performance",
                marks: 4,
                question: "(i) Describe an example of one named characteristic of a skilled performance from rugby. (2)<br>(ii) Describe an example of a different named characteristic of a skilled performance from artistic gymnastics. (2)",
                markScheme: "<strong>(i) Rugby (1 mark for characteristic, 1 mark for example):</strong><br><ul><li>e.g. <strong>Accurate:</strong> kicking the ball successfully between the posts at a penalty; (Or <strong>Fluent:</strong> catching and passing without hesitation).</li></ul><strong>(ii) Artistic Gymnastics (1 mark for a DIFFERENT characteristic, 1 mark for example):</strong><br><ul><li>e.g. <strong>Aesthetically pleasing:</strong> holding a handstand with pointed toes that looks good and scores high marks with judges; (Or <strong>Coordinated:</strong> timing rotation and leg extension during a vault).</li></ul>",
                hint: "Make sure you use two DIFFERENT characteristics—one applied to rugby, and a different one applied to gymnastics.",
                isOfficial: true
            },
            {
                section: "Skilled performance",
                marks: 6,
                question: "An elite association football player is dribbling the ball past defenders. Explain how the elite player may show three named characteristics of a skilled performance.",
                markScheme: "1 mark for each named characteristic (max 3). 1 mark for each appropriate explanation (max 3):<br><ul><li><strong>Fluent:</strong> the player dribbles the ball smoothly at speed without hesitation or stumbling;</li><li><strong>Aesthetically pleasing:</strong> the close ball control and footwork look effortless and pleasing to spectators/coaches;</li><li><strong>Consistent:</strong> the player is able to control the ball well at all times throughout the match;</li><li><strong>Accurate:</strong> the player dribbles precisely into space away from opponents or passes directly to a teammate;</li><li><strong>Goal-directed:</strong> if the player loses the ball, they are determined to win it back / driving purposefully towards goal;</li><li><strong>Coordinated:</strong> the player is able to control the ball rapidly using both feet while maintaining balance;</li></ul>",
                hint: "You need 3 named characteristics (3 marks) + 3 explanations linked specifically to football dribbling (3 marks).",
                isOfficial: true
            },
            {
                section: "Skilled performance",
                marks: 2,
                question: "Explain the difference between 'accurate' and 'consistent' as characteristics of a skilled performance, using a basketball free throw as an example.",
                markScheme: "<ul><li><strong>Accurate:</strong> Performing the movement precisely without error on a single attempt—for example, the basketball going cleanly through the hoop without hitting the rim. (1 mark)</li><li><strong>Consistent:</strong> Being able to repeat that high standard of performance every time—for example, scoring 9 out of 10 free throws across a game. (1 mark)</li></ul>",
                hint: "One is about hitting the target precisely; the other is about doing it over and over again.",
                isOfficial: false
            },

            // ==========================================
            // 3. Skill classification continua (9 Questions)
            // ==========================================
            {
                section: "Skill classification continua",
                marks: 4,
                question: "Identify, from a named physical activity, one open skill and one closed skill. Justify your answers.",
                markScheme: "No mark for naming the activity. 1 mark for each skill identified (max 2). 1 mark for each justification (max 2).<br>For example, in <strong>Basketball</strong>:<br><ul><li><strong>Open skill:</strong> Dribbling the ball in a game (1 mark). <strong>Justification:</strong> Direction and speed depend on the constantly changing positions of defenders and teammates (1 mark).</li><li><strong>Closed skill:</strong> Free throw (1 mark). <strong>Justification:</strong> Taken from the same position every time, ring height is constant, and defenders cannot interfere (1 mark).</li></ul>",
                hint: "Open = affected by a changing environment (opponents, weather). Closed = stable environment, repeated the same way each time.",
                isOfficial: true
            },
            {
                section: "Skill classification continua",
                marks: 4,
                question: "Classify the skill of a tennis serve on each of the following continua. Justify your answers:<br>1. Open and closed<br>2. Basic and complex",
                markScheme: "<em>2 marks max. for each justification of an appropriate classification.</em><br><br>for example:<br><strong>opened and closed:</strong><br><em>the serve is closed because:</em><ul><li>the skill has similar actions each time;</li><li>the serve takes place from the same position;</li><li>net height is always the same / court size is the same;</li><li>the performer is in control of the pace and direction of the serve;</li></ul><br><strong>basic and complex:</strong><br><em>the serve is complex because:</em><ul><li>the serve requires high level of coordination / accuracy / precision;</li><li>the serve requires a high level of concentration;</li><li>the skill can only be produced well with practice;</li><li>the serve is a combination of multiple parts / sub-routines;</li><li>requires decision-making, e.g. where to serve the ball;</li></ul><br><em>Credit appropriate justifications if classified differently / partially, such as opponent may stand in different position.</em>",
                hint: "Who controls the timing of a tennis serve? And how many body parts/sub-routines have to work together to hit it?",
                isOfficial: true
            },
            {
                section: "Skill classification continua",
                marks: 4,
                question: "Explain, using an example of each, the difference between basic and complex skills.",
                markScheme: "Up to 2 marks for describing the difference. 1 mark for a basic example, 1 mark for a complex example:<br><ul><li><strong>Difference (up to 2 marks):</strong> Complex skills require higher levels of coordination, more accuracy/precision, more concentration, decision-making, and a combination of multiple sub-routines (whereas basic skills are simple with few sub-routines and minimal decision-making).</li><li><strong>Basic skill example (1 mark):</strong> Running / throwing / catching / jumping.</li><li><strong>Complex skill example (1 mark):</strong> Overhead kick in football / volleyball serve / gymnastics somersault.</li></ul>",
                hint: "Think about our Shaq vs Simone Biles slide: what makes a gymnastics vault complex compared to simple running?",
                isOfficial: true
            },
            {
                section: "Skill classification continua",
                marks: 4,
                question: "(a) Place the following three skills in order from Fine to Gross on the continuum: [A] Chest-pass in basketball, [B] Shot-put throw in athletics, [C] Short putt in golf. (2)<br>(b) Explain why some skills are classified as fine skills. (2)",

                marks: 6,
                question: "(a) A coach may demonstrate a skill as a form of visual guidance. Suggest two advantages and two disadvantages for a performer when visual guidance is used. (4)<br>(b) Identify an example of manual/mechanical guidance in a named physical activity and describe one advantage it provides. (2)",
                markScheme: "<strong>(a) Visual guidance (2 marks max for advantages, 2 marks max for disadvantages):</strong><br><ul><li><strong>Advantages:</strong> performer can see how it is done and build a mental image / demonstrations can be repeated or slowed down on video / skill can be broken into sub-routines;</li><li><strong>Disadvantages:</strong> people at the back of a large group may not see / a poor demonstration leads to copying bad technique / complex skills are hard to follow without verbal explanation / can demotivate if it looks too difficult;</li></ul><strong>(b) Manual/Mechanical (1 mark for example, 1 mark for advantage):</strong><br><ul><li><strong>Example:</strong> Using a harness in gymnastics/trampolining OR flotation aids in swimming OR coach guiding a golf swing;</li><li><strong>Advantage:</strong> Provides safety when practicing dangerous skills / builds confidence / helps develop a kinaesthetic feel for the movement;</li></ul>",
                hint: "(a) Give 2 pros and 2 cons of watching demonstrations. (b) Give 1 concrete example of manual/mechanical aid and 1 benefit.",
                isOfficial: true
            },
            {
                section: "Guidance",
                marks: 6,
                question: "Use examples from a named physical activity to describe how a coach may provide three named types of guidance to a performer.",
                markScheme: "1 mark for each named type of guidance (max 3). 1 mark for each relevant description in a named sport (max 3).<br>For example, in <strong>Gymnastics</strong> (or <strong>Swimming</strong>):<br><ul><li><strong>Visual:</strong> coach demonstrates a handstand / displays posters of a somersault / shows a video of a cartwheel / places floor targets for vault landing;</li><li><strong>Verbal:</strong> coach gives spoken instructions on how to perform a forward roll / uses questioning to check understanding;</li><li><strong>Manual:</strong> coach physically supports the gymnast's legs in a handstand or supports their hips during a cartwheel;</li><li><strong>Mechanical:</strong> coach uses a safety harness to reduce danger when learning a somersault (or floats in swimming);</li></ul>",
                hint: "Pick ONE sport (Gymnastics or Swimming are easiest!) and give a specific example for three of the four guidance types (Visual, Verbal, Manual, Mechanical).",
                isOfficial: true
            }
        ];

        // Conversational reflection prompts
        const reflectionPrompts = [
            "How did you do? Be honest with yourself—how many marks out of the total would you give your answer?",
            "Did anything in the mark scheme surprise you?",
            "If you dropped any marks here, what's your plan to make sure you nail it next time?",
            "Did you use the exact terminology? Often, close isn't quite enough in the exam.",
            "How could you have improved your answer to guarantee full marks?",
            "What was the trickiest part of this question for you?",
            "Which part of the mark scheme did you completely forget to include?",
            "How did you do? Are you confident to move on, or do you need to revisit this topic?"
        ];

        let currentQuestion = null;
        let recentQuestions = []; // Anti-repeat session tracker
        let bypassActive = false;

        // DOM Elements
        const sectionSelect = document.getElementById('section-select');
        const btnRandom = document.getElementById('btn-random');
        const questionContainer = document.getElementById('question-container');
        const displayQuestion = document.getElementById('display-question');
        const displayMarks = document.getElementById('display-marks');
        const userAnswer = document.getElementById('user-answer');
        const btnReveal = document.getElementById('btn-reveal');
        const btnHint = document.getElementById('btn-hint');
        const hintBox = document.getElementById('hint-box');
        const displayHint = document.getElementById('display-hint');
        const markSchemeContainer = document.getElementById('mark-scheme-container');
        const displayMarkScheme = document.getElementById('display-mark-scheme');
        const displayReflection = document.getElementById('display-reflection');
        const btnNext = document.getElementById('btn-next');
        
        // Traffic Light Elements
        const trafficBanner = document.getElementById('traffic-light-banner');
        const trafficDot = document.getElementById('traffic-light-dot');
        const trafficText = document.getElementById('traffic-light-text');

        // Modal Elements
        const customModal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalBtnPrimary = document.getElementById('modal-btn-primary');
        const modalBtnSecondary = document.getElementById('modal-btn-secondary');

        // Functions
        function showModal(title, message, primaryText, secondaryText, onPrimaryClick, onSecondaryClick) {
            modalTitle.textContent = title;
            modalMessage.innerHTML = message;
            
            modalBtnPrimary.textContent = primaryText;
            modalBtnPrimary.onclick = () => {
                hideModal();
                if (onPrimaryClick) onPrimaryClick();
            };
            
            if (secondaryText) {
                modalBtnSecondary.textContent = secondaryText;
                modalBtnSecondary.classList.remove('hidden');
                modalBtnSecondary.onclick = () => {
                    hideModal();
                    if (onSecondaryClick) onSecondaryClick();
                };
            } else {
                modalBtnSecondary.classList.add('hidden');
            }
            
            customModal.classList.remove('hidden');
        }
        
        function hideModal() {
            customModal.classList.add('hidden');
        }

        function loadQuestion() {
            const selectedSection = sectionSelect.value;
            let filteredQuestions = questions;
            
            if (selectedSection !== 'all') {
                filteredQuestions = questions.filter(q => q.section === selectedSection);
            }
            
            if (filteredQuestions.length === 0) {
                showModal("Oops!", "No questions found for this section.", "OK");
                return;
            }

            // Filter out recently asked questions to avoid immediate repeats
            let availableQuestions = filteredQuestions.filter(q => !recentQuestions.includes(q));
            
            // If all questions in this category have been shown recently, reset history
            if (availableQuestions.length === 0) {
                recentQuestions = [];
                availableQuestions = filteredQuestions;
            }

            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            currentQuestion = availableQuestions[randomIndex];

            // Track recent questions (store up to 4 recent picks)
            recentQuestions.push(currentQuestion);
            if (recentQuestions.length > 4) {
                recentQuestions.shift();
            }

            // Setup Traffic Light UI
            trafficBanner.classList.remove('bg-green-100', 'border-green-300', 'bg-amber-100', 'border-amber-300');
            trafficDot.classList.remove('bg-green-500', 'bg-amber-500');
            
            if (currentQuestion.isOfficial) {
                trafficBanner.classList.add('bg-green-100', 'border-green-300');
                trafficDot.classList.add('bg-green-500');
                trafficText.innerHTML = "Official Cambridge Mark Scheme. Highly reliable.";
            } else {
                trafficBanner.classList.add('bg-amber-100', 'border-amber-300');
                trafficDot.classList.add('bg-amber-500');
                trafficText.innerHTML = "Syllabus-aligned but AI-generated. Be extra sceptical at times—always check against course material and ask each other and Coach Jamie if you have doubts.";
            }

            // Reset UI
            displayQuestion.innerHTML = currentQuestion.question;
            displayMarks.textContent = `[${currentQuestion.marks} mark${currentQuestion.marks > 1 ? 's' : ''}]`;
            userAnswer.value = '';
            userAnswer.disabled = false;
            questionContainer.classList.remove('hidden');
            markSchemeContainer.classList.add('hidden');
            hintBox.classList.add('hidden');
            bypassActive = false;
        }

        function revealMarkScheme() {
            const answer = userAnswer.value.trim();
            
            // Check for empty box
            if (answer === '') {
                showModal(
                    "Hold up!", 
                    "Oh no you don't! You have to write <em>something</em> before I show you the answer.<br><br>If that something is 'I don't know', that's fine, but take note: this is obviously an area you need to revisit again later.", 
                    "Try again"
                );
                return;
            }

            // Check for "I don't know" variants
            const idkVariants = ["i don't know", "idk", "i dunno", "no idea", "pass"];
            const isIdk = idkVariants.some(variant => answer.toLowerCase().includes(variant));
            
            if (isIdk) {
                processReveal();
                return;
            }

            // Word count validation (approx > 50% of mark scheme words)
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = currentQuestion.markScheme;
            const markSchemeText = tempDiv.textContent || tempDiv.innerText || "";
            
            const msWordCount = markSchemeText.split(/\s+/).filter(word => word.length > 0).length;
            const answerWordCount = answer.split(/\s+/).filter(word => word.length > 0).length;

            if (!bypassActive && (answerWordCount < (msWordCount * 0.5))) {
                showModal(
                    "Are you sure?", 
                    "Your answer looks a bit brief compared to what the examiner is looking for. <br><br>Have you given it your best shot?", 
                    "Sorry Coach, that's all I've got. Show me the mark scheme; I'll be honest with myself and come back better!", 
                    "Let me back in Coach, I've got more to say",
                    () => {
                        bypassActive = true;
                        processReveal();
                    },
                    () => {
                        userAnswer.focus();
                    }
                );
                return;
            }

            processReveal();
        }

        function processReveal() {
            displayMarkScheme.innerHTML = currentQuestion.markScheme;
            
            // Generate Random Reflection Prompt
            const randomPrompt = reflectionPrompts[Math.floor(Math.random() * reflectionPrompts.length)];
            displayReflection.textContent = randomPrompt;

            userAnswer.disabled = true;
            markSchemeContainer.classList.remove('hidden');
            
            // Scroll to mark scheme smoothly
            markSchemeContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Event Listeners
        btnRandom.addEventListener('click', loadQuestion);
        
        btnHint.addEventListener('click', () => {
            if (currentQuestion && currentQuestion.hint) {
                displayHint.textContent = currentQuestion.hint;
                hintBox.classList.remove('hidden');
            }
        });

        btnReveal.addEventListener('click', revealMarkScheme);
        btnNext.addEventListener('click', loadQuestion);

        // Close modal if clicking outside the box
        customModal.addEventListener('click', (e) => {
            if (e.target === customModal) {
                hideModal();
            }
        });

    </script>
</body>
</html>
