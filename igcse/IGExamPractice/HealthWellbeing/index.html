<body class="min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Header -->
    <header class="w-full max-w-4xl bg-white rounded-t-xl shadow-md p-6 border-b-4 border-cdlRed flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
            <div class="mb-2">

                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>

                </a>
            </div>
            <h1 class="text-3xl font-light text-cdlBlue mb-1">IGCSE <span class="highlight-text font-bold">Physical Education</span></h1>

        </div>
        <div class="hidden sm:block flex-shrink-0">
            <img src="../../images/athletics-logo.png" alt="Collège du Léman Athletics" class="h-16 w-auto object-contain">

    <!-- Main Content -->
    <main class="w-full max-w-4xl bg-white shadow-lg rounded-b-xl p-6 md:p-8 flex flex-col space-y-6">
        
        <!-- Controls -->
        <div class="flex flex-col sm:flex-row gap-4 items-center justify-between bg-gray-50 p-4 rounded-lg border border-gray-200">
            <div class="w-full sm:w-2/3">
                <label for="section-select" class="block text-sm font-bold text-cdlBlue mb-2">Select Syllabus Section:</label>
                <select id="section-select" class="w-full h-12 px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-cdlBrightBlue text-base cursor-pointer">
                    <option value="all">All Sections (Random - 50 Questions)</option>
                    <optgroup label="(2.1) Health, Well-being & Fitness">
                        <option value="Health and well-being">&nbsp;&nbsp;&nbsp;&nbsp;Health and well-being (The 3-Legged Stool)</option>
                        <option value="Fitness">&nbsp;&nbsp;&nbsp;&nbsp;Fitness & The Relationship with Health</option>
                    </optgroup>
                    <optgroup label="(2.2) Diet & Energy Sources">
                        <option value="Nutrients and food sources">&nbsp;&nbsp;&nbsp;&nbsp;Nutrients, Water & Food Sources</option>
                        <option value="Energy balance and needs">&nbsp;&nbsp;&nbsp;&nbsp;Energy Balance & Different Energy Needs</option>
                        <option value="Energy storage and respiration">&nbsp;&nbsp;&nbsp;&nbsp;The Bank of Energy (Storage & Respiration)</option>
                    </optgroup>
                </select>
            </div>
            <div class="w-full sm:w-1/3 flex justify-end">
                <button id="btn-random" class="w-full h-12 sm:w-auto btn-blue px-6 py-2 mt-auto rounded-md font-bold shadow-md">
                    Load Question
                </button>
            </div>
        </div>

        <!-- Question Display -->
        <div id="question-container" class="hidden flex flex-col space-y-4">
            
            <!-- Traffic Light Indicator -->
            <div id="traffic-light-banner" class="flex items-start p-3 rounded-md border text-sm font-bold w-full transition-colors">
                <div id="traffic-light-dot" class="w-4 h-4 rounded-full mr-3 mt-0.5 flex-shrink-0"></div>
                <div id="traffic-light-text" class="text-gray-700 leading-tight"></div>
            </div>

            <div class="flex justify-between items-start pt-2">
                <h3 class="text-xl font-bold text-cdlBlue leading-snug" id="display-question">Question goes here</h3>
                <span id="display-marks" class="bg-cdlRed text-white text-sm font-bold px-3 py-1 rounded-full whitespace-nowrap ml-4"></span>
            </div>
            
            <div class="flex flex-col space-y-2">
                <label for="user-answer" class="text-sm font-bold text-gray-600">Your Answer:</label>
                <textarea id="user-answer" rows="5" class="w-full p-4 border-2 border-gray-200 rounded-md focus:outline-none focus:border-cdlBrightBlue resize-none text-gray-800" placeholder="Type your answer here..."></textarea>
            </div>

            <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mt-2">
                <button id="btn-hint" class="text-cdlBlue font-bold underline hover:text-cdlBrightBlue text-sm flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z" />

            <!-- Hint Box -->
            <div id="hint-box" class="hidden bg-cdlBrightYellow bg-opacity-30 border-l-4 border-cdlGold p-4 rounded-r-md mt-4">
                <p class="text-sm text-gray-600 mb-2 italic"><strong>Note:</strong> If you're asking for a hint, you should probably come back here later to see if you can manage without one!</p>
                <p id="display-hint" class="font-bold text-cdlBlue"></p>
            </div>
        </div>

        <!-- Mark Scheme Display -->
        <div id="mark-scheme-container" class="hidden mt-6 border-t-2 border-gray-100 pt-6">
            <h3 class="text-lg font-bold text-cdlRed mb-3 flex items-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>

            </h3>
            <div id="display-mark-scheme" class="bg-gray-50 p-5 rounded-md border border-gray-200 text-gray-800 leading-relaxed prose max-w-none">

            </div>

            <!-- Metacognitive Prompt -->
            <div class="mt-6 bg-cdlBlue text-white p-5 rounded-md shadow-inner">
                <h4 class="font-bold text-cdlBrightBlue mb-2 text-sm uppercase tracking-wider">Reflection</h4>
                <p id="display-reflection" class="text-lg font-light"></p>
            </div>
            
            <div class="mt-6 flex justify-end">
                <button id="btn-next" class="btn-blue px-6 py-3 rounded-md font-bold shadow-md flex items-center">
                    Next Question
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                    </svg>
                </button>
            </div>
        </div>

    </main>

    <!-- Custom Modal -->
    <div id="custom-modal" class="fixed inset-0 modal-overlay z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6 border-t-8 border-cdlRed transform transition-all">
            <h3 id="modal-title" class="text-2xl font-bold text-cdlBlue mb-2">Notice</h3>
            <p id="modal-message" class="text-gray-600 mb-6 leading-relaxed"></p>
            <div class="flex flex-col space-y-3 mt-4">
                <button id="modal-btn-secondary" class="px-4 py-2 rounded-md font-bold text-gray-600 border border-gray-300 hover:bg-gray-100 hidden text-sm"></button>
                <button id="modal-btn-primary" class="btn-blue px-6 py-2 rounded-md font-bold shadow-sm text-sm"></button>
            </div>
        </div>
    </div>

    <script>
        const questions = [
            // ==========================================
            // 1. Health and well-being (10 Questions)
            // ==========================================
            {
                section: "Health and well-being",
                marks: 2,
                question: "Identify the missing words in the following World Health Organization (WHO) definition of health:<br>'a state of complete physical, .......................................... and social well-being and not merely the absence of .......................................... or infirmity'.",
                markScheme: "<em>1 mark for each correct word:</em><ul><li><strong>mental</strong> (1 mark)</li><li><strong>disease</strong> (1 mark)</li></ul>",
                hint: "Think of the 3-legged stool from your workbook (💪 Physical, 🧠 ________, 🤝 Social) and what health is NOT merely the absence of!",
                isOfficial: true
            },
            {
                section: "Health and well-being",
                marks: 2,
                question: "State the World Health Organization (WHO) definition of health.",
                markScheme: "<ul><li>A state of complete physical, mental and social well-being (1 mark)</li><li>and not merely the absence of disease or infirmity. (1 mark)</li></ul>",
                hint: "Include all three legs of the 3-legged stool (💪 🧠 🤝) for the first mark, and the 'not merely the absence of...' phrase for the second mark.",
                isOfficial: true
            },
            {
                section: "Health and well-being",
                marks: 2,
                question: "Describe two requirements for good social health and well-being.",
                markScheme: "<em>1 mark for each description.<br>Any 2 of:</em><ul><li>essential human needs are met;</li><li>friendship and support;</li><li>having value within society;</li><li>ability to mix with other people;</li></ul>",
                hint: "This was the 'Retrieval' question in our slides! Think of the 🤝 Social leg of the stool: friends, mixing with others, feeling valued, and basic needs.",
                isOfficial: true
            },
            {
                section: "Health and well-being",
                marks: 3,
                question: "Describe three characteristics of a person with good physical health and well-being.",
                markScheme: "<em>1 mark for each characteristic:</em><ul><li>all body systems working well / properly;</li><li>free from illness / injury / disease;</li><li>able to carry out everyday tasks;</li></ul>",
                hint: "Look at the 💪 Physical leg of the 3-legged stool in your workbook: body systems, illness/injury, and daily tasks.",
                isOfficial: true
            },
            {
                section: "Health and well-being",
                marks: 3,
                question: "Describe three characteristics of a person with good mental health and well-being.",
                markScheme: "<em>1 mark for each characteristic:</em><ul><li>able to cope with stress;</li><li>can control emotions;</li><li>feeling good / positive self-esteem;</li></ul>",
                hint: "Look at the 🧠 Mental leg of the 3-legged stool in your workbook: stress, emotions, and self-esteem.",
                isOfficial: true
            },
            {
                section: "Health and well-being",
                marks: 3,
                question: "Explain one physical, one mental and one social benefit of regular exercise.",
                markScheme: "<em>Award 1 mark for each correctly explained benefit:</em><ul><li><strong>Physical:</strong> improved cardiovascular fitness / stronger body systems / maintaining a healthy body mass / reduced risk of illness or disease; (1 mark)</li><li><strong>Mental:</strong> reduced stress or anxiety / increased self-esteem and confidence / improved emotional control / release of endorphins (feeling good); (1 mark)</li><li><strong>Social:</strong> making friendships / building support networks / mixing with others in a team or club / feeling valued within a group; (1 mark)</li></ul>",
                hint: "This was the 'Still here? True champion!' question at the end of our slides. Give one clear benefit for each leg of the 3-legged stool!",
                isOfficial: true
            },
            {
                section: "Health and well-being",
                marks: 3,
                question: "A student joins an after-school basketball club. Suggest how taking part in this club could improve their physical, mental, and social health and well-being.",
                markScheme: "<ul><li><strong>Physical (1 mark):</strong> improves cardiovascular endurance/stamina, muscular strength, or helps maintain a healthy weight so everyday tasks are easier;</li><li><strong>Mental (1 mark):</strong> relieves school exam stress, boosts self-esteem when learning new skills, or helps them control emotions when winning/losing;</li><li><strong>Social (1 mark):</strong> allows them to mix with other students, make new friends, and feel valued as part of a team;</li></ul>",
                hint: "Apply the three legs of the health stool (💪 Physical, 🧠 Mental, 🤝 Social) directly to playing in a school basketball team.",
                isOfficial: false
            },
            {
                section: "Health and well-being",
                marks: 3,
                question: "Categorise the following three statements into Physical, Mental, or Social health and well-being:<br>1. Able to control emotions during a close match.<br>2. All body systems working well.<br>3. Having a strong support network and friendships.",
                markScheme: "<ul><li><strong>1:</strong> Mental health and well-being (1 mark)</li><li><strong>2:</strong> Physical health and well-being (1 mark)</li><li><strong>3:</strong> Social health and well-being (1 mark)</li></ul>",
                hint: "Match each statement to the correct leg of the 3-legged stool from page 1 of your workbook!",
                isOfficial: false
            },
            {
                section: "Health and well-being",
                marks: 2,
                question: "Explain how suffering from a serious long-term injury could negatively affect both a performer's mental health and their social health.",
                markScheme: "<ul><li><strong>Mental health (1 mark):</strong> The performer may suffer from high stress, anxiety, or low self-esteem because they cannot compete or play the sport they enjoy.</li><li><strong>Social health (1 mark):</strong> Being side-lined prevents them from training and mixing with teammates, leading to isolation and feeling less valued within the team.</li></ul>",
                hint: "Remember: if you remove the Physical leg of the 3-legged stool (injury), how does it make the Mental and Social legs wobble?",
                isOfficial: false
            },
            {
                section: "Health and well-being",
                marks: 3,
                question: "State three lifestyle choices a person should make to help maintain good health and well-being.",
                markScheme: "<em>1 mark for each syllabus point:</em><ul><li>live a healthy, active lifestyle (avoiding a sedentary lifestyle / smoking / alcohol);</li><li>eat a balanced diet;</li><li>maintain a level of fitness to help maintain health (and get sufficient sleep/hydration);</li></ul>",
                hint: "Think of the 'Exit Ticket' from our slides: what are the 3 core things the syllabus says we need to do to maintain health?",
                isOfficial: false
            },

            // ==========================================
            // 2. Fitness (10 Questions)
            // ==========================================
            {
                section: "Fitness",
                marks: 1,
                question: "Define the term 'fitness'.",
                markScheme: "<ul><li>The ability to cope with (or meet) the demands of the environment; (1 mark)</li></ul>",
                hint: "Remember the slide 'Which is the best car to take my bike to the race?' 🚴‍♂️🚗🏎️ It's all about meeting the demands of your...",
                isOfficial: true
            },
            {
                section: "Fitness",
                marks: 2,
                question: "Explain how health can affect fitness levels.",
                markScheme: "<em>1 mark for each explanation (Any 2 of):</em><ul><li>good health means a performer can train regularly and harder, so fitness increases;</li><li>ill health / injury means a performer is unable to train (or trains at a lower intensity), so fitness decreases;</li><li>some illnesses / disabilities still allow training to happen, so fitness may still increase despite ill health;</li><li>smoking damages the lungs so cardiovascular fitness decreases;</li><li>obesity makes it harder to train so fitness decreases;</li><li>poor diet may not provide enough energy for training so fitness decreases;</li><li>good mental health may increase motivation to train so fitness increases;</li></ul>",

                isOfficial: true

            {
                section: "Fitness",

            {
                section: "Fitness",

                hint: "Think of Benji on the racing trike! Why is he considered extremely fit even if one leg of the health stool is affected?",
                isOfficial: false
            },
            {
                section: "Fitness",
                marks: 2,
                question: "Using an example, explain how ill health can lead to decreased fitness.",
                markScheme: "<ul><li>If a performer suffers from an illness (such as flu/infection) or a severe injury, or poor mental health (lack of motivation), they may be unable to train. (1 mark)</li><li>Stopping training leads to reversibility, causing their cardiovascular endurance and muscular strength (fitness) to decrease. (1 mark)</li></ul>",
                hint: "Remember the slide 'Less of this (Health) -> Means less of this (Training) -> Means less of this (Fitness)'.",
                isOfficial: false
            },
            {
                section: "Fitness",
                marks: 2,
                question: "Explain why the 'demands of the environment' mean that a marathon runner and a 100m sprinter both have high fitness, even though their physical abilities are very different.",
                markScheme: "<ul><li>Fitness is the ability to cope with the specific demands of your environment. (1 mark)</li><li>The marathon runner's body is adapted to meet the demand of 42km of continuous aerobic running, while the sprinter's body is adapted to meet the demand of 10 seconds of explosive anaerobic power. (1 mark)</li></ul>",
                hint: "Remember the Ferrari vs the family estate car slide: which car is 'best' depends entirely on whether your environment is a race track or carrying a bike!",
                isOfficial: false
            },
            {
                section: "Fitness",
                marks: 2,
                question: "Explain how poor mental health (such as high anxiety or low self-esteem) can negatively affect a performer's physical fitness.",
                markScheme: "<ul><li>Poor mental health can reduce a performer's motivation and drive to attend training sessions or exert themselves fully. (1 mark)</li><li>Because they train less frequently or at a lower intensity, their physical fitness levels will decrease. (1 mark)</li></ul>",
                hint: "Link the 🧠 Mental leg of the stool to motivation to train, and then to fitness levels.",
                isOfficial: false
            },
            {
                section: "Fitness",
                marks: 2,
                question: "Explain why an elite endurance athlete who overtrains and catches a respiratory infection may still be fitter than an average healthy person.",

                hint: "Health and fitness are linked, but they are NOT the same thing! Compare an elite athlete with a cold to a healthy couch potato.",
                isOfficial: false

            {
                section: "Fitness",
                marks: 2,
                question: "State two ways that maintaining a high level of physical fitness helps to maintain good physical health.",

                hint: "How does staying fit protect the 💪 Physical leg of your health stool?",
                isOfficial: false
            },
            {
                section: "Fitness",
                marks: 2,
                question: "Explain how a sedentary lifestyle affects both a person's fitness and their long-term health.",

                isOfficial: false

            // ==========================================

            // ==========================================

                section: "Nutrients and food sources",
                marks: 3,

        // Conversational reflection prompts
        const reflectionPrompts = [
            "How did you do? Be honest with yourself—how many marks out of the total would you give your answer?",
            "Did anything in the mark scheme surprise you?",
            "If you dropped any marks here, what's your plan to make sure you nail it next time?",
            "Did you use the exact terminology? Often, close isn't quite enough in the exam.",
            "How could you have improved your answer to guarantee full marks?",
            "What was the trickiest part of this question for you?",
            "Which part of the mark scheme did you completely forget to include?",
            "How did you do? Give yourself an honest rating: 🤩 (Could teach it), 👍 (Mostly got it), or 📚 (Need to revise)!"
        ];

        let currentQuestion = null;
        let recentQuestions = []; // Anti-repeat session tracker
        let bypassActive = false;

        // DOM Elements
        const sectionSelect = document.getElementById('section-select');
        const btnRandom = document.getElementById('btn-random');
        const questionContainer = document.getElementById('question-container');
        const displayQuestion = document.getElementById('display-question');
        const displayMarks = document.getElementById('display-marks');
        const userAnswer = document.getElementById('user-answer');
        const btnReveal = document.getElementById('btn-reveal');
        const btnHint = document.getElementById('btn-hint');
        const hintBox = document.getElementById('hint-box');
        const displayHint = document.getElementById('display-hint');
        const markSchemeContainer = document.getElementById('mark-scheme-container');
        const displayMarkScheme = document.getElementById('display-mark-scheme');
        const displayReflection = document.getElementById('display-reflection');
        const btnNext = document.getElementById('btn-next');
        
        // Traffic Light Elements
        const trafficBanner = document.getElementById('traffic-light-banner');
        const trafficDot = document.getElementById('traffic-light-dot');
        const trafficText = document.getElementById('traffic-light-text');

        // Modal Elements
        const customModal = document.getElementById('custom-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalMessage = document.getElementById('modal-message');
        const modalBtnPrimary = document.getElementById('modal-btn-primary');
        const modalBtnSecondary = document.getElementById('modal-btn-secondary');

        // Functions
        function showModal(title, message, primaryText, secondaryText, onPrimaryClick, onSecondaryClick) {
            modalTitle.textContent = title;
            modalMessage.innerHTML = message;
            
            modalBtnPrimary.textContent = primaryText;
            modalBtnPrimary.onclick = () => {
                hideModal();
                if (onPrimaryClick) onPrimaryClick();
            };
            
            if (secondaryText) {
                modalBtnSecondary.textContent = secondaryText;
                modalBtnSecondary.classList.remove('hidden');
                modalBtnSecondary.onclick = () => {
                    hideModal();
                    if (onSecondaryClick) onSecondaryClick();
                };
            } else {
                modalBtnSecondary.classList.add('hidden');
            }
            
            customModal.classList.remove('hidden');
        }
        
        function hideModal() {
            customModal.classList.add('hidden');
        }

        function loadQuestion() {
            const selectedSection = sectionSelect.value;
            let filteredQuestions = questions;
            
            if (selectedSection !== 'all') {
                filteredQuestions = questions.filter(q => q.section === selectedSection);
            }
            
            if (filteredQuestions.length === 0) {
                showModal("Oops!", "No questions found for this section.", "OK");
                return;
            }

            // Filter out recently asked questions to avoid immediate repeats
            let availableQuestions = filteredQuestions.filter(q => !recentQuestions.includes(q));
            
            // If all questions in this category have been shown recently, reset history
            if (availableQuestions.length === 0) {
                recentQuestions = [];
                availableQuestions = filteredQuestions;
            }

            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            currentQuestion = availableQuestions[randomIndex];

            // Track recent questions (store up to 4 recent picks)
            recentQuestions.push(currentQuestion);
            if (recentQuestions.length > 4) {
                recentQuestions.shift();
            }

            // Setup Traffic Light UI
            trafficBanner.classList.remove('bg-green-100', 'border-green-300', 'bg-amber-100', 'border-amber-300');
            trafficDot.classList.remove('bg-green-500', 'bg-amber-500');
            
            if (currentQuestion.isOfficial) {
                trafficBanner.classList.add('bg-green-100', 'border-green-300');
                trafficDot.classList.add('bg-green-500');
                trafficText.innerHTML = "Official Cambridge Mark Scheme. Highly reliable.";
            } else {
                trafficBanner.classList.add('bg-amber-100', 'border-amber-300');
                trafficDot.classList.add('bg-amber-500');
                trafficText.innerHTML = "Syllabus-aligned & Workbook-matched. Always check against course material and ask each other and Coach Jamie if you have doubts.";
            }

            // Reset UI
            displayQuestion.innerHTML = currentQuestion.question;
            displayMarks.textContent = `[${currentQuestion.marks} mark${currentQuestion.marks > 1 ? 's' : ''}]`;
            userAnswer.value = '';
            userAnswer.disabled = false;
            questionContainer.classList.remove('hidden');
            markSchemeContainer.classList.add('hidden');
            hintBox.classList.add('hidden');
            bypassActive = false;
        }

        function revealMarkScheme() {
            const answer = userAnswer.value.trim();
            
            // Check for empty box
            if (answer === '') {
                showModal(
                    "Hold up!", 
                    "Oh no you don't! You have to write <em>something</em> before I show you the answer.<br><br>If that something is 'I don't know', that's fine, but take note: this is obviously an area you need to revisit again later.", 
                    "Try again"
                );
                return;
            }

            // Check for "I don't know" variants
            const idkVariants = ["i don't know", "idk", "i dunno", "no idea", "pass"];
            const isIdk = idkVariants.some(variant => answer.toLowerCase().includes(variant));
            
            if (isIdk) {
                processReveal();
                return;
            }

            // Word count validation (scales reasonably with question marks)
            const tempDiv = document.createElement("div");
            tempDiv.innerHTML = currentQuestion.markScheme;
            const markSchemeText = tempDiv.textContent || tempDiv.innerText || "";
            
            const msWordCount = markSchemeText.split(/\s+/).filter(word => word.length > 0).length;
            const answerWordCount = answer.split(/\s+/).filter(word => word.length > 0).length;
            const expectedMinWords = Math.min(currentQuestion.marks * 6, msWordCount * 0.4);

            if (!bypassActive && (answerWordCount < expectedMinWords)) {
                showModal(
                    "Are you sure?", 
                    "Your answer looks a bit brief compared to what the examiner is looking for. <br><br>Have you given it your best shot?", 
                    "Sorry Coach, that's all I've got. Show me the mark scheme; I'll be honest with myself and come back better!", 
                    "Let me back in Coach, I've got more to say",
                    () => {
                        bypassActive = true;
                        processReveal();
                    },
                    () => {
                        userAnswer.focus();
                    }
                );
                return;
            }

            processReveal();
        }

        function processReveal() {
            displayMarkScheme.innerHTML = currentQuestion.markScheme;
            
            // Generate Random Reflection Prompt
            const randomPrompt = reflectionPrompts[Math.floor(Math.random() * reflectionPrompts.length)];
            displayReflection.textContent = randomPrompt;

            userAnswer.disabled = true;
            markSchemeContainer.classList.remove('hidden');
            
            // Scroll to mark scheme smoothly
            markSchemeContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Event Listeners
        btnRandom.addEventListener('click', loadQuestion);
        
        btnHint.addEventListener('click', () => {
            if (currentQuestion && currentQuestion.hint) {
                displayHint.textContent = currentQuestion.hint;
                hintBox.classList.remove('hidden');
            }
        });

        btnReveal.addEventListener('click', revealMarkScheme);
        btnNext.addEventListener('click', loadQuestion);

        // Close modal if clicking outside the box
        customModal.addEventListener('click', (e) => {
            if (e.target === customModal) {
                hideModal();
            }
        });

    </script>
